<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>StayBUT 문의</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#fff; --soft:#fafaf9; --line:#e8e6e1; --line2:#d6d3cd; --text:#1a1815; --soft-text:#57534c; --muted:#78736b; --ink:#1f1f23; --ink-hover:#161619; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--soft); font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif; color:var(--text); }
  #app{ display:flex; flex-direction:column; height:100dvh; max-width:520px; margin:0 auto; background:#fff; }
  header{ background:#fff; color:#111; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid #ededed; text-align:center; }
  header .htitle{ font-size:16px; font-weight:600; letter-spacing:-0.01em; }
  header .hsub{ font-size:11px; color:#9a9a9e; margin-top:2px; }
  #msgs{ flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:2px; background:#fff; }
  .row{ display:flex; } .row.g{ justify-content:flex-end; }
  .b{ max-width:76%; padding:8px 13px; font-size:15px; line-height:1.35; border-radius:18px; word-break:break-word; white-space:pre-wrap; }
  .row{ margin-top:2px; }
  .row.s .b{ background:#E9E9EB; color:#000; }
  .row.g .b{ background:#0A84FF; color:#fff; }
  .b.img{ padding:4px; }
  .b img{ display:block; max-width:220px; max-height:260px; border-radius:11px; cursor:pointer; }
  .time{ font-size:10px; color:#a0a0a5; align-self:flex-end; margin:0 7px; }
  .daydiv{ align-self:center; font-size:11px; color:#9a9a9e; margin:12px 0 7px; font-weight:500; }
  .readmark{ align-self:flex-end; font-size:10px; color:#a0a0a5; margin:1px 7px 3px; }
  .typing{ display:inline-flex; gap:4px; align-items:center; background:#E9E9EB; padding:11px 14px; border-radius:18px; }
  .typing i{ width:7px; height:7px; border-radius:50%; background:#b3b3b8; display:inline-block; animation:tb 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes tb{ 0%,60%,100%{ opacity:.3; } 30%{ opacity:1; } }
  #attach{ width:34px; height:34px; flex-shrink:0; border:none; border-radius:50%; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#8a8a8e; }
  #lb{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:50; }
  #lb img{ max-width:94vw; max-height:94vh; border-radius:8px; }
  .sys{ align-self:center; background:#efece7; color:var(--soft-text); font-size:12px; padding:7px 14px; border-radius:999px; margin:4px 0; text-align:center; max-width:92%; line-height:1.5; }
  footer{ display:flex; gap:8px; align-items:flex-end; padding:9px 10px calc(9px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid #ededed; }
  #inp{ flex:1; border:1px solid #d9d9de; border-radius:20px; padding:9px 14px; font-size:16px; outline:none; resize:none; max-height:120px; font-family:inherit; background:#fff; }
  #inp:focus{ border-color:#b6b6bb; }
  #send{ width:34px; height:34px; flex-shrink:0; border:none; border-radius:50%; background:#0A84FF; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #send:disabled{ background:#cfcfd4; }
  #att{ width:46px; height:46px; flex-shrink:0; border:1px solid var(--line2); border-radius:50%; background:#fff; color:var(--soft-text); font-size:19px; cursor:pointer; }
  .b.img{ padding:4px; }
  .b.img img{ display:block; max-width:210px; max-height:260px; border-radius:12px; cursor:pointer; }
  #consent{ position:fixed; inset:0; background:var(--soft); display:flex; flex-direction:column; justify-content:center; padding:28px 24px calc(28px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  #consent .wm{ display:inline-block; background:var(--ink); padding:6px 10px; border-radius:8px; align-self:flex-start; }
  #consent .wm img{ height:22px; display:block; }
  #consent h1{ font-size:21px; margin:18px 0 6px; letter-spacing:-0.01em; }
  #consent p{ font-size:13.5px; color:var(--soft-text); line-height:1.6; margin:0 0 14px; }
  #consent .box{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:12.5px; color:var(--soft-text); line-height:1.65; margin-bottom:18px; }
  #consent input{ width:100%; border:1px solid var(--line2); border-radius:12px; padding:14px; font-size:16px; outline:none; margin-bottom:12px; font-family:inherit; }
  #consent input:focus{ border-color:var(--ink); }
  #consent button{ border:none; background:var(--ink); color:#fff; border-radius:12px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; width:100%; }
#consent .c-lang{width:auto;border:1px solid var(--line2);background:#fff;color:#555;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;} #consent .c-lang.on{background:var(--ink);color:#fff;border-color:var(--ink);}
</style>
</head>
<body>
<div id="consent">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
    <img id="c-logo" alt="Stay BUT" style="width:46px;height:46px;border-radius:11px;background:#16161b;display:block;flex:none;" />
    <h1 id="c-room" style="margin:0;">Stay BUT</h1>
  </div>
  <div id="c-langs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">
    <button type="button" class="c-lang" data-lang="ko">한국어</button>
    <button type="button" class="c-lang" data-lang="en">EN</button>
    <button type="button" class="c-lang" data-lang="zh">中文</button>
    <button type="button" class="c-lang" data-lang="ja">日本語</button>
  </div>
  <p id="c-sub">궁금하신 점을 실시간으로 도와드려요. 시작하기 전 아래 안내를 확인해 주세요.</p>
  <div class="box" id="c-box"></div>
  <div id="c-hours" style="font-size:13.5px;color:#16161b;font-weight:700;margin:2px 2px 14px;display:flex;align-items:center;gap:6px;"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none;"></span><span id="c-hours-t">상담 가능 시간 · 09:00 ~ 21:00</span></div>
  <input id="c-code" type="text" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="접속코드" style="letter-spacing:3px;font-weight:700;text-align:center;" />
  <div id="c-codehint" style="font-size:12.5px;color:#8a8a8e;line-height:1.55;margin:-4px 0 12px;">체크인 안내에서 받은 접속코드를 입력해 주세요.</div>
  <input id="c-email" type="email" inputmode="email" autocomplete="email" placeholder="이메일 (선택) · 답장을 메일로 받기" />
  <div id="c-hint" style="font-size:12.5px;color:#8a8a8e;line-height:1.55;margin:-4px 0 12px;">처음에 이메일을 작성해 주시면, 상담원 답변을 메일로도 전달드려요.</div>
  <div id="c-err" style="color:#e0484e;font-size:12.5px;margin:2px 0 8px;min-height:15px;"></div>
  <button id="agreeBtn">동의하고 문의 시작</button>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="htitle" id="h-room">StayBUT</div>
    <div class="hsub">실시간 문의</div>
  </header>
  <div id="msgs"><div class="sys" id="hint">연결 중…</div></div>
  <footer>
    <button id="attach" title="사진 보내기" aria-label="사진 보내기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></button>
    <textarea id="inp" rows="1" placeholder="메시지 입력…" autocomplete="off"></textarea>
    <button id="send" disabled aria-label="전송"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5"/><path d="M5 12l7-7 7 7"/></svg></button>
  </footer>
</div>
<div id="lb"><img id="lbimg" /></div>
<input type="file" id="fileInput" accept="image/*" style="display:none" />

const EDGE=SB_URL+'/functions/v1/chat-media';

async function edgeCall(payload){

  return r.json();
}
async function signGuest(path){

}

function stopFlash(){ if(_flashInt){ clearInterval(_flashInt); _flashInt=null; document.title=_origTitle; } }

function playDing(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const c=new AC(); const o=c.createOscillator(), g=c.createGain(); o.connect(g); g.connect(c.destination); o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(0.18,c.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.32); o.start(); o.stop(c.currentTime+0.33); setTimeout(()=>{ try{ c.close(); }catch(e){} },500); }catch(e){} }

function urlB64(b64){ const pad='='.repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(s); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr; }
let _pushDone=false;
async function enableGuestPush(){
  if(_pushDone || !convId) return;
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg=await navigator.serviceWorker.register('sw.js');
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64(VAPID_PUBLIC) });
    const j=sub.toJSON();
    await db.rpc('chat_guest_push_subscribe',{ p_conv:convId, p_token:token, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_url:location.href });
    _pushDone=true;
  }catch(e){}
}
async function askNotifPerm(){
  try{
    if(!('Notification' in window)) return;
    if(Notification.permission==='default'){ await Notification.requestPermission(); }
    if(Notification.permission==='granted'){ enableGuestPush(); }
  }catch(e){}
}
function notifyGuest(m){
  playDing(); flashTitle();
  if(document.hidden && ('Notification' in window) && Notification.permission==='granted'){
    try{ const body=(m.msg_type==='image')?'📷 사진을 보냈어요':(m.body||'새 메시지'); const n=new Notification('StayBUT 상담 답장',{ body, tag:'staybut-chat' }); n.onclick=()=>{ try{ window.focus(); }catch(e){} stopFlash(); n.close(); }; }catch(e){} }
}

const TR_EDGE=SB_URL+'/functions/v1/translate';
const _transCache={};
function guestLang(){
  const l=(navigator.language||'en').toLowerCase();
  if(l.startsWith('ja')) return 'JA';
  if(l.startsWith('zh')) return 'ZH';
  if(l.startsWith('es')) return 'ES';
  if(l.startsWith('fr')) return 'FR';
  if(l.startsWith('de')) return 'DE';
  if(l.startsWith('ru')) return 'RU';
  if(l.startsWith('it')) return 'IT';
  if(l.startsWith('pt')) return 'PT';
  if(l.startsWith('id')) return 'ID';
  if(l.startsWith('ko')) return 'KO';
  return 'EN';
}
async function translateText(text,target){
  const key=target+'::'+text; if(_transCache[key]) return _transCache[key];
  const r=await fetch(TR_EDGE,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify({text,target})});
  const j=await r.json(); if(j&&j.ok&&j.text){ _transCache[key]=j.text; return j.text; }
  throw new Error((j&&j.error)||'translate_failed');
}
function attachTranslate(row,text,target){
  if(!text||!text.trim()) return;
  const side=row.classList.contains('g')?'g':'s';
  const w=document.createElement('div'); w.className='row '+side; w.style.marginTop='-2px';
  const btn=document.createElement('button');
  btn.textContent='\uD83C\uDF10 \uBC88\uC5ED';
  btn.style.cssText='border:1px solid #d0d5dd;background:#fff;color:#555;font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;';
  let cache=null, transRow=null, done=false;
  btn.addEventListener('click',async()=>{
    if(done){ if(transRow){ const hidden=transRow.style.display==='none'; transRow.style.display=hidden?'':'none'; btn.textContent=hidden?'\uD83C\uDF10 \uC6D0\uBB38':'\uD83C\uDF10 \uBC88\uC5ED'; if(hidden&&atBottom()) scrollDown(); } return; }
    btn.textContent='\uBC88\uC5ED \uC911\u2026'; btn.disabled=true;
    try{ const t=cache||await translateText(text,target); cache=t;
      const d=document.createElement('div'); d.className='b';
      d.style.cssText='background:#eef1f4;color:#333;border:1px solid #e2e6ea;font-size:14px;line-height:1.55;';
      d.textContent=t;
      transRow=document.createElement('div'); transRow.className='row '+side; transRow.style.marginTop='-2px'; transRow.appendChild(d);
      w.parentNode.insertBefore(transRow,w.nextSibling); done=true;
      btn.textContent='\uD83C\uDF10 \uC6D0\uBB38'; btn.disabled=false;
    }catch(e){ btn.textContent='\uD83C\uDF10 \uBC88\uC5ED (\uB2E4\uC2DC)'; btn.disabled=false; }
    if(atBottom()) scrollDown();
  });
  w.appendChild(btn); row.parentNode.insertBefore(w,row.nextSibling);
}
function toggleTrans(row,text,target){
  if(row._transEl){ try{ row._transEl.remove(); }catch(e){} row._transEl=null; return; }
  const side=row.classList.contains('g')?'g':'s';
  const w=document.createElement('div'); w.className='row '+side; w.style.marginTop='-2px';
  const btn=document.createElement('button');
  btn.textContent='🌐 번역';
  btn.style.cssText='border:1px solid #d0d5dd;background:#fff;color:#555;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;';
  w.appendChild(btn); row.parentNode.insertBefore(w,row.nextSibling); row._transEl=w;
  const stick=atBottom(); if(stick) scrollDown();
  btn.addEventListener('click',async()=>{
    btn.textContent='번역 중…'; btn.disabled=true;
    try{ const t=await translateText(text,target);
      const d=document.createElement('div'); d.className='b';
      d.style.cssText='background:#eef1f4;color:#333;border:1px solid #e2e6ea;font-size:14px;line-height:1.55;';
      d.textContent=t; w.innerHTML=''; w.appendChild(d);
    }catch(e){ btn.textContent='다시 시도'; btn.disabled=false; }
    if(atBottom()) scrollDown();
  });
}

function addMsg(m){
  if(seen.has(m.id)) return; seen.add(m.id);
  // 낙관적으로 먼저 띄운 내 메시지 중복 제거
  if(m.sender==='guest'){ const i=pendingOpts.findIndex(o=>o.body===m.body); if(i>=0){ const n=document.getElementById(pendingOpts[i].id); if(n) n.remove(); pendingOpts.splice(i,1); } }
  const stick=atBottom(); hideTyping();
  const _day=dayLabel(m.created_at); if(_day!==lastDay){ lastDay=_day; const dv=document.createElement('div'); dv.className='daydiv'; dv.textContent=_day; msgsEl.appendChild(dv); }
  const isImg=m.msg_type==='image'&&m.image_path;
  const bubble=isImg?`<div class="b img"><img data-path="${esc(m.image_path)}" alt="사진" /></div>`:`<div class="b">${esc(m.body)}</div>`;
  const row=document.createElement('div'); row.className='row '+(m.sender==='guest'?'g':'s');
  row.innerHTML = m.sender==='guest' ? `<span class="time">${fmt(m.created_at)}</span>${bubble}` : `${bubble}<span class="time">${fmt(m.created_at)}</span>`;
  msgsEl.appendChild(row);
  if(isImg){ const img=row.querySelector('img[data-path]'); signGuest(m.image_path).then(u=>{ if(u){ img.src=u; img.addEventListener('click',()=>openLb(u)); } }); }
  if(!isImg && m.body && m.body.trim()){ const gl=guestLang(); const tgt = /[가-힣]/.test(m.body) ? (gl==='KO'?'EN':gl) : 'KO'; attachTranslate(row,m.body,tgt); }
  if(m.created_at>lastTs) lastTs=m.created_at;
  lastMsgSender=m.sender; if(m.sender==='guest'){ const gts=new Date(m.created_at).getTime(); if(gts>lastGuestTs) lastGuestTs=gts; }
  updateRead(); if(stick) scrollDown();
  if(chatReady && m.sender!=='guest'){ notifyGuest(m); }
}
async function poll(){ if(!convId) return;
  try{ const {data,error}=await db.rpc('chat_guest_fetch',{p_conv:convId,p_token:token,p_since:lastTs}); if(!error&&data) data.forEach(addMsg); }catch(e){}
  try{ const {data:seen}=await db.rpc('chat_guest_meta',{p_conv:convId}); if(seen){ staffSeenTs=new Date(seen).getTime(); updateRead(); } }catch(e){}
}
async function send(){
  const body=inpEl.value.trim(); if(!body||!convId) return;
  askNotifPerm();
  sendEl.disabled=true; inpEl.value=''; inpEl.style.height='auto';
  // 낙관적 즉시 표시 (내 화면에 바로 뜨게)
  const optId='opt-'+Date.now()+Math.random().toString(36).slice(2,6);
  const stick=atBottom();
  const row=document.createElement('div'); row.className='row g'; row.id=optId;
  row.innerHTML=`<span class="time">${fmt(new Date().toISOString())}</span><div class="b">${esc(body)}</div>`;
  msgsEl.appendChild(row); pendingOpts.push({id:optId, body}); if(stick) scrollDown();
  const {error}=await db.rpc('chat_guest_send',{p_conv:convId,p_token:token,p_body:body});
  if(error){
    const n=document.getElementById(optId); if(n) n.remove();
    const i=pendingOpts.findIndex(o=>o.id===optId); if(i>=0) pendingOpts.splice(i,1);
    alert('전송 실패, 다시 시도해주세요.');
  } else { await poll(); scrollDown(); }
  sendEl.disabled=false; inpEl.focus();
}
inpEl.addEventListener('input',()=>{ inpEl.style.height='auto'; inpEl.style.height=Math.min(inpEl.scrollHeight,120)+'px'; sendEl.disabled=!inpEl.value.trim(); const now=Date.now(); if(rtCh && now-typingSentAt>1800){ typingSentAt=now; try{ rtCh.send({type:'broadcast',event:'typing',payload:{who:'guest'}}); }catch(e){} } });
inpEl.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
sendEl.addEventListener('click',send);

// 사진 전송
function blobToB64(blob){ return new Promise(res=>{ const r=new FileReader(); r.onloadend=()=>res(String(r.result).split(',')[1]); r.readAsDataURL(blob); }); }
function downscale(file,maxW,q){ return new Promise(res=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ let w=img.width,h=img.height; if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; } const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); cv.toBlob(b=>{ URL.revokeObjectURL(url); res(b||file); },'image/jpeg',q); }; img.onerror=()=>res(file); img.src=url; }); }
async function uploadImage(file){
  if(!convId) return;
  const blob=await downscale(file,1280,0.82);
  const dataBase64=await blobToB64(blob);
  const j=await edgeCall({action:'upload',conv:convId,token,contentType:blob.type||'image/jpeg',dataBase64});
  if(j&&j.ok){ await poll(); scrollDown(); } else { alert('사진 전송 실패, 다시 시도해주세요.'); }
}
document.getElementById('attach').addEventListener('click',()=>{ if(!convId) return; const fi=document.getElementById('fileInput'); fi.value=''; fi.click(); });
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) uploadImage(f); });
document.getElementById('lb').addEventListener('click',()=>{ document.getElementById('lb').style.display='none'; });

function askGuestEmail(){
  if(!convId) return;
  const msgs=$('#msgs'); if(!msgs) return;
  if(document.getElementById('emailAsk')) return;
  const box=document.createElement('div');
  box.id='emailAsk';
  box.style.cssText='margin:10px auto;max-width:92%;background:#f2f4f7;border:1px solid #e2e6ea;border-radius:14px;padding:12px 14px;font-size:14px;color:#333;line-height:1.5;';
  box.innerHTML='처음에 이메일을 작성해 주시면 상담원 답변을 <b>메일로도</b> 전달드려요.<div style="display:flex;gap:6px;margin-top:8px;"><input id="ge-email" type="email" inputmode="email" autocomplete="email" placeholder="이메일 (선택)" style="flex:1;min-width:0;font-size:16px;padding:8px 10px;border:1px solid #d0d5dd;border-radius:10px;" /><button id="ge-save" style="border:0;background:#0A84FF;color:#fff;font-size:14px;padding:8px 14px;border-radius:10px;font-weight:600;white-space:nowrap;">저장</button></div><div style="margin-top:6px;"><button id="ge-skip" style="border:0;background:none;color:#8a8a8e;font-size:12.5px;cursor:pointer;padding:2px;">나중에 할게요</button></div>';
  msgs.appendChild(box); scrollDown();
  const close=()=>{ try{ box.remove(); }catch(e){} };
  document.getElementById('ge-skip').addEventListener('click',()=>{ close(); });
  document.getElementById('ge-save').addEventListener('click',async()=>{
    const el=document.getElementById('ge-email'); const v=(el.value||'').trim();
    if(!v||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ el.style.borderColor='#e0484e'; return; }
    try{ await db.rpc('chat_guest_set_email',{p_conv:convId,p_token:token,p_email:v}); localStorage.setItem('staybut_email_'+ROOM,'1'); }catch(e){}
    close();
    const ok=document.createElement('div'); ok.style.cssText='margin:6px auto;max-width:92%;text-align:center;font-size:12.5px;color:#8a8a8e;'; ok.textContent='메일 알림이 설정되었어요 ✓'; $('#msgs').appendChild(ok); scrollDown();
  });
}

async function startChat(code){
  $('#consent').style.display='none'; $('#app').style.display='flex';
  if(!ROOM){ $('#hint').textContent='잘못된 접속입니다. 객실 QR로 다시 들어와 주세요.'; return; }
  $('#h-room').textContent='StayBUT · '+ROOM+'호';
  token=getToken();
  try{
    const {data,error}=await db.rpc('chat_open_session',{p_room:ROOM,p_token:token,p_code:(code||'')});
    if(error){ if(String(error.message||'').indexOf('bad_code')>=0){ try{ localStorage.removeItem('staybut_code_'+ROOM); }catch(e){} $('#app').style.display='none'; $('#consent').style.display='flex'; consentErr((I18N[curLang]||I18N.en).codeErr); return; } throw error; }
    if(!data){ // 숙박 기간이 아님 → 문의 불가 안내 + 입력 잠금
      $('#hint').textContent='지금은 문의 가능 기간이 아니에요. 체크인 이후에 이용해 주세요. 급한 문의는 예약하신 채널 메시지로 부탁드려요 🙏';
      const f=document.querySelector('footer'); if(f) f.style.display='none';
      return;
    }
    convId=data;
    try{ localStorage.setItem('staybut_code_'+ROOM, (code||'')); }catch(e){}
    if(pendingEmail){ try{ await db.rpc('chat_guest_set_email',{p_conv:convId,p_token:token,p_email:pendingEmail}); localStorage.setItem('staybut_email_'+ROOM,'1'); }catch(e){} }
    $('#hint').textContent='안녕하세요! 도움이 필요하시면 편하게 메시지를 남겨 주세요 😊';
    // 실시간 구독(브로드캐스트) — 새 메시지 즉시 수신, 폴링은 백업(10초)
    try{ rtCh = db.channel('chat:'+convId, {config:{broadcast:{self:true}}})
      .on('broadcast',{event:'new_message'},({payload})=>{ if(payload) addMsg(payload); })
      .on('broadcast',{event:'typing'},({payload})=>{ if(payload&&payload.who==='staff') showTyping(); })
      .subscribe(); }catch(e){}
    await poll(); chatReady=true; pollTimer=setInterval(poll,10000);
    try{ if(localStorage.getItem('staybut_email_'+ROOM)!=='1') setTimeout(askGuestEmail,1400); }catch(e){}
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });
  }catch(e){ $('#hint').textContent='연결에 실패했어요. 잠시 후 새로고침 해주세요.'; }
}

};
function detectLang(){ const l=(navigator.language||'en').toLowerCase(); if(l.startsWith('ko'))return 'ko'; if(l.startsWith('zh'))return 'zh'; if(l.startsWith('ja'))return 'ja'; return 'en'; }
let curLang=detectLang();
function setLang(lang){ const T=I18N[lang]||I18N.en; curLang=lang;
  var el;
  if(el=$('#c-room')) el.textContent=T.title.replace('{N}', ROOM||'');
  if(el=$('#c-sub')) el.textContent=T.sub;
  if(el=$('#c-box')) el.innerHTML=T.b.map(x=>'· '+x).join('<br>');
  if(el=$('#c-hours-t')) el.textContent=T.hours;
  if(el=$('#c-email')) el.placeholder=T.emailPh;
  if(el=$('#c-hint')) el.textContent=T.hint;
  if(el=$('#c-code')) el.placeholder=T.code;
  if(el=$('#c-codehint')) el.textContent=T.codeHint;
  if(el=$('#agreeBtn')) el.textContent=T.btn;
  if(el=$('#inp')) el.placeholder=T.inp;
  document.querySelectorAll('.c-lang').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));
}
function consentErr(m){ var e=$('#c-err'); if(e) e.textContent=m||''; }
(function(){
  document.querySelectorAll('.c-lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
  setLang(curLang);
  let agreed=false, savedCode=''; try{ agreed=localStorage.getItem('staybut_consent')==='1'; savedCode=localStorage.getItem('staybut_code_'+ROOM)||''; }catch(e){}
  if(agreed && savedCode){ startChat(savedCode); return; }
  $('#agreeBtn').addEventListener('click',()=>{ const em=$('#c-email'); pendingEmail=em?em.value.trim():''; const cc=$('#c-code'); const code=cc?cc.value.trim():''; if(!code){ consentErr((I18N[curLang]||I18N.en).codeErr); return; } try{ localStorage.setItem('staybut_consent','1'); }catch(e){} startChat(code); });
})();
