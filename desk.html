<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StayBUT">
<meta name="theme-color" content="#F7F8FA">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>StayBUT 운영</title>
<style>
:root{
  color-scheme: light;
  --bg:#F7F8FA; --card:#FFFFFF;
  --line:#E5E7EB; --line2:#F1F3F5;
  --tx:#111827; --tx2:#6B7280; --tx3:#9CA3AF;
  --pri:#2563EB; --pri-bg:#EFF6FF;
  --red:#DC2626; --red-bg:#FEF2F2;
  --grn:#059669; --grn-bg:#ECFDF5;
  --r:8px; --r-lg:10px;
  --sh:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,
    "Segoe UI","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
.app{max-width:720px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;background:var(--bg)}
.screen{padding:0 16px calc(40px + env(safe-area-inset-bottom))}
#home.hide{display:none}
#view{display:none;position:absolute;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#view.show{display:block}

/* 로그인 */
#login{display:none;max-width:380px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top)) 20px 40px}
#login.show{display:block}
#login h2{font-size:22px;font-weight:700;margin:0 0 6px;letter-spacing:-.2px}
#login p{color:var(--tx2);font-size:14px;margin:0 0 24px}
#login label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin:0 0 6px}
#login input{width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff;
  padding:11px 12px;font-size:16px;font-family:inherit;margin-bottom:16px;color:var(--tx)}
#login input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.lerr{border:1px solid #FECACA;background:var(--red-bg);color:#991B1B;border-radius:var(--r);
  padding:11px 12px;font-size:13.5px;margin-bottom:16px;display:none}
.lerr.show{display:block}

/* 헤더 */
.hd{padding:20px 16px 0}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.3px}
.hsub{color:var(--tx2);font-size:13.5px;margin-top:2px}
.acts{display:flex;gap:6px;flex-shrink:0}
.mini{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:7px 11px;
  font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit;white-space:nowrap}
.mini:active{background:var(--line2)}
.date{margin-top:14px}
.date .dt{font-size:15px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.date .dw{color:var(--tx2);font-weight:500;margin-left:5px}

/* 요약 */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px 18px}
.chip{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;
  display:flex;align-items:baseline;gap:7px;box-shadow:var(--sh)}
.chip b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.chip span{font-size:12.5px;color:var(--tx2);white-space:nowrap}
.chip.alert{border-color:#FECACA;background:var(--red-bg)}
.chip.alert b{color:var(--red)} .chip.alert span{color:#B91C1C}

/* 목록 */
.teams{display:flex;flex-direction:column;gap:8px}
.team{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;font:inherit;color:inherit;
  cursor:pointer;box-shadow:var(--sh)}
.team:active{background:var(--line2)}
.ic{width:38px;height:38px;flex:0 0 auto;border-radius:var(--r);background:var(--line2);
  display:grid;place-items:center}
.ic svg{width:20px;height:20px;stroke:var(--tx2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tmid{flex:1;min-width:0}
.tk{display:none}
.tn{font-weight:650;font-size:15.5px;letter-spacing:-.2px}
.ts{font-size:13px;color:var(--tx2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tst{font-size:13px;font-weight:600;margin-top:5px;display:flex;align-items:center;gap:6px;color:var(--tx2)}
.tst i{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--tx3)}
.tst.warn{color:var(--red)} .tst.warn i{background:var(--red)}
.tst.ok i{background:var(--grn)}
.bg{flex:0 0 auto;min-width:22px;height:22px;border-radius:11px;padding:0 7px;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;background:var(--red);color:#fff}
.bg.none{background:var(--grn-bg);color:var(--grn);font-size:12px}

/* 상세 */
.vbar{position:sticky;top:0;z-index:5;background:rgba(247,248,250,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
  display:flex;align-items:center;gap:11px}
.back{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--line);border-radius:var(--r);
  background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.back svg{width:16px;height:16px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vt .k{display:none}
.vt b{display:block;font-size:17px;font-weight:700;letter-spacing:-.2px}

.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px;
  overflow:hidden;box-shadow:var(--sh)}
.sec>summary{padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px;
  font-weight:650;font-size:15px;list-style:none;letter-spacing:-.1px}
.sec>summary::-webkit-details-marker{display:none}
.sec[open]>summary{border-bottom:1px solid var(--line2)}
.mk{width:20px;height:20px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff}
.mk.warn,.mk.crit{background:var(--red)} .mk.ok{background:var(--grn-bg);color:var(--grn)}
.st{flex:1;min-width:0}
.tg{display:block;font-size:12px;color:var(--tx3);font-weight:500;margin-top:2px}
.sb{padding:14px}
p.n{margin:0 0 12px;font-size:14px;color:var(--tx2);line-height:1.7}
p.n:last-child{margin-bottom:0} p.n b{color:var(--tx);font-weight:650}

/* 지표 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:13px;box-shadow:var(--sh)}
.kpi.wide{grid-column:1/-1}
.kpi .lb{font-size:12.5px;color:var(--tx2);font-weight:500}
.kpi .vl{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .vl.num{font-size:20px}
.kpi .vl small{font-size:13px;font-weight:600}
.df{font-size:12.5px;font-weight:600;margin-top:3px;display:block}
.df.p{color:var(--grn)} .df.m{color:var(--red)} .df.z{color:var(--tx3);font-weight:500}

/* 표 */
.rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:2px 0 12px}
.rh{display:flex;background:#FAFBFC;padding:9px 12px;font-size:12px;color:var(--tx2);font-weight:600;
  border-bottom:1px solid var(--line)}
.r{display:flex;align-items:center;padding:11px 12px;font-size:14px;border-bottom:1px solid var(--line2);gap:8px}
.r:last-child{border-bottom:none}
.r.hl{background:#FFFBEB}
.c1{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2,.c3{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.c2{min-width:100px} .c3{min-width:54px}
.up{color:var(--grn)} .dn{color:var(--red)} .mu{color:var(--tx2);font-weight:400}
.bar{height:4px;background:var(--pri);border-radius:2px;min-width:3px;opacity:.75}

/* 체크리스트 */
.cklist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px;background:#fff}
.cklist.done{opacity:.7}
.ckh{background:#FAFBFC;padding:9px 12px;font-size:12px;font-weight:600;color:var(--tx2);
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.ck{display:flex;align-items:flex-start;gap:11px;padding:13px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.ck:last-child{border-bottom:none}
.ck:active{background:var(--line2)}
.box{width:19px;height:19px;flex:0 0 auto;border:1.5px solid var(--tx3);border-radius:5px;margin-top:2px;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.ck.on .box{background:var(--grn);border-color:var(--grn)}
.ck.on .box::after{content:'✓'}
.ck.on .ct{color:var(--tx3);text-decoration:line-through}
.cm{flex:1;min-width:0}
.ct{font-size:15px;font-weight:600;line-height:1.5}
.cs{font-size:13px;color:var(--tx2);margin-top:2px;line-height:1.5}
.cw{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:600;color:var(--tx2);
  background:var(--line2);border-radius:var(--r);padding:3px 8px;white-space:nowrap}
.cw.now{background:var(--red-bg);color:var(--red)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;
  color:var(--tx2);font-size:14px;margin-bottom:10px;background:#fff}
.empty b{display:block;color:var(--tx);font-size:15px;font-weight:650;margin-bottom:3px}

.btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r);
  padding:12px;font-size:15px;font-weight:600;cursor:pointer;color:var(--tx);font-family:inherit;min-height:46px}
.btn:active{background:var(--line2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.hint{margin:16px 2px 0;font-size:13px;color:var(--tx3);line-height:1.65}
.foot{text-align:center;padding:22px 10px 0;margin-top:22px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--tx3)}
.foot .mo{display:block;margin-top:4px}
.load{padding:40px 16px;text-align:center;color:var(--tx2);font-size:14px}
.err{margin:14px 0;border:1px solid #FECACA;background:var(--red-bg);color:#991B1B;
  border-radius:var(--r);padding:13px;font-size:14px;line-height:1.6}
@media (min-width:640px){ .kpis{grid-template-columns:repeat(3,1fr)} .kpi.wide{grid-column:1/-1} }
</style>
</head>
<body>

<div id="login">
  <h2>로그인</h2>
  <p>어드민과 같은 계정으로 로그인하세요.</p>
  <div class="lerr" id="lerr"></div>
  <form id="lform">
    <label for="em">이메일</label>
    <input id="em" type="email" autocomplete="username" inputmode="email" required>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn pri" type="submit" id="lbtn">로그인</button>
  </form>
  <div class="hint">비밀번호는 저장하지 않습니다. 한 번 로그인하면 이 기기에서 계속 유지됩니다.</div>
</div>

<div class="app" id="app" style="display:none">
  <div id="home">
    <div class="hd">
      <div class="hrow">
        <div><h1>운영 대시보드</h1><div class="hsub">오늘 처리할 일과 현황</div></div>
        <div class="acts">
          <button class="mini" id="reload">새로고침</button>
          <button class="mini" id="logout">로그아웃</button>
        </div>
      </div>
      <div class="date"><span class="dt" id="today">—</span></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="screen">
      <div class="teams" id="teams"><div class="load">불러오는 중…</div></div>
      <div class="foot">StayBUT 성수<span class="mo" id="stamp">—</span></div>
    </div>
  </div>
  <div id="view"></div>
</div>

<script>
/* ───── 접속 설정 ─────
   공개 키(publishable)입니다. 공개되어도 안전하도록 설계된 값이고,
   실제 데이터는 로그인 + RLS(행 단위 보안)로 막습니다.
   로그인하지 않으면 이 키만으로는 아무것도 읽히지 않습니다. */
const SB_URL='https://ijvfwajtotbqfxpdlcal.supabase.co';
const SB_KEY='sb_publishable_NMLr44iM9YQ7QsswludEqA_QSVes1IE';
const LS='staybut_desk_session';

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const man=n=>n==null?'—':(Math.round(Number(n)/10000)).toLocaleString('ko-KR');

function getSess(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } }
function setSess(s){ try{ s?localStorage.setItem(LS,JSON.stringify(s)):localStorage.removeItem(LS); }catch(e){} }

async function login(email,password){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'로그인에 실패했습니다');
  setSess(j); return j;
}
async function refresh(s){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:s.refresh_token})});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok){
    // 갱신표 자체가 무효일 때만 로그아웃. 통신 문제면 세션을 지우지 않는다.
    const dead = r.status===400 && /invalid|revoked|expired/i.test(JSON.stringify(j));
    const e=new Error(dead?'SESSION_DEAD':'NETWORK'); e.dead=dead; throw e;
  }
  setSess(j); return j;
}
function expSoon(s){
  try{ const e=JSON.parse(atob(s.access_token.split('.')[1])).exp;
       return (e - Math.floor(Date.now()/1000)) < 300; }catch(e){ return false; }
}
async function rpc(name,retry){
  let s=getSess(); if(!s) throw new Error('로그인이 필요합니다');
  if(!retry && expSoon(s)){ try{ s=await refresh(s); }catch(e){} }
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+s.access_token,'Content-Type':'application/json'},
    body:'{}'});
  if(r.status===401 && !retry){ s=await refresh(s); return rpc(name,true); }
  const j=await r.json();
  if(!r.ok) throw new Error(j.message||j.hint||('오류 '+r.status));
  return j;
}

const P='<circle cx="8" cy="7.4" r="3"/><path d="M3 20v-1.7a5 5 0 0 1 10 0V20"/>';
const I={
 ops:P+'<rect x="15.6" y="8.4" width="6" height="8" rx=".8"/><path d="M17.3 11.9l1.1 1.1 2.1-2.2"/>',
 price:P+'<path d="M15.6 16.6l2.1-2.4 1.7 1.7 2.1-2.8"/><path d="M20.2 13.1h1.8v1.8"/>',
 clean:P+'<path d="M18.5 7v5.4"/><path d="M15.9 12.4h5.2l.9 5.6h-7z"/><path d="M17.3 12.4V18M19.7 12.4V18"/>',
 data:P+'<circle cx="18.2" cy="11.4" r="3"/><path d="M20.5 13.7l1.9 2"/>',
 back:'<path d="M15 19l-7-7 7-7"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24">${I[k]}</svg>`;
function diff(c,p){ if(c==null||p==null) return '<span class="df z">비교 없음</span>';
  const d=Math.round((c-p)/p*1000)/10, cls=d>0?'p':(d<0?'m':'z');
  return `<span class="df ${cls}">${d>0?'▲':(d<0?'▼':'–')} ${Math.abs(d)}% <span class="mu">지난달</span></span>`; }

let D=null,TODO=null,T=[],CUR=null;
const CK='staybut_desk_checked';
function ckGet(){ try{return JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){return{}} }
function ckSet(o){ try{localStorage.setItem(CK,JSON.stringify(o))}catch(e){} }
function ckPrune(keys){ const o=ckGet(),n={}; keys.forEach(k=>{ if(o[k]) n[k]=o[k]; }); ckSet(n); }
// 체크리스트 한 줄 — {열쇠, html} 로 돌려준다
function row(key,title,sub,when,nowFlag){
  const html=`<div class="ck" data-ck="${key}"><div class="box"></div>`+
    `<div class="cm"><div class="ct">${title}</div>${sub?`<div class="cs">${sub}</div>`:''}</div>`+
    (when?`<span class="cw${nowFlag?' now':''}">${when}</span>`:'')+`</div>`;
  return {k:key, html};
}
function list(head,items,emptyTitle,emptyNote){
  const done=ckGet();
  const todo=items.filter(x=>!done[x.k]), fin=items.filter(x=>done[x.k]);
  if(!items.length) return `<div class="empty"><b>${emptyTitle}</b>${emptyNote||''}</div>`;
  const finHtml = fin.length
    ? `<div class="cklist done"><div class="ckh"><span>완료</span><span>${fin.length}건</span></div>`
      + fin.map(x=>x.html.replace('class="ck"','class="ck on"')).join('') + `</div>`
    : '';
  const todoHtml = todo.length
    ? `<div class="cklist"><div class="ckh"><span>${head}</span><span>${todo.length}건</span></div>`
      + todo.map(x=>x.html).join('') + `</div>`
    : `<div class="empty"><b>다 끝냈습니다</b>${fin.length}건 완료</div>`;
  return todoHtml + finHtml;
}
function build(){
  const M=D.months||[], ym=(D.now||'').slice(0,7);
  const idx=M.findIndex(m=>m.ym===ym), cur=M[idx]||{}, prev=idx>0?M[idx-1]:null, next=M[idx+1];
  const ch=D.byChannel||[], vac=D.vacant||[], cl=D.cleaning||[], tod=D.today||[],
        up=D.upcoming||[], ig=D.integrity||[];
  const igCnt=ig.reduce((a,x)=>a+Number(x.cnt||0),0), unass=Number(D.unassigned||0);
  const maxRev=Math.max(1,...ch.map(x=>x.rev||0));
  const cin=tod.filter(x=>x.kind==='체크인'), cout=tod.filter(x=>x.kind==='체크아웃');
  const pend=cl.filter(x=>x.st!=='completed'), noWho=cl.filter(x=>x.who==='미배정');

  {
    const iso=(D.now||'').slice(0,10), p=iso.split('-');
    const KO={MON:'월',TUE:'화',WED:'수',THU:'목',FRI:'금',SAT:'토',SUN:'일'};
    $('today').innerHTML = p.length===3
      ? `${Number(p[1])}월 ${Number(p[2])}일<span class="dw">${KO[D.dow]||''}요일</span>`
      : iso;
  }
  $('stamp').textContent='업데이트 '+(D.now||'');


  // ── 할 일 목록 만들기 (0건짜리는 아예 안 만든다)
  const t_ops=[], t_price=[], t_clean=[], t_data=[];
  const keys=[];
  const K=k=>{ keys.push(k); return k; };

  (TODO.today||[]).forEach(x=>{
    const k=K('in-'+x.kind+'-'+x.rm+'-'+(D.now||'').slice(0,10));
    t_ops.push(row(k,
      esc(x.rm||'미배정')+'호 '+(x.kind==='체크인'?'체크인 메시지 전송':'체크아웃 확인'),
      esc(x.ch||'—')+(x.kind==='체크인'?' · 입실 안내와 도어락 번호':' · 퇴실 확인 후 청소 연결'),
      x.kind==='체크인'?'오늘 IN':'오늘 OUT', true));
  });
  (TODO.unassigned||[]).forEach(x=>{
    const k=K('un-'+x.code);
    t_ops.push(row(k, '객실 배정 — '+esc(x.code),
      esc(x.ch)+' · 체크인 '+esc(x.ci)+' · 102호/202호 중 선택', '정해야 함', true));
  });

  (TODO.pricing||[]).forEach(x=>{
    const k=K('pr-'+x.id);
    t_price.push(row(k, esc(x.d)+' ('+esc(x.dow)+') '+esc(x.rm)+'호 '+x.pct+'%',
      'CMS 재고 화면에서 네 채널 모두 반영 · '+esc(x.step)+' 구간',
      'D-'+x.lead, x.lead<=3));
  });

  (TODO.cleaning||[]).forEach(x=>{
    const k=K('cl-'+x.id);
    t_clean.push(row(k, esc(x.rm)+'호 청소 담당 배정',
      esc(x.d)+' ('+esc(x.dow)+') 청소 — 아직 담당이 없습니다',
      x.today?'오늘':esc(x.d), x.today));
  });

  (TODO.integrity||[]).forEach(x=>{
    const k=K('ig-'+x.code+'-'+x.cnt);
    t_data.push(row(k, esc(x.label||x.code)+' '+x.cnt+'건',
      esc(x.detail), '확인', true));
  });
  ckPrune(keys);

  // 체크한 건 뺀 '남은 개수' — 카드 배지·요약도 이 숫자를 쓴다
  const _done=ckGet(), left=a=>a.filter(x=>!_done[x.k]).length;
  const nOps=left(t_ops), nPr=left(t_price), nCl=left(t_clean), nDt=left(t_data);

  T=[
  {id:"ops",ic:"ops",kicker:"Operations",name:"운영팀",desc:"오늘 들고남 · 배정 · PMS",
   state:nOps?`할 일 ${nOps}건`:"할 일 없음", lv:nOps?"warn":"ok", badge:nOps?String(nOps):"✓",
   secs:[
   {t:"오늘 할 일",m:nOps?"warn":"ok",tag:"체크하면 지워집니다",open:1,
    body:list('운영팀 체크리스트',t_ops,'오늘 할 일이 없습니다','들고 나는 방도, 배정할 예약도 없습니다.')},
   {t:"PMS 일마감 · 그룹체크아웃",m:"ok",tag:"매일 09:32 자동",
    body:`<p class="n">제가 자동으로 합니다. 순서는 ① 일마감 → 「마감」 → 확인 ② 객실현황 → 미결산내역 → 그룹체크아웃 ③ 예약 점검.</p>
      <p class="n"><b>그룹체크아웃 전에 목록을 먼저 읽습니다.</b> 아직 묵고 있는 손님이나 진짜 미수금이 섞여 있으면 누르지 않고 멈춥니다.</p>
      <p class="n">PC 크롬이 켜져 있고 PMS 로그인이 살아 있어야 합니다.</p>`},
   {t:"다음 2주 예약",m:"ok",tag:"참고",
    body:(D.upcoming||[]).length?`<div class="rows"><div class="rh"><div class="c1">체크인</div><div class="c3">호실</div><div class="c2">채널</div></div>
      ${(D.upcoming||[]).map(u=>`<div class="r ${u.today?'hl':''}"><div class="c1">${esc(u.ci)} (${esc(u.dow)}) <span class="mu">${u.nt}박</span></div>
        <div class="c3">${esc(u.rm)}</div><div class="c2 mu">${esc(u.ch)}</div></div>`).join('')}</div>`
      :`<p class="n">앞으로 2주 예약이 없습니다.</p>`}]},

  {id:"price",ic:"price",kicker:"Revenue & Pricing",name:"매출분석 · 프라이싱팀",
   desc:"요금 조정 · 매출 · 빈방",
   state:nPr?`조정할 것 ${nPr}건`:`${ym.slice(5)}월 ${won(cur.gmv)}원 · ${cur.occ!=null?cur.occ+'%':'—'}`,
   lv:nPr?"warn":"ok", badge:nPr?String(nPr):"✓",
   kpi:`<div class="kpis">
     <div class="kpi wide"><div class="lb">이번 달 거래액 · ${esc(ym)}</div>
       <div class="vl"><small style="margin:0 2px 0 0">₩</small>${won(cur.gmv)}</div>${diff(cur.gmv,prev&&prev.gmv)}</div>
     <div class="kpi"><div class="lb">가동률</div><div class="vl">${cur.occ!=null?cur.occ:'—'}<small>%</small></div>${diff(cur.occ,prev&&prev.occ)}</div>
     <div class="kpi"><div class="lb">객단가</div><div class="vl num">${won(cur.adr)}</div>${diff(cur.adr,prev&&prev.adr)}</div></div>`,
   secs:[
   {t:"지금 조정할 요금",m:nPr?"warn":"ok",tag:"매시간 자동 감시",open:1,
    body:list('프라이싱 체크리스트',t_price,'지금 조정할 게 없습니다',
      '빈방이 D-5 안으로 들어오면 여기에 자동으로 쌓입니다. D-1·당일은 올리지도 내리지도 않습니다.')},
   {t:"다음 2주 빈방",m:"ok",tag:"참고",
    body:vac.length?`<div class="rows"><div class="rh"><div class="c1">날짜</div><div class="c2">빈 방</div><div class="c3">D-</div></div>
      ${vac.map(v=>`<div class="r ${v.lead<=5?'hl':''}"><div class="c1">${esc(v.d)} (${esc(v.dow)})</div>
        <div class="c2">${v.rooms.map(r=>esc(r)+'호').join(' · ')}</div>
        <div class="c3 ${v.lead<=5?'dn':'mu'}">D-${v.lead}</div></div>`).join('')}</div>`
      :`<p class="n">앞으로 2주 빈방이 없습니다. 만실입니다.</p>`},
   {t:"이번 달 채널별 매출",m:"ok",tag:"참고",
    body:ch.length?`<div class="rows"><div class="rh"><div class="c1">채널</div><div class="c2">매출</div><div class="c3">박</div></div>
      ${ch.map(c=>`<div class="r"><div class="c1">${esc(c.ch)}<div class="bar" style="width:${Math.round(c.rev/maxRev*100)}%;margin-top:5px"></div></div>
        <div class="c2">${won(c.rev)}</div><div class="c3 mu">${c.sold}</div></div>`).join('')}</div>`
      :`<p class="n">이번 달 판매 기록이 없습니다.</p>`},
   {t:"월별 추이",m:"ok",tag:"참고",
    body:`<div class="rows"><div class="rh"><div class="c1">월</div><div class="c2">거래액</div><div class="c3">가동</div><div class="c3">객단가</div></div>
      ${M.filter(m=>m.sold>3).map(m=>`<div class="r ${m.ym===ym?'hl':''}"><div class="c1">${esc(m.ym)}</div>
        <div class="c2">${won(m.gmv)}</div><div class="c3 mu">${m.occ}%</div><div class="c2 mu">${won(m.adr)}</div></div>`).join('')}</div>
      ${next&&next.sold>3?`<p class="n">다음 달(${esc(next.ym)})은 현재까지 <b>${won(next.gmv)}원 · 가동률 ${next.occ}%</b> 예약돼 있습니다.</p>`:''}`},
   {t:"리드타임 기준",m:"ok",tag:"최근 120일 분석",
    body:`<div class="rows"><div class="rh"><div class="c1">예약 시점</div><div class="c3">건수</div><div class="c2">평균 단가</div></div>
      <div class="r"><div class="c1">당일 ~ D-1</div><div class="c3 mu">56</div><div class="c2 dn">150,023</div></div>
      <div class="r"><div class="c1">D-2 ~ D-5</div><div class="c3 mu">60</div><div class="c2 mu">144,669</div></div>
      <div class="r"><div class="c1">D-6 ~ D-14</div><div class="c3 mu">74</div><div class="c2">163,946</div></div>
      <div class="r"><div class="c1">D-15 이상</div><div class="c3 mu">93</div><div class="c2">182,382</div></div></div>
      <p class="n"><b>D-5 이내가 전체의 41%</b>입니다. 당일~D-1 이 D-2~5 보다 비싸서 <b>막판에는 안 내립니다.</b></p>
      <p class="n">채널 수수료 — 에어비앤비 15.5% · 익스피디아 18.0% · 아고다 18.7% · 부킹닷컴 20.5%</p>`}]},

  {id:"clean",ic:"clean",kicker:"Housekeeping",name:"청소관리팀",desc:"이번 주 담당 배정",
   state:nCl?`담당 미배정 ${nCl}건`:"배정 다 됨", lv:nCl?"warn":"ok", badge:nCl?String(nCl):"✓",
   secs:[
   {t:"담당 배정이 필요한 청소",m:nCl?"warn":"ok",tag:"이번 주 (월~일)",open:1,
    body:list('배정 체크리스트',t_clean,'이번 주 배정이 다 끝났습니다','담당자 없는 청소가 없습니다.')},
   {t:"이번 주 전체",m:"ok",tag:"참고",
    body:cl.length?`<div class="rows"><div class="rh"><div class="c1">날짜</div><div class="c2">담당</div><div class="c3">호실</div></div>
      ${cl.map(c=>`<div class="r ${c.today?'hl':''}"><div class="c1">${esc(c.d)} (${esc(c.dow)})${c.st==='completed'?'<span class="mu"> · 완료</span>':''}</div>
        <div class="c2 mu" style="min-width:94px">${esc(c.who)}</div><div class="c3">${esc(c.rm)}호</div></div>`).join('')}</div>`
      :`<p class="n">이번 주 잡힌 청소가 없습니다.</p>`}]},

  {id:"data",ic:"data",kicker:"Data Integrity",name:"데이터팀",desc:"어긋난 것만",
   state:nDt?`${nDt}종 어긋남`:"이상 없음", lv:nDt?"warn":"ok", badge:nDt?String(nDt):"✓",
   secs:[
   {t:"확인할 것",m:nDt?"crit":"ok",tag:"열 때마다 다시 검사",open:1,
    body:list('데이터 체크리스트',t_data,'어긋난 데이터가 없습니다',
      '취소·중복예약·금액·배정·청소·숙소 6가지를 봤고 전부 맞습니다.')}]}
  ];

  const ISSUES=nOps+nPr+nCl+nDt;
  $('chips').innerHTML=`
    <div class="chip ${ISSUES?'alert':''}"><b>${ISSUES}</b><span>확인 필요</span></div>
    <div class="chip"><b>${cur.occ!=null?cur.occ+'%':'—'}</b><span>이번 달 가동률</span></div>
    <div class="chip"><b>${man(cur.gmv)}</b><span>이번 달 거래액(만원)</span></div>
    <div class="chip"><b>${cin.length}·${cout.length}</b><span>오늘 IN·OUT</span></div>`;

  $('teams').innerHTML=T.map(t=>`
   <button class="team" data-id="${t.id}"><div class="ic">${svg(t.ic)}</div>
    <div class="tmid"><span class="tk">${t.kicker}</span><div class="tn">${t.name}</div>
     <div class="ts">${t.desc}</div><div class="tst ${t.lv}"><i></i>${t.state}</div></div>
    <div class="bg ${t.badge==='✓'?'none':''}">${t.badge}</div></button>`).join('');
}

const home=()=>$('home'), view=()=>$('view');
function openTeam(id){
  const t=T.find(x=>x.id===id); if(!t) return;
  CUR=id;
  view().innerHTML=`<div class="vbar"><button class="back" aria-label="뒤로"><svg viewBox="0 0 24 24">${I.back}</svg></button>
    <div class="vt"><span class="k">${t.kicker}</span><b>${t.name}</b></div></div>
   <div class="screen" style="padding-top:16px">${t.kpi||''}
    ${t.secs.map(s=>`<details class="sec" ${s.open?'open':''}>
      <summary><span class="mk ${s.m}">${s.m==='ok'?'✓':'!'}</span>
       <span class="st">${s.t}<span class="tg">${s.tag||''}</span></span></summary>
      <div class="sb">${s.body}</div></details>`).join('')}
    <div class="hint">열 때마다 다시 읽습니다. 위쪽 「다시 읽기」로 새로고침하세요.</div></div>`;
  home().classList.add('hide'); view().classList.add('show'); view().scrollTop=0;
  view().querySelector('.back').onclick=()=>{view().classList.remove('show');home().classList.remove('hide');};
}

async function load(){
  $('teams').innerHTML='<div class="load">불러오는 중…</div>';
  try{ const [a,b]=await Promise.all([rpc('desk_summary'),rpc('desk_todo')]);
        D=a; TODO=b; build(); }
  catch(e){
    if(/로그인|만료|JWT|권한/.test(e.message||'')){ setSess(null); showLogin(); return; }
    $('teams').innerHTML=`<div class="err"><b>데이터를 불러오지 못했습니다.</b><br>${esc(e.message)}</div>`;
  }
}
function showLogin(){ $('login').classList.add('show'); $('app').style.display='none'; }
function showApp(){
  $('login').classList.remove('show'); $('app').style.display='';
  const s=getSess();
  if(s && expSoon(s)) refresh(s).catch(()=>{}).then(load); else load();
}

$('lform').addEventListener('submit',async ev=>{
  ev.preventDefault(); const b=$('lbtn'); b.disabled=true; b.textContent='확인 중…';
  $('lerr').classList.remove('show');
  try{ await login($('em').value.trim(),$('pw').value); $('pw').value=''; showApp(); }
  catch(e){ $('lerr').textContent=e.message; $('lerr').classList.add('show'); }
  finally{ b.disabled=false; b.textContent='로그인'; }
});
$('reload').onclick=load;
$('logout').onclick=()=>{ setSess(null); location.reload(); };
document.addEventListener('click',e=>{
  const ck=e.target.closest('.ck');
  if(ck){ const k=ck.dataset.ck, o=ckGet();
    if(o[k]) delete o[k]; else o[k]=1;
    ckSet(o);
    ck.style.transition='opacity .18s'; ck.style.opacity='0';
    setTimeout(()=>{ build(); if(CUR) openTeam(CUR); },180);
    return; }
  const b=e.target.closest('.team'); if(b) openTeam(b.dataset.id);
});

getSess()? showApp() : showLogin();
</script>
</body>
</html>
