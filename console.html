<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StayBUT 상담 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&display=swap" rel="stylesheet" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#1f1f23" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="StayBUT 상담" />
<link rel="apple-touch-icon" href="/apple-180.png" />
<style>
  :root{ --bg:#fff; --soft:#fafaf9; --chat:#f5f4f2; --line:#e8e6e1; --line2:#d6d3cd; --text:#1a1815; --soft-text:#57534c; --muted:#78736b; --ink:#1f1f23; --ink2:#161619; --booking:#1B4480; --danger:#b85c3f; --ok:#3a7030; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--soft); font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif; color:var(--text); }
  /* 로그인 */
  /* 세션 확인 전에는 아무것도 보이지 않게 한다. 로그인 화면이 번쩍이는 것을 막는다. */
  #login{ height:100dvh; display:none; align-items:center; justify-content:center; }
  body.ready-login #login{ display:flex; }
  /* 확인하는 동안 배경만 깔아둔다 */
  #boot{ position:fixed; inset:0; background:#EDEBE4; z-index:9; }
  body.ready-login #boot, body.ready-app #boot{ display:none; }
  #login .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:34px 28px; width:340px; max-width:90%; box-shadow:0 4px 24px rgba(26,24,21,.05); }
  #login .wm img{ height:26px; display:block; margin:0 auto 4px; }
  #login h1{ font-size:19px; margin:6px 0 2px; text-align:center; }
  #login p{ font-size:12.5px; color:var(--muted); margin:0 0 20px; text-align:center; }
  #login input{ width:100%; border:1px solid var(--line2); border-radius:10px; padding:12px 13px; font-size:14px; margin-bottom:10px; font-family:inherit; background:var(--soft); }
  #login input:focus{ outline:none; border-color:var(--ink); background:#fff; }
  #login button{ width:100%; border:none; background:var(--ink); color:#fff; border-radius:10px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; }
  #login .err{ color:var(--danger); font-size:12px; min-height:16px; margin-top:6px; text-align:center; }
  /* 상단바 */
  #app{ display:none; height:100dvh; flex-direction:column; }
  .top{ background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:10px 16px; flex-shrink:0; }
  .top .l{ display:flex; align-items:center; gap:10px; }
  .top .wm{ display:inline-flex; background:#fff; padding:3px 7px; border-radius:6px; } .top .wm img{ height:18px; display:block; }
  .top .t{ font-size:15px; font-weight:800; } .top .cnt{ font-size:12px; opacity:.7; font-weight:600; }
  .top button{ background:rgba(255,255,255,.14); color:#fff; border:none; border-radius:8px; padding:7px 11px; font-size:12px; cursor:pointer; margin-left:6px; }
  .top .gnb-ico.on{ background:#3a7030; }
  /* 3단 */
  .wrap{ flex:1; display:flex; min-height:0; max-width:1020px; width:100%; margin:0 auto;
          border-left:1px solid var(--line); border-right:1px solid var(--line); background:#fff; }
  @media (max-width:1020px){ .wrap{ border-left:0; border-right:0; } }
  .list{ width:236px; border-right:1px solid var(--line); background:var(--soft); overflow-y:auto; flex-shrink:0; }
  .conv{ padding:12px 14px; border-bottom:1px solid #f0eeea; cursor:pointer; display:flex; gap:10px; align-items:center; }
  .conv:hover{ background:#f3f0ec; }
  .conv.active{ background:#fff; box-shadow:inset 3px 0 0 var(--ink); }
  .av{ width:38px; height:38px; border-radius:10px; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .conv .cc{ min-width:0; flex:1; }
  .conv .r1{ display:flex; justify-content:space-between; align-items:baseline; }
  .conv .rm{ font-size:14px; font-weight:800; } .conv .tm{ font-size:10px; color:var(--muted); }
  .conv .last{ font-size:12.5px; color:var(--soft-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .badge{ background:var(--danger); color:#fff; border-radius:9px; font-size:10px; font-weight:800; padding:1px 7px; flex-shrink:0; }
  .list-tabs{ display:flex; gap:6px; padding:9px 10px 10px; background:var(--soft); }
  .list-tabs button{ font-size:12px; font-weight:700; border:1px solid var(--line); background:#fff; color:var(--soft-text); border-radius:999px; padding:5px 12px; cursor:pointer; }
  .list-tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .mchip{ font-size:9.5px; font-weight:800; border-radius:5px; padding:1px 6px; margin-left:5px; vertical-align:middle; }
  .pane{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .pane .hd{ padding:9px 13px; border-bottom:1px solid var(--line); background:#fff; display:flex; align-items:center; gap:9px; flex-shrink:0; font-size:13px; }
  .pane .hd .bkinfo{ margin-left:auto; font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .pane .hd .st{ font-size:11px; font-weight:700; }
  /* [PC 최적화 · 2026-08-18] 메시지를 아래로 붙여 빈 공간이 위로 가게 하고,
     말풍선 폭을 제한해 넓은 모니터에서 글자가 흩어지지 않게 한다. */
  /* iMessage 스타일 — 흰 배경, 아래 정렬, 컴팩트 */
  .msgs{ flex:1; overflow-y:auto; padding:14px 16px; background:#fff;
         display:flex; flex-direction:column; gap:3px; justify-content:flex-end; }
  /* 대화가 비었을 때 안내 */
  .msgs-empty{ align-self:center; text-align:center; color:#a8a39a; font-size:12.5px; line-height:1.7;
               margin:auto 0; padding:18px; }
  .msgs-empty b{ display:block; font-size:14px; color:#6b6660; margin-bottom:5px; font-weight:700; }
  .daydiv{ align-self:center; background:transparent; color:#8e8e93; font-size:11px; font-weight:600; padding:10px 0 4px; margin:0; }
  .m{ display:flex; gap:8px; max-width:min(72%, 420px); margin-top:2px; }
  .m + .m.s, .m + .m.g{ margin-top:1px; }
  .m.s + .m.g, .m.g + .m.s{ margin-top:8px; }
  .m.s{ align-self:flex-end; flex-direction:row-reverse; }
  .m.g{ align-self:flex-start; }
  .m .mav{ width:26px; height:26px; border-radius:7px; color:#fff; font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .bubble{ padding:7px 13px; font-size:13.5px; line-height:1.42; border-radius:17px; white-space:pre-wrap; word-break:break-word; }
  /* [2026-08-24] 옛 iMessage 색 규칙 제거 — 아래쪽 크림 규칙이 최종입니다 */
  .bubble.img{ padding:4px; }
  .bubble.img img{ display:block; max-width:230px; max-height:280px; border-radius:10px; cursor:pointer; }
  .meta{ font-size:10px; color:#8e8e93; align-self:flex-end; margin:0 5px; white-space:nowrap; }
  .foot{ border-top:1px solid var(--line); background:#fff; flex-shrink:0; }
  .qr{ display:flex; gap:5px; padding:8px 11px 0; flex-wrap:wrap; }
  .qr .chip{ font-size:10.5px; border:1px solid var(--line); border-radius:14px; padding:4px 9px; color:var(--soft-text); cursor:pointer; background:#fff; }
  .qr .chip:hover{ background:var(--soft); border-color:var(--line2); }
  .composer{ display:flex; align-items:flex-end; gap:7px; padding:8px 11px; }
  .composer .att{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line2); background:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex-shrink:0; }
  .composer textarea{ flex:1; border:1px solid #d1d1d6; border-radius:17px; padding:7px 13px; font-size:13.5px; resize:none; max-height:100px; outline:none; font-family:inherit; background:#fff; }
  .composer textarea:focus{ border-color:var(--ink); background:#fff; }
  .composer .send{ border:none; background:var(--ink); color:#fff; width:31px; height:31px; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .typing{ display:inline-flex; gap:4px; align-items:center; background:#E9E9EB; padding:10px 14px; border-radius:17px; }
  .typing i{ width:7px; height:7px; border-radius:50%; background:#b3b3b8; display:inline-block; animation:tb 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes tb{ 0%,60%,100%{ opacity:.3; } 30%{ opacity:1; } }
  /* 정보 사이드바 */
  /* [2026-08-18] 오른쪽 정보 패널은 숨김 — 객실 목록 + 채팅 두 칸 구성.
     예약 정보는 채팅창 상단 헤더에 요약해서 보여준다. */
  .info{ display:none !important; }
  .info .rm{ font-size:17px; font-weight:800; }
  .chip2{ font-size:10.5px; font-weight:800; border-radius:6px; padding:3px 8px; color:#fff; }
  .info .kv{ font-size:12.5px; line-height:2; margin-top:12px; }
  .info .kv .k{ color:var(--muted); margin-right:5px; }
  .st-stay{ background:#ecf6e9; color:var(--ok);} .st-in{ background:#e8f0fa; color:#2e5891;} .st-out{ background:#fbeae3; color:#9a4a32;} .st-none{ background:#f0eeea; color:var(--muted);}
  .stpill{ display:inline-block; font-size:11px; font-weight:800; border-radius:999px; padding:3px 11px; margin-top:8px; }
  .reqbox{ background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:11.5px; color:var(--soft-text); line-height:1.5; margin-top:12px; }
  .linkbtn{ display:block; text-align:center; border:1px solid var(--ink); border-radius:9px; padding:9px; font-size:12.5px; font-weight:700; margin-top:14px; cursor:pointer; background:#fff; }
  .empty{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .backbtn{ display:none; }
  /* 이미지 확대 */
  #lightbox{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; align-items:center; justify-content:center; }
  #lightbox img{ max-width:92%; max-height:92%; border-radius:8px; }
  @media (max-width:900px){ .info{ display:none; } }

  /* ============================================================
     📱 모바일 (아이폰 기준) — 목록 ↔ 채팅 한 화면씩 전환
     · 입력칸 16px 고정: iOS 는 그보다 작으면 탭할 때 화면을 자동 확대하고
       원래대로 안 돌아온다 (오른쪽 잘림의 원인)
     · dvh 사용: 주소창이 접힐 때 높이가 튀지 않게
     · 안전영역(노치·홈바) 여백 확보
     ============================================================ */
  /* iOS 자동 확대 방지: 입력칸 16px 미만이면 탭할 때 확대되고 되돌아오지 않습니다 [2026-08-24] */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body{ touch-action:manipulation; }
  @media (max-width:900px){
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea{ font-size:16px !important; }
  }
  @media (max-width:640px){
    html, body{ height:100%; overflow:hidden; overscroll-behavior:none; }
    #app{ height:var(--vvh, 100dvh); max-height:var(--vvh, 100dvh); }
    .foot{ position:sticky; bottom:0; z-index:5; }
    .msgs{ overscroll-behavior:contain; }
    .wrap{ max-width:none; border:0; }
    .list{ width:100%; } .pane{ display:none; } .info{ display:none; }
    body.chat .list{ display:none; } body.chat .pane{ display:flex; }
    .backbtn{ display:inline-block; }

    .top{ padding:9px 12px; padding-top:calc(9px + env(safe-area-inset-top)); }
    .msgs{ padding:12px 12px; gap:3px; }
    .m{ max-width:80%; }
    .bubble{ font-size:15px; padding:8px 13px; }
    .conv{ padding:13px 13px; }
    .conv .rm{ font-size:15px; } .conv .last{ font-size:13px; }
    .av{ width:40px; height:40px; }

    .pane .hd{ padding:8px 11px; gap:8px; }
    .pane .hd .bkinfo{ display:none; }
    /* 예약 정보는 헤더 아래 한 줄로 내려 접히지 않게 */
    .pane .hd .bkinfo.m{ display:block; }
    .bkline{ display:block; padding:7px 12px; background:var(--soft);
             border-bottom:1px solid var(--line); font-size:11.5px; color:var(--soft-text);
             white-space:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }

    .qr{ padding:9px 10px 0; gap:6px; overflow-x:auto; flex-wrap:nowrap;
         -webkit-overflow-scrolling:touch; }
    /* 객실 목록도 맨 아래 항목이 홈바에 가리지 않게 */
    .list{ padding-bottom:max(14px, env(safe-area-inset-bottom)); }
    .qr .chip{ font-size:12px; padding:6px 11px; flex:0 0 auto; }
    /* 아이폰 홈바 위로 넉넉히 띄운다.
       프로맥스처럼 화면이 큰 기종은 홈바 영역이 더 커서 딱 붙이면 잘려 보인다.
       최소 22px 은 확보하고, 기기가 알려주는 값이 그보다 크면 그 값에 12px 을 더한다. */
    .composer{ gap:8px;
               padding:10px 10px max(22px, calc(env(safe-area-inset-bottom) + 12px)); }
    /* 대화 마지막 줄이 입력창에 가리지 않도록 아래 여백 */
    .msgs{ padding-bottom:16px; }
    /* ★ iOS 자동확대 방지 — 16px 미만이면 확대됨 */
    .composer textarea{ font-size:16px; padding:9px 14px; border-radius:20px; }
    .composer .send, .composer .att{ width:38px; height:38px; }
    .list-search input{ font-size:16px; }
  }
  /* PC 에선 헤더 아래 줄 숨김 (헤더 오른쪽에 이미 표시됨) */
  .bkline{ display:none; }
  .list-head{ position:sticky; top:0; z-index:3; background:var(--soft); border-bottom:1px solid var(--line); }
  .list-search{ padding:9px 10px 0; }
  .list-search input{ width:100%; border:1px solid var(--line2); border-radius:9px; padding:8px 11px; font-size:13px; font-family:inherit; background:#fff; outline:none; }
  .list-search input:focus{ border-color:var(--ink); }
  .csum{ font-size:10.5px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trbtn{ border:none; background:none; cursor:pointer; font-size:13px; opacity:.45; align-self:flex-end; padding:0 2px; }
  .trbtn:hover{ opacity:.9; }

  /* ===== 2026-08-19 개편 : 객실 5실 고정 · 워드마크 · 읽음 상태 ===== */
  :root{ --nk:#141414; --nmuted:#8B867D; --nfaint:#B8B3A9; --nsel:#F6F5F1; --nhair:#EFEDE7; }

  .top{ padding:12px 18px; }
  .top .l{ gap:11px; }
  .wmk{ font-family:'Archivo',-apple-system,sans-serif; font-weight:700; letter-spacing:-.012em;
        white-space:nowrap; display:inline-flex; align-items:baseline; line-height:1;
        color:#fff; font-size:15px; }
  .wmk .sp{ display:inline-block; width:.26em; }
  .wmk .cjk{ font-family:'Pretendard','Apple SD Gothic Neo',sans-serif; font-weight:500; margin-left:-.055em; }
  .top .vr{ width:1px; height:14px; background:#454340; display:inline-block; }
  .top .scr{ font-size:13px; font-weight:600; color:#D6D2CA; }
  .top .cnt{ font-size:11px; color:#98938A; font-weight:600; opacity:1; }
  .top .backbtn{ font-size:15px; padding:5px 10px; }

  /* 객실 목록 */
  .list{ background:#fff; }
  .rooms-head{ padding:15px 18px 13px; display:flex; align-items:baseline; background:#fff;
               border-bottom:1px solid var(--nhair); position:sticky; top:0; z-index:3; }
  .rh-t{ font-family:'Archivo',sans-serif; font-size:10px; font-weight:800; letter-spacing:.16em;
         color:var(--nfaint); text-transform:uppercase; }
  .rh-u{ margin-left:auto; font-size:11px; color:var(--nmuted); }

  .roomrow{ padding:15px 18px; position:relative; cursor:pointer; background:#fff; }
  .roomrow + .roomrow{ box-shadow:inset 0 1px 0 var(--nhair); }
  .roomrow:hover{ background:#FBFAF7; }
  .roomrow.on{ background:var(--nsel); }
  .roomrow.on::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--nk); }
  .rr1{ display:flex; align-items:baseline; gap:8px; }
  /* [2026-08-27] 초록불 — 지금 방에 손님이 계시다는 표시.
     호실 숫자 왼쪽에 붙어서, 목록을 훑을 때 한눈에 들어옵니다. */
  .rdot{ width:7px; height:7px; border-radius:50%; flex:none; align-self:center;
         background:#3f9c63; box-shadow:0 0 0 3px rgba(63,156,99,.15); }
  .rdot.off{ background:#d3d0c9; box-shadow:none; }
  .rr-no{ font-family:'Archivo',sans-serif; font-size:21px; font-weight:800; letter-spacing:-.05em;
          line-height:1; color:var(--nk); }
  .rr-ch{ font-size:11px; color:var(--nfaint); font-weight:600; }
  .rr-tm{ margin-left:auto; font-size:10.5px; color:var(--nfaint); font-variant-numeric:tabular-nums; }
  .rr-dot{ background:var(--nk); color:#fff; font-family:'Archivo',sans-serif; font-size:9.5px;
           font-weight:800; min-width:16px; height:16px; border-radius:8px; align-self:center;
           display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
  .rr-msg{ font-size:13px; color:#2a2723; margin-top:9px; line-height:1.4;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .roomrow.idle .rr-no{ color:var(--nfaint); }
  .roomrow.idle .rr-msg{ color:var(--nmuted); }

  /* ── [2026-08-26] 목록 3분할 : 숙박 중 · 오늘 체크인 · 퇴실 후 ── */
  .lsec{ display:flex; align-items:baseline; padding:13px 18px 8px; background:#FBFAF7;
         border-top:1px solid var(--nhair); border-bottom:1px solid var(--nhair); }
  .lsec-t{ font-size:12.5px; font-weight:800; color:var(--nk); letter-spacing:-.2px; }
  .lsec-n{ margin-left:auto; font-family:'Archivo',sans-serif; font-size:10.5px;
           font-weight:800; color:var(--nfaint); }
  .lsec-note{ padding:7px 18px 9px; background:#FBFAF7; border-bottom:1px solid var(--nhair);
              font-size:11px; color:var(--nmuted); line-height:1.5; }
  .tagline{ display:flex; align-items:center; gap:7px; margin-top:9px; }
  .tg{ font-size:10.5px; font-weight:700; border-radius:5px; padding:3px 8px; }
  .tg-stay{ background:#ecf6e9; color:#3a7030; }
  .tg-in{ background:#e8f0fa; color:#2e5891; }
  .tg-out{ background:#f0eeea; color:#78736b; }
  .tg-del{ background:#fbeae3; color:#9a4a32; }
  .tg-none{ background:#f0eeea; color:#a09a90; }   /* [2026-08-27] 예약이 안 붙은 대화 */

  /* [2026-08-27] 예약이 어긋났다는 알림 — 목록 맨 위 */
  .lhealth{ margin:10px 14px 4px; padding:11px 13px; border-radius:10px;
            background:#FBF0EA; border:1px solid #EBCDBF; }
  .lhealth > b{ display:block; font-size:11.5px; color:#9a4a32; margin-bottom:7px; letter-spacing:-.2px; }
  .lh-row{ display:flex; gap:8px; align-items:baseline; padding:3px 0; }
  .lh-k{ flex:none; font-size:10.5px; font-weight:800; color:#9a4a32; min-width:64px; }
  .lh-v{ font-size:11.5px; color:#6d5a52; line-height:1.5; word-break:keep-all; }

/* ── 폰 키보드 대응 (iOS 사파리 · 갤럭시 크롬) [2026-08-24] ──
   iOS 는 키보드가 화면을 덮기만 해서 100dvh 가 줄지 않습니다 → 입력칸이 키보드 아래로 밀림.
   visualViewport 의 실제 높이를 --vvh 로 넣어 두 기종 모두 같은 방식으로 해결합니다. */
(function () {
  var vv = window.visualViewport; if (!vv) return;
  var msgs = null;
  function atBottom(){ if(!msgs) return true; return (msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight) < 80; }
  function apply(){ document.documentElement.style.setProperty('--vvh', vv.height + 'px'); }
  function keep(){ if(!msgs) msgs=document.getElementById('msgs'); var st=atBottom(); apply();
    if(st && msgs) requestAnimationFrame(function(){ msgs.scrollTop = msgs.scrollHeight; }); }
  apply();
  vv.addEventListener('resize', keep);
  vv.addEventListener('scroll', apply);
  window.addEventListener('orientationchange', function(){ setTimeout(keep, 250); });
  document.addEventListener('focusin', function(e){
    var t=e.target; if(!t || (t.tagName!=='TEXTAREA' && t.tagName!=='INPUT')) return;
    setTimeout(keep,120); setTimeout(keep,400);
  });
})();
</script>

function esc(t){ return String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(ts){ const d=new Date(ts); let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'); const ap=h<12?'오전':'오후'; h=h%12||12; return `${ap} ${h}:${m}`; }
function fmtList(ts){ const d=new Date(ts), n=new Date(); if(d.toDateString()===n.toDateString()) return fmt(ts); return `${d.getMonth()+1}/${d.getDate()}`; }
function dayLabel(ts){ const d=new Date(ts); const D=['일','월','화','수','목','금','토'][d.getDay()]; return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. (${D})`; }
function fmtKRW(n){ return (n==null)?'-':'₩'+Number(n).toLocaleString('ko-KR'); }

$('#notifBtn').addEventListener('click',()=>enablePush(true));
function urlB64(b64){ const pad='='.repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(s); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr; }
async function enablePush(interactive){
  if(!('Notification' in window)){ if(interactive) alert('이 브라우저는 알림을 지원하지 않아요.'); return; }
  const p = Notification.permission==='granted' ? 'granted' : await Notification.requestPermission();
  notifReady = (p==='granted'); updateNotifBtn();
  if(p!=='granted') return;
  // 백그라운드 웹푸시 구독 (지원 브라우저)
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.register('/sw.js');
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64(VAPID_PUBLIC) });
    const j = sub.toJSON();
    await db.from('push_subscriptions').upsert({ endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, label:staffName }, { onConflict:'endpoint' });
    if(interactive){ const b=$('#notifBtn'); b.title='알림 켜짐'; b.style.color='#FAEEC4'; }
  }catch(e){ if(interactive) alert('백그라운드 푸시 등록 실패(탭 열려있을 때 알림은 동작): '+(e.message||e)); }
}
function updateNotifBtn(){
  const b=$('#notifBtn'); if(!b) return;
  /* 아이콘은 그대로 두고 상태만 색·툴팁으로 표시한다 (글자를 넣으면 아이콘이 지워진다) */
  if(notifReady){ b.classList.add('on'); b.title='알림 켜짐'; }
  else { b.classList.remove('on'); b.title='알림 켜기'; }
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=760; g.gain.value=0.06; o.start(); setTimeout(()=>{o.stop();a.close();},160);}catch(e){} }
function notify(room,text,convId){
  if(notifReady && Notification.permission==='granted'){
    try{
      const n=new Notification(`${room} 새 문의`,{body:text||'사진', tag:'staybut-'+room});
      n.onclick=()=>{ try{ window.focus(); if(convId && typeof openConv==='function') openConv(convId); n.close(); }catch(e){} };
    }catch(e){}
  }
  beep();
}

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){ document.body.classList.remove('ready-app'); document.body.classList.add('ready-login'); $('#login').style.display='flex'; return; }
  // 상담 허용 목록 확인 — 미허용 계정은 접근 차단
  const {data:allowed}=await db.rpc('is_console_staff');
  if(!allowed){
    await db.auth.signOut();
    if(listTimer) clearInterval(listTimer);
    document.body.classList.remove('ready-app'); document.body.classList.add('ready-login'); $('#app').style.display='none'; $('#login').style.display='flex';
    $('#loginErr').textContent='이 계정은 상담 콘솔 접근 권한이 없습니다. 관리자에게 문의하세요.';
    return;
  }
  staffName=(session.user.email||'상담원').split('@')[0];
  document.body.classList.remove('ready-login'); document.body.classList.add('ready-app'); $('#login').style.display='none'; $('#app').style.display='flex';
  notifReady = ('Notification' in window && Notification.permission==='granted'); updateNotifBtn();
  if(notifReady) enablePush(false);
  quickReplies = (await db.from('chat_quick_replies').select('label,body').order('sort')).data||[];
  await loadRooms(); await loadTodayBookings();
  await refreshList(true);
  setInterval(()=>{ loadTodayBookings(); }, 10*60*1000);
  listTimer=setInterval(()=>refreshList(false),15000);
  try{ if(rtConvCh) db.removeChannel(rtConvCh);
    rtConvCh = db.channel('rt-convs')
      .on('postgres_changes',{event:'*',schema:'public',table:'chat_conversations'},()=>refreshList(false))
      .subscribe(); }catch(e){}
}

/* ============================================================
   [2026-08-27] 손님이 지금 어느 단계인지 한 곳에서 판정합니다.

   전에는 날짜만 봤습니다. 그래서 16시가 지나 이미 들어와 계신 손님이
   자정까지 「오늘 입실」로 남았습니다. 이제 시각까지 봅니다.

     체크인 예정   입실일 00:00 ~ 16:00 전     아직 안 오심
     숙박 중       입실 16:00 ~               ● 초록불
     체크아웃 예정  퇴실일 00:00 ~ 12:00 전     오늘 나가심
     퇴실 후       퇴실일 12:00 ~             접어둠

   16:00·12:00 은 객실 설정(check_in_time / check_out_time)에서 읽습니다.
   설정이 없으면 16:00 / 12:00 으로 봅니다.
   ============================================================ */
function todayYmd(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function roomTimes(bk){
  const r = (bk && bk.room_id) ? ROOMS.find(x=>x.id===bk.room_id) : null;
  const hm=(v,dflt)=>{ const m=/^(\d{1,2}):(\d{2})/.exec(String(v||'')); return m ? (+m[1])*60+(+m[2]) : dflt; };
  return { inM: hm(r&&r.check_in_time, 16*60), outM: hm(r&&r.check_out_time, 12*60) };
}
function phaseOf(bk){
  if(!bk||!bk.checkin_date||!bk.checkout_date)
    return {k:'none', label:'예약 미연결', tone:'tg-none', live:false};
  const now=new Date(), mins=now.getHours()*60+now.getMinutes(), ts=todayYmd();
  const {inM,outM}=roomTimes(bk);
  const ci=bk.checkin_date, co=bk.checkout_date;
  if(co < ts || (co===ts && mins >= outM)) return {k:'done', label:'퇴실 후',      tone:'tg-out',  live:false};
  if(co === ts)                            return {k:'out',  label:'체크아웃 예정', tone:'tg-del',  live:true };
  if(ci === ts && mins < inM)              return {k:'in',   label:'오늘 체크인',   tone:'tg-in',   live:false};
  if(ci > ts)                              return {k:'soon', label:'숙박 전',      tone:'tg-in',   live:false};
  return                                          {k:'stay', label:'숙박 중',      tone:'tg-stay', live:true };
}
/* 초록불 — 지금 방에 사람이 있다는 표시 */
function liveDot(bk){ return phaseOf(bk).live ? '<span class="rdot"></span>' : '<span class="rdot off"></span>'; }

function miniStatus(b){
  if(!b) return '';
  const p=phaseOf(b);
  if(p.k==='none'||p.k==='done') return '';
  const cls = p.k==='stay' ? 'st-stay' : p.k==='out' ? 'st-out' : 'st-in';
  return `<span class="mchip ${cls}">${p.label}</span>`;
}
function convSummary(b){
  if(!b||!b.checkin_date||!b.checkout_date) return '';
  const nights=Math.max(1,Math.round((new Date(b.checkout_date)-new Date(b.checkin_date))/86400000));
  const nm=(b.channels&&b.channels.name)||''; let cc='#78736b',lbl='직접';
  if(/에어|airbnb/i.test(nm)){cc='#FF385C';lbl='Airbnb';} else if(/부킹|booking/i.test(nm)){cc='#1B4480';lbl='Booking';} else if(/아고다|agoda/i.test(nm)){cc='#6C4BD8';lbl='Agoda';}
  return `<div class="csum">${mdow(b.checkin_date)}~${mdow(b.checkout_date)} · ${nights}박 · <span style="color:${cc};font-weight:700;">${lbl}</span></div>`;
}
// ===== 객실 5실 고정 =====
let ROOMS=[];            // [{id, room_number}]
let TODAY_BK={};         // room_id -> 오늘 묵는 예약
/* [2026-08-27] 오늘·내일 예약 점검 결과. booking_check_soon() 이 채웁니다.
   전체 예약을 훑지 않고 당장 손님이 있는 건만 봅니다. */
let HEALTH=[];
/* [2026-08-26] 목록 필터 — 기본은 '안 읽음'.
   알람 보고 들어와 답장하는 흐름이라, 평소엔 안 읽은 것만 보이면 충분합니다.
   특정 객실을 찾을 때만 '전체'로 갑니다. */
let LIST_FILTER='unread';
/* 퇴실 후 묶음은 기본으로 접혀 있습니다 */
let PAST_OPEN=false;
/* 안 읽음 탭에서 대화를 열면 읽음 처리되면서 그 줄이 사라져 버립니다.
   답장 쓰는 도중에 목록이 흔들리지 않게, 탭을 다시 누르기 전까지는 남겨둡니다. */
let STICKY_UNREAD=new Set();
let curRoomEmpty=null;   // 대화 없는 방을 열어둔 경우

function chName(n){
  const t=String(n||'');
  if(/에어|airbnb/i.test(t)) return '에어비앤비';
  if(/부킹|booking/i.test(t)) return '부킹닷컴';
  if(/아고다|agoda/i.test(t)) return '아고다';
  return t || '직접예약';
}
function kstToday(){ return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10); }

async function loadRooms(){
  // 도어락·와이파이 비밀번호는 가져오지 않는다.
  // [2026-08-26] public_key 는 '오늘 체크인' 손님에게 QR 링크를 보내기 위해 추가.
  /* [2026-08-27] 입실·퇴실 시각을 같이 가져옵니다.
     배지가 「오늘 입실 → 숙박 중」으로 넘어가는 기준이 이 값입니다.
     객실 설정을 바꾸면 배지도 따라 바뀝니다. */
  const {data}=await db.from('rooms').select('id,room_number,public_key,check_in_time,check_out_time');
  ROOMS=(data||[]).slice().sort((a,b)=>
    String(a.room_number).localeCompare(String(b.room_number),'en',{numeric:true}));
}
async function loadTodayBookings(){
  const t=kstToday();
  const {data}=await db.from('bookings')
    .select('id,room_id,checkin_date,checkout_date,nights,num_guests,guest_headcount,booking_status,channels(name)')
    .lte('checkin_date',t).gt('checkout_date',t);
  TODAY_BK={};
  (data||[]).forEach(b=>{ if((b.booking_status||'')!=='cancelled') TODAY_BK[b.room_id]=b; });
  await loadHealth();
}

/* [2026-08-27] 오늘·내일 예약이 어긋났는지 확인합니다.
   supabase-js 는 오류를 던지지 않고 {error} 로 돌려주므로 반드시 확인합니다.
   점검이 실패해도 목록은 그대로 떠야 하니 조용히 비웁니다. */
async function loadHealth(){
  try{
    const {data,error}=await db.rpc('booking_check_soon');
    HEALTH = (!error && Array.isArray(data)) ? data : [];
  }catch(e){ HEALTH=[]; }
}
function bkLine(b){
  if(!b) return '오늘 예약 없음';
  const md=d=>d?String(d).slice(5).replace('-','/'):'';
  const n=b.nights || ((b.checkin_date&&b.checkout_date)
    ? Math.round((new Date(b.checkout_date)-new Date(b.checkin_date))/86400000) : 0);
  const g=b.guest_headcount||b.num_guests;
  return `${chName(b.channels&&b.channels.name)} · ${md(b.checkin_date)}~${md(b.checkout_date)}`
       + (n?` · ${n}박`:'') + (g?` · ${g}명`:'');
}

async function refreshList(first){
  // [2026-08-26] 퇴실 후 대화도 목록에 보여주려고 status 필터를 뺐습니다.
  //              (퇴실 14일 뒤에는 chat_purge_old() 가 알아서 지웁니다)
  const {data,error}=await db.from('chat_conversations').select(CONV_SEL)
    .order('last_message_at',{ascending:false}).limit(200);
  if(error||!data) return;
  const tot=data.filter(c=>c.status==='open').reduce((s,c)=>s+(c.unread_staff||0),0);
  const _oc = $('#openCnt'); if (_oc) _oc.textContent = tot ? `안 읽음 ${tot}` : '';
  const _tb = $('#tbUnread');
  if (_tb) {
    if (tot > 0) { _tb.textContent = tot > 99 ? '99+' : tot; _tb.style.display = 'inline-block'; }
    else _tb.style.display = 'none';
  }
  setTitleBadge(tot);

  const newest=data.find(c=>c.last_sender==='guest' && c.unread_staff>0);
  if(newest){
    const key=newest.id+'|'+newest.last_message_at;
    if(!first && lastNotifiedMsgId && lastNotifiedMsgId!==key && (!curConv || curConv!==newest.id || document.hidden)){
      notify(newest.room_number, newest.last_message, newest.id);
    }
    lastNotifiedMsgId=key;
  }

  // ── [2026-08-26] 목록을 세 덩어리로 나눕니다 ──
  //   숙박 중 · 오늘 체크인 · 퇴실 후
  //   앞의 둘은 예전처럼 '객실' 기준, 퇴실 후는 '대화' 기준입니다.
  const TDY = new Date(); TDY.setHours(0,0,0,0);
  const ymd = TDY.getFullYear()+'-'+String(TDY.getMonth()+1).padStart(2,'0')+'-'+String(TDY.getDate()).padStart(2,'0');
  const dayDiff = d => d ? Math.round((TDY - new Date(d+'T00:00:00'))/86400000) : null;

  const byRoom={};
  data.forEach(c=>{
    if(c.status!=='open') return;                 // 퇴실 대화는 아래에서 따로
    const k=String(c.room_number);
    if(!byRoom[k] || String(c.last_message_at) > String(byRoom[k].last_message_at)) byRoom[k]=c;
  });

  const head=`<div class="rooms-head"><span class="rh-t">Conversations</span>`
           + `<span class="rh-u">${tot? '안 읽음 '+tot : ROOMS.length+'실'}</span></div>`
           + `<div class="ltabs">`
           + `<button data-f="unread" class="${LIST_FILTER==='unread'?'on':''}">안 읽음${tot?` <b>${tot}</b>`:''}</button>`
           + `<button data-f="all" class="${LIST_FILTER==='all'?'on':''}">전체</button>`
           + `</div>`
           + renderHealth();

  const sec=(t,n,note)=>`<div class="lsec"><span class="lsec-t">${t}</span>`
           + `<span class="lsec-n">${n}</span></div>`
           + (note?`<div class="lsec-note">${note}</div>`:'');

  /* [2026-08-27] 예약이 어긋났다는 신호를 목록 맨 위에 띄웁니다.
     가장 중요한 건 「전송 거부」입니다 —
     예약은 나갔다고 하는데 손님이 실제로는 방에 있을 때 잡힙니다.
     전에는 거부가 손님 화면에서만 일어나 사장님이 끝까지 몰랐습니다. */
  function renderHealth(){
    if(!HEALTH || !HEALTH.length) return '';
    const ico = { '전송 거부':'⚠', '예약 미연결':'⚠', '객실 없음':'?', '날짜 이상':'!', '예약 겹침':'!' };
    return `<div class="lhealth"><b>확인이 필요합니다</b>`
      + HEALTH.slice(0,6).map(h=>
          `<div class="lh-row"><span class="lh-k">${esc(ico[h.구분]||'·')} ${esc(h.구분)}</span>`
          + `<span class="lh-v">${h.객실&&h.객실!=='-'?esc(h.객실)+'호 · ':''}${esc(h.내용)}</span></div>`
        ).join('')
      + `</div>`;
  }

  const roomRow=(r, kind)=>{
    const rn=String(r.room_number);
    const c=byRoom[rn];
    const bk=TODAY_BK[r.id];
    const on=(c && c.id===curConv) || (!c && curRoomEmpty===rn);
    const nights = bk && bk.checkin_date && bk.checkout_date
      ? Math.round((new Date(bk.checkout_date)-new Date(bk.checkin_date))/86400000) : 0;
    /* [2026-08-27] 「오늘 체크인」일 때만 날짜가 빠져 「2박」만 보였습니다.
       며칠 묵는지보다 언제 오고 언제 가는지가 먼저 궁금하니 항상 같이 씁니다. */
    const md = d => String(d).slice(5).replace('-','/');
    const sub = bk && bk.checkin_date && bk.checkout_date
              ? md(bk.checkin_date)+'~'+md(bk.checkout_date)+(nights?' · '+nights+'박':'')
              : '';
    const preview = c ? ((c.last_sender==='staff'?'나: ':'')+(c.last_message||'새 대화'))
                      : (bk ? '아직 문의 없음'+(bk.channels&&bk.channels.name?' · '+bk.channels.name:'') : '비어 있음');
    /* [2026-08-27] 태그를 phaseOf() 한 곳에서 가져옵니다.
       「링크 복사」는 안 쓰신다고 하셔서 뺐습니다. */
    const ph=phaseOf(bk);
    const tags = bk ? `<span class="tg ${ph.tone}">${ph.live?'● ':''}${ph.label}</span>` : '';
    return `<div class="roomrow${c?'':' idle'}${on?' on':''}" data-id="${c?c.id:''}" data-room="${esc(rn)}">
      <div class="rr1">${liveDot(bk)}<span class="rr-no">${esc(rn)}</span>${sub?`<span class="rr-ch">${esc(sub)}</span>`:''}
        <span class="rr-tm">${c?fmtList(c.last_message_at):''}</span>
        ${c&&c.unread_staff?`<span class="rr-dot">${c.unread_staff}</span>`:''}</div>
      <div class="rr-msg">${esc(preview)}</div>
      ${tags?`<div class="tagline">${tags}</div>`:''}
    </div>`;
  };

  /* [2026-08-27] 객실을 네 단계로 가릅니다 — 날짜가 아니라 phaseOf() 기준입니다.
     16시가 지나면 「오늘 체크인」이 저절로 「숙박 중」으로 넘어갑니다. */
  const arriving=[], staying=[], leaving=[], idleRooms=[];
  ROOMS.forEach(r=>{
    const bk=TODAY_BK[r.id];
    if(!bk){ idleRooms.push(r); return; }
    const k=phaseOf(bk).k;
    if(k==='in')       arriving.push(r);
    else if(k==='out') leaving.push(r);
    else if(k==='stay')staying.push(r);
    else               idleRooms.push(r);   // 퇴실 후는 아래 '퇴실 후' 묶음에서 다룹니다
  });

  // 퇴실 후 — 종료된 대화 (퇴실 14일 뒤 자동 삭제)
  // [2026-08-26] 오간 말이 있는 대화만 남깁니다.
  //   손님이 QR 만 찍고 아무것도 안 물어본 빈 대화가 절반이라 목록만 잡아먹었습니다.
  //   (분실물·리뷰·분쟁 확인용이므로 내용이 없으면 볼 이유가 없습니다)
  const past = data.filter(c=>{
    if(c.status==='open') return false;
    const co=c.booking && c.booking.checkout_date;
    if(!co || dayDiff(co) < 0) return false;
    return !!(c.last_message && c.last_message.trim());
  });
  // 안 읽음 탭 전용 — 객실이 아니라 '대화' 한 건을 그립니다
  const convRow=(c, emphasize)=>{
    const bk=c.booking, on=c.id===curConv;
    const md = d => String(d).slice(5).replace('-','/').replace(/^0/,'');
    /* [2026-08-27] 여기도 phaseOf() 로 통일. 화면마다 문구가 다르면 헷갈립니다. */
    let sub='예약 미연결', tag='', tone='tg-stay';
    if(bk && bk.checkin_date){
      sub = md(bk.checkin_date)+'~'+md(bk.checkout_date);
      const ph=phaseOf(bk);
      tone = ph.tone;
      tag  = (ph.live?'● ':'')+ph.label;
      if(ph.k==='done'){                       // 퇴실한 건은 언제 지워지는지 같이 알려줍니다
        const dOut=dayDiff(bk.checkout_date), left=(dOut===null?null:14-dOut);
        if(left!==null) tag += left>0 ? ' · '+left+'일 뒤 삭제' : ' · 곧 삭제';
      }
    }
    return `<div class="roomrow${on?' on':''}${emphasize?' hot':''}" data-id="${c.id}" data-room="${esc(String(c.room_number))}">
      <div class="rr1">${liveDot(bk)}<span class="rr-no">${esc(String(c.room_number))}</span>
        <span class="rr-ch">${esc(sub)}</span>
        <span class="rr-tm">${fmtList(c.last_message_at)}</span>
        ${c.unread_staff?`<span class="rr-dot">${c.unread_staff}</span>`:''}</div>
      <div class="rr-msg">${esc((c.last_sender==='staff'?'나: ':'')+(c.last_message||'새 대화'))}</div>
      ${tag?`<div class="tagline"><span class="tg ${tone}">${esc(tag)}</span></div>`:''}
    </div>`;
  };

  const pastRow=c=>{
    const co=c.booking.checkout_date, d=dayDiff(co), left=14-d;
    const on = c.id===curConv;
    return `<div class="roomrow idle${on?' on':''}" data-id="${c.id}" data-room="${esc(String(c.room_number))}">
      <div class="rr1"><span class="rr-no">${esc(String(c.room_number))}</span>
        <span class="rr-ch">${d===0?'오늘 퇴실':String(co).slice(5).replace('-','/')+' 퇴실'}</span>
        <span class="rr-tm">${fmtList(c.last_message_at)}</span>
        ${c.unread_staff?`<span class="rr-dot">${c.unread_staff}</span>`:''}</div>
      <div class="rr-msg">${esc((c.last_sender==='staff'?'나: ':'')+(c.last_message||'(메시지 없음)'))}</div>
      <div class="tagline"><span class="tg tg-out">${d===0?'오늘 퇴실':d+'일 전 퇴실'}</span>
        <span class="tg tg-del">${left>0?left+'일 뒤 삭제':'곧 삭제'}</span></div>
    </div>`;
  };

  // 안 읽음 탭에 남겨둘 대화 (열어서 읽음이 되어도 탭 다시 누르기 전까진 유지)
  data.forEach(c=>{ if(c.unread_staff>0) STICKY_UNREAD.add(c.id); });

  // [2026-08-26] 상담 화면이므로 '문의 없는 방'은 감춥니다.
  //   단 '오늘 체크인'은 링크 복사 버튼이 있어 할 일이 남아 있으므로 그대로 둡니다.
  const hasConv = r => !!byRoom[String(r.room_number)];
  const stayingShown  = staying.filter(hasConv);
  const leavingShown  = leaving.filter(hasConv);
  const idleShown     = [];                    // 공실은 상담 화면에서 감춥니다
  const hiddenCount   = (staying.length - stayingShown.length)
                      + (leaving.length - leavingShown.length) + idleRooms.length;

  let items='';
  if(LIST_FILTER==='unread'){
    const un = data.filter(c=>STICKY_UNREAD.has(c.id))
                   .sort((a,b)=>String(b.last_message_at).localeCompare(String(a.last_message_at)));
    // [2026-08-26] 안 읽음 탭에서는 퇴실 건이라도 흐리게 하지 않습니다.
    //   여기 있다는 건 아직 답을 안 했다는 뜻이라, 회색 처리하면 오히려 놓칩니다.
    items = un.map(c=>convRow(c, true)).join('');
    if(!items) items = `<div class="lempty"><b>안 읽은 문의가 없습니다</b>`
                     + `새 문의가 오면 여기에 바로 뜹니다.</div>`;
  }else{
    /* [2026-08-27] 다시 머리말로 갈랐습니다. 태그만으로는 눈에 안 들어왔습니다.
       순서는 손이 갈 일이 급한 것부터 — 오늘 나가실 분, 지금 계신 분, 이따 오실 분. */
    if(leavingShown.length) items += sec('체크아웃 예정', leavingShown.length+'실')
                                   + leavingShown.map(r=>roomRow(r,'out')).join('');
    if(stayingShown.length) items += sec('숙박 중', stayingShown.length+'실')
                                   + stayingShown.map(r=>roomRow(r,'stay')).join('');
    if(arriving.length)     items += sec('오늘 체크인', arriving.length+'실')
                                   + arriving.map(r=>roomRow(r,'in')).join('');
    // [2026-08-26] 퇴실 후는 기본으로 접어둡니다. 분실물·리뷰 확인 때만 펼치면 됩니다.
    if(past.length){
      items += `<button class="lfold${PAST_OPEN?' open':''}" id="foldPast">`
             + `<span>퇴실 후</span><span class="n">${past.length}건</span>`
             + `<span class="cv">${PAST_OPEN?'▴':'▾'}</span></button>`
             + `<div class="lfoldbox${PAST_OPEN?'':' hide'}">`
             + `<div class="lsec-note">퇴실 14일 뒤 자동 삭제</div>`
             + past.map(pastRow).join('') + `</div>`;
    }
    if(hiddenCount)     items += `<div class="lhidden">문의가 없는 객실 ${hiddenCount}실은 숨겼습니다</div>`;
  }

  const list=$('#list');
  list.innerHTML=head+items;
  list.querySelectorAll('.roomrow').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.id;
    if(id){ const c=data.find(x=>x.id===id)||past.find(x=>x.id===id); if(c) openConv(c); }
    else openEmptyRoom(el.dataset.room);
  }));
  { const fp=list.querySelector('#foldPast');
    if(fp) fp.addEventListener('click',()=>{ PAST_OPEN=!PAST_OPEN; refreshList(false); }); }
  list.querySelectorAll('.ltabs button').forEach(el=>el.addEventListener('click',()=>{
    LIST_FILTER = el.dataset.f;
    STICKY_UNREAD.clear();          // 탭을 누를 때만 정리합니다
    refreshList(false);
  }));
  /* [2026-08-27] 「링크 복사」 제거 — 안 쓰신다고 하셔서 뺐습니다.
     QR 은 객실에 붙어 있어 손님이 직접 찍으므로 링크를 보낼 일이 없었습니다. */
}

// 대화가 아직 없는 방
function openEmptyRoom(roomNo){
  curConv=null; curRoomEmpty=String(roomNo); curRoom=String(roomNo);

// ===== 상태/정보 =====
function stayInfo(b){
  if(!b) return {chip:'', pill:'<span class="stpill st-none">연결된 예약 없음</span>', kv:''};
  const ci=b.checkin_date,co=b.checkout_date;
  const nights=Math.max(1,Math.round((new Date(co)-new Date(ci))/86400000));
  const t=new Date(); t.setHours(0,0,0,0); const ts=t.toISOString().slice(0,10);
  const ciD=new Date(ci+'T00:00:00'), coD=new Date(co+'T00:00:00');
  /* [2026-08-27] 날짜만 보던 판정을 phaseOf() 로 옮겼습니다. 시각까지 봅니다. */
  const ph=phaseOf(b);
  const pcls = ph.k==='stay' ? 'st-stay' : ph.k==='out' ? 'st-out'
             : ph.k==='done' ? 'st-none' : 'st-in';
  const pill = ph.k==='none' ? '' :
    `<span class="stpill ${pcls}">${ph.live?'● ':''}${ph.label}</span>`;
  const nm=(b.channels&&b.channels.name)||''; let cc='#78736b',lbl='직접';
  if(/에어|airbnb/i.test(nm)){cc='#FF385C';lbl='에어비앤비';} else if(/부킹|booking/i.test(nm)){cc='#1B4480';lbl='부킹닷컴';} else if(/아고다|agoda/i.test(nm)){cc='#6C4BD8';lbl='아고다';}
  const g=b.num_guests?` · ${b.num_guests}명`:'';
  const kv=`<div><span class="k">숙박</span><b>${mdow(ci)}~${mdow(co)} · ${nights}박${g}</b></div>`;
  return {chip:`<span class="chip2" style="background:${cc}">${lbl}</span>`, pill, kv};
}

// ===== 대화 열기 =====
// 채팅창 헤더 오른쪽에 표시할 예약 한 줄 요약 (오른쪽 패널 대체)
function headBooking(b){
  if(!b) return '<span style="color:#c0392b">연결된 예약 없음</span>';
  const md = d => d ? String(d).slice(5).replace('-','/') : '';
  const won = v => v ? '₩'+Number(v).toLocaleString('ko-KR') : '';
  const p = [];
  if(b.checkin_date){
    const nights = Math.round((new Date(b.checkout_date)-new Date(b.checkin_date))/86400000);
    p.push(md(b.checkin_date)+'~'+md(b.checkout_date)+(nights>0?' ('+nights+'박)':''));
  }
  const g = b.guest_headcount || b.num_guests;
  if(g) p.push(g+'명'+(b.guest_headcount?' ✓':''));
  if(b.channels && b.channels.name) p.push(b.channels.name);
  return esc(p.join('  ·  '));
}

// 예약 정보 패널 내용
function bkPanelHTML(c){
  const b=(c&&c.booking)||null;
  const rows=[];
  const add=(k,v)=>{ if(v!==null&&v!==undefined&&String(v).trim()!=='')
    rows.push(`<div class="bk-r"><span class="bk-k">${k}</span><span class="bk-v">${esc(String(v))}</span></div>`); };
  if(b){
    add('예약번호', b.channel_booking_code);
    const g=b.guest_headcount||b.num_guests;
    add('인원', g? (g+'명'+(b.guest_headcount?' · 확인됨':'')) : '');
    add('국가', b.guest_country);
    add('도착 예정', b.arrival_time_note);
    add('요청사항', b.notes || b.raw_note);
  }
  const body = rows.length ? `<div class="bk-kv">${rows.join('')}</div>`
                           : `<div class="bk-none">${b?'추가로 적힌 정보가 없습니다.':'연결된 예약이 없습니다.'}</div>`;
  const acts = `<div class="bk-act">`
    + ((b&&b.id)? `<button class="btn-line" onclick="window.open('${ADMIN_URL}/#booking=${b.id}','_blank')">예약 상세 보기 ↗</button>`:'')
    + `<button class="btn-danger" onclick="window._delConv('${c.id}')">대화 삭제</button></div>`;
  return body + acts;
}

    <div class="foot">

      <div class="composer">
        <div class="att" id="attBtn" title="사진 보내기" aria-label="사진 보내기" style="display:flex;align-items:center;justify-content:center;color:#8f8f89;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
        <textarea id="reply" rows="1" placeholder="답장 입력…"></textarea>
        <button class="send off" id="sendBtn" aria-label="메시지 전송" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M21.4 3.1 2.9 10.4c-.8.3-.8 1.5.1 1.7l7 1.9 1.9 7c.2.9 1.4.9 1.7.1l7.3-18.5c.2-.6-.3-1.2-.9-.9z"/><path d="M10 14 21.4 3.1"/></svg></button>
      </div>
    </div>`;
  $('#sendBtn').addEventListener('click',()=>send());
  const _bt=$('#bkToggle');
  if(_bt) _bt.addEventListener('click',()=>{
    const pn=$('#bkPanel'); if(!pn) return;
    pn.hidden=!pn.hidden;
    _bt.textContent='예약 정보 '+(pn.hidden?'▾':'▴');
  });
  $('#attBtn').addEventListener('click',()=>{ const fi=$('#fileInput'); fi.value=''; fi.click(); });
  const rep=$('#reply');
  rep.addEventListener('input',()=>{ syncSend(); rep.style.height='auto'; rep.style.height=Math.min(rep.scrollHeight,120)+'px'; const now=Date.now(); if(rtTypeCh && now-staffTypingAt>1800){ staffTypingAt=now; try{ rtTypeCh.send({type:'broadcast',event:'typing',payload:{who:'staff'}}); }catch(e){} } });
  rep.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
  $('#qr').querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{ const q=quickReplies[+ch.dataset.i]; if(q){ rep.value=q.body; rep.focus(); rep.dispatchEvent(new Event('input')); } }));
  // 드래그&드롭
  const msgsEl=$('#msgs');
  ['dragover','dragenter'].forEach(ev=>msgsEl.addEventListener(ev,e=>{e.preventDefault();}));
  msgsEl.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) uploadAndSend(f); });
  await markRead(c.id); await loadMsgs(true);

      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'conversation_id=eq.'+c.id},()=>loadMsgs(false))
      .subscribe(); }catch(e){}
  try{ if(rtTypeCh) db.removeChannel(rtTypeCh);

async function markRead(id){ try{ await db.from('chat_conversations').update({unread_staff:0, staff_last_seen:new Date().toISOString()}).eq('id',id); }catch(e){} }
async function deleteConv(id){
  if(!id) return;
  if(!confirm('이 대화와 모든 메시지를 삭제할까요? 되돌릴 수 없어요.')) return;
  try{
    await db.from('chat_messages').delete().eq('conversation_id',id);
    const {error}=await db.from('chat_conversations').delete().eq('id',id);
    if(error){ alert('삭제 실패: '+error.message); return; }
  }catch(e){ alert('삭제 실패'); return; }
  if(curConv===id){ curConv=null; $('#pane').innerHTML='<div class="empty">왼쪽에서 객실을 선택하세요</div>'; document.body.classList.remove('chat'); }
  refreshList(false);
}
window._delConv=deleteConv;

async function loadMsgs(first){
  if(!curConv) return;
  const [{data:msgs},{data:convs}]=await Promise.all([
    db.from('chat_messages').select('id,sender,body,msg_type,image_path,created_at').eq('conversation_id',curConv).order('created_at'),
    db.from('chat_conversations').select('guest_last_seen').eq('id',curConv).limit(1)
  ]);
  if(!msgs) return;
  curGuestSeen = convs&&convs[0]?convs[0].guest_last_seen:null;
  const sig=msgs.length+'|'+(msgs.length?msgs[msgs.length-1].id:'')+'|'+curGuestSeen;
  if(sig===msgSig && !first) return;
  msgSig=sig;
  renderMsgs(msgs, first);
}
function showTypingC(){ const box=document.getElementById('msgs'); if(!box) return; clearTimeout(typingHideC); let t=document.getElementById('typingrowC'); if(!t){ t=document.createElement('div'); t.id='typingrowC'; t.className='m g'; t.innerHTML='<div class="typing"><i></i><i></i><i></i></div>'; box.appendChild(t); box.scrollTop=box.scrollHeight; } typingHideC=setTimeout(()=>{ const x=document.getElementById('typingrowC'); if(x) x.remove(); },3500); }
async function translateText(text,target){
  const {data,error}=await db.functions.invoke('translate',{body:{text,target}});
  if(error) throw error;
  if(data&&data.ok&&data.text) return data.text;
  throw new Error('translate_failed');
}
// === 자동 번역 ===
// 손님 메시지가 한국어가 아니면 → 한국어로 자동 번역해 아래에 표시
const _trCache = {};              // 같은 문장 재번역 방지
function _needsTranslate(text){
  const t=(text||'').trim();
  if(t.length<2) return false;
  if(/[가-힣]/.test(t)) return false;          // 한국어면 번역 불필요
  if(!/[A-Za-z぀-ヿ一-鿿]/.test(t)) return false; // 글자 없으면(숫자·기호) 제외
  return true;
}
async function autoTranslateMsgs(box){
  const rows=[...box.querySelectorAll('.m.g[data-tx]')];
  for(const row of rows){
    if(row.dataset.trDone) continue;
    const text=decodeURIComponent(row.dataset.tx||'');
    if(!_needsTranslate(text)){ row.dataset.trDone='1'; continue; }
    row.dataset.trDone='1';
    try{
      let t=_trCache[text];
      if(!t){ t=await translateText(text,'KO'); _trCache[text]=t; }
      if(!t || t.trim()===text.trim()) continue;
      const tr=document.createElement('div'); tr.className='m g trrow';
      tr.innerHTML='<div class="mav" style="background:transparent"></div><div class="bubble" style="background:transparent;color:#867F72;font-size:12.5px;padding:2px 4px;">'+esc(t)+'</div>';
      row.after(tr);
    }catch(e){}
  }
}
function renderMsgs(msgs, first){
  const box=$('#msgs'); if(!box) return;
  const stick = first || (box.scrollHeight-box.scrollTop-box.clientHeight<120);
  let html=''; let lastDay=''; const seenTs=curGuestSeen?new Date(curGuestSeen).getTime():0;
  msgs.forEach((m,idx)=>{
    const day=dayLabel(m.created_at);
    if(day!==lastDay){ html+=`<div class="daydiv">${day}</div>`; lastDay=day; }
    const isS=m.sender==='staff';
    const isImg=m.msg_type==='image'&&m.image_path;
    const av=isS?`<div class="mav" style="background:#57534c">나</div>`:`<div class="mav" style="background:${avColor(curRoom)}">${esc(curRoom)}</div>`;
    let inner = isImg
      ? `<div class="bubble img"><img data-path="${esc(m.image_path)}" alt="사진" /></div>`
      : `<div class="bubble">${esc(m.body)}</div>`;
    // 읽음: 직원 메시지 & 손님이 그 이후 확인
    let read='';
    if(isS){
      const isLastStaff = !msgs.slice(idx+1).some(x=>x.sender==='staff');
      if(isLastStaff){
        if(!curGuestSeen) read='<span class="rd never">미접속</span>';
        else if(seenTs>new Date(m.created_at).getTime()) read='<span class="rd">'+fmt(curGuestSeen)+'에 읽음</span>';
        else read='<span class="rd no-read">안 읽음</span>';
      }
    }
    const meta=`<span class="meta">${read?read+' · ':''}${fmt(m.created_at)}</span>`;
    const trb=(!isImg && m.body && m.body.trim())?`<button class="trbtn" data-tx="${encodeURIComponent(m.body)}" title="번역">🌐</button>`:'';
    const txAttr=(!isImg && m.body && m.body.trim())?` data-tx="${encodeURIComponent(m.body)}"`:'';
    html+=`<div class="m ${isS?'s':'g'}"${txAttr}>${av}${inner}${meta}${trb}</div>`;
  });
  box.innerHTML=html;
  // 미접속 안내 : 손님이 대화를 한 번도 연 적 없고, 우리가 보낸 메시지가 있을 때
  const _al=document.getElementById('chatAlert');
  if(_al){
    const hasStaff=msgs.some(x=>x.sender==='staff');
    if(!curGuestSeen && hasStaff){
      _al.textContent='손님이 아직 채팅을 한 번도 열지 않았습니다. 객실 QR을 못 봤을 수 있어요.';
      _al.hidden=false;
    } else _al.hidden=true;
  }
  // 손님 언어 표시
  const _lg=document.getElementById('chLang');
  if(_lg){
    const gs=msgs.filter(x=>x.sender==='guest'&&x.body&&x.body.trim()).slice(-3);
    if(!gs.length) _lg.innerHTML='';
    else if(gs.some(x=>/[가-힣]/.test(x.body))) _lg.innerHTML='손님 언어 <b>한국어</b>';
    else if(gs.some(x=>/[ぁ-んァ-ヿ]/.test(x.body))) _lg.innerHTML='손님 언어 <b>日本語</b>';
    else if(gs.some(x=>/[一-鿿]/.test(x.body))) _lg.innerHTML='손님 언어 <b>中文</b>';
    else _lg.innerHTML='손님 언어 <b>English</b>';
  }
  autoTranslateMsgs(box);
  box.querySelectorAll('.trbtn').forEach(b=>b.addEventListener('click',async()=>{
    if(b.dataset.done) return;
    const text=decodeURIComponent(b.dataset.tx||''); if(!text) return;
    const tgt=/[가-힣]/.test(text)?'EN':'KO'; const old=b.textContent; b.textContent='…';
    try{ const t=await translateText(text,tgt);
      const row=b.closest('.m'); const side=row.classList.contains('s')?'s':'g';
      const tr=document.createElement('div'); tr.className='m '+side;
      tr.innerHTML='<div class="bubble" style="background:transparent;color:#867F72;font-size:12.5px;padding:2px 4px;">'+esc(t)+'</div>';
      row.after(tr); b.dataset.done='1'; b.textContent='🌐';
    }catch(e){ b.textContent=old||'🌐'; }
  }));
  // 이미지: 비공개 버킷 → 서명URL로 로드 (인증된 직원)
  box.querySelectorAll('img[data-path]').forEach(im=>{ const p=im.getAttribute('data-path'); signImg(p).then(u=>{ if(u){ im.src=u; im.onclick=()=>_openImg(u); } }); });
  if(stick) box.scrollTop=box.scrollHeight;
}
const _imgCache={};
async function signImg(path){
  if(_imgCache[path]) return _imgCache[path];
  try{ const {data}=await db.storage.from('chat-images').createSignedUrl(path,3600); if(data&&data.signedUrl){ _imgCache[path]=data.signedUrl; return data.signedUrl; } }catch(e){}
  return null;
}

function syncSend(){
  const rep=$('#reply'), sb=$('#sendBtn');
  if(!rep||!sb) return;
  const on=!!rep.value.trim();
  sb.disabled=!on; sb.classList.toggle('off',!on);
}
async function send(){
  const rep=$('#reply'); if(!rep) return;
  const body=rep.value.trim(); if(!body||!curConv) return;
  const btn=$('#sendBtn'); btn.disabled=true;
  const {error}=await db.from('chat_messages').insert({conversation_id:curConv,sender:'staff',body,msg_type:'text',staff_name:staffName});
  if(!error){
    await db.from('chat_conversations').update({last_message:body.slice(0,200), last_sender:'staff', last_message_at:new Date().toISOString(), unread_staff:0, staff_last_seen:new Date().toISOString()}).eq('id',curConv);
    rep.value=''; rep.style.height='auto'; syncSend(); await loadMsgs(false); const box=$('#msgs'); if(box) box.scrollTop=box.scrollHeight; refreshList(false);
  } else alert('전송 실패');
  btn.disabled=false; rep.focus();
}
// 사진 업로드 (직원: 비공개 버킷 직접 업로드 → image_path 메시지)
$('#fileInput').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) uploadAndSend(f); });
async function uploadAndSend(file){
  if(!curConv) return;
  if(file.size>6*1024*1024){ alert('6MB 이하 이미지만 보낼 수 있어요.'); return; }
  const ct=file.type||'image/jpeg';
  const ext=ct.includes('png')?'png':ct.includes('webp')?'webp':ct.includes('gif')?'gif':'jpg';
  const path=`${curConv}/${(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2))}.${ext}`;
  const {error}=await db.storage.from('chat-images').upload(path,file,{contentType:ct,upsert:false});
  if(error){ alert('사진 업로드 실패: '+error.message); return; }
  const {error:e2}=await db.from('chat_messages').insert({conversation_id:curConv,sender:'staff',msg_type:'image',body:'[사진]',image_path:path,staff_name:staffName});
  if(e2){ alert('전송 실패'); return; }
  await db.from('chat_conversations').update({last_message:'[사진]', last_sender:'staff', last_message_at:new Date().toISOString(), unread_staff:0, staff_last_seen:new Date().toISOString()}).eq('id',curConv);
  await loadMsgs(false); const box=$('#msgs'); if(box) box.scrollTop=box.scrollHeight; refreshList(false);
}
