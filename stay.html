<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>숙소 안내 · 문의</title>
<style>
:root{
  --bg:#f2f3f5;--card:#fff;--line:#eceef1;--line2:#dfe2e6;
  --text:#17181c;--muted:#7a8290;--dim:#aab0ba;--ink:#17181c;
  --ok:#0f9d58;--okbg:#eaf7ef;--okline:#c9ead6;--danger:#e0485c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',Roboto,sans-serif;
  display:flex;flex-direction:column;font-size:15px;}

/* 헤더 */
.hd{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:11px;flex:none;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.hd .lg{width:36px;height:36px;flex:none;border-radius:11px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;overflow:hidden;}
.hd .lg img{width:100%;height:100%;object-fit:contain;background:#fff;}
.hd .t{min-width:0;flex:1;}
.hd .t b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;}
.hd .t span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.hd .badge{flex:none;font-size:11px;font-weight:700;border-radius:20px;padding:4px 10px;
  background:var(--okbg);color:var(--ok);border:1px solid var(--okline);}

/* 본문 */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 8px;}
.sec{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 10px 2px;letter-spacing:.01em;}
.sec:not(:first-child){margin-top:24px;}

/* 안내 카드 */
.info{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05);}
.ic{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);}
.ic:last-child{border-bottom:0;}
.ic .kv{min-width:0;}
.ic .k{font-size:12px;color:var(--muted);}
.ic .v{font-size:15px;margin-top:3px;line-height:1.45;}
.ic.locked .v{color:var(--dim);font-size:13.5px;}
.ic .lockicon{flex:none;font-size:15px;color:var(--dim);}
.ic.code{background:var(--okbg);}
.ic.code .k{color:var(--ok);}
.ic.code .v{font-size:21px;font-weight:700;letter-spacing:.14em;color:#0b7a45;
  font-variant-numeric:tabular-nums;margin-top:2px;}
.cp{flex:none;border:1px solid var(--okline);background:#fff;color:var(--ok);
  border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.cp.plain{border-color:var(--line2);color:var(--muted);}

/* 이용 안내 */
.notes{background:var(--card);border-radius:16px;padding:15px 16px;font-size:14px;color:#3f4650;
  line-height:1.75;box-shadow:0 1px 2px rgba(16,24,40,.05);white-space:pre-wrap;}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:9px;padding-bottom:6px;}
.row{display:flex;align-items:flex-end;gap:7px;}
.row.g{justify-content:flex-start;} .row.s{justify-content:flex-end;}
.b{max-width:78%;padding:11px 14px;border-radius:17px;font-size:15px;line-height:1.55;
  word-break:break-word;white-space:pre-wrap;}
.row.g .b{background:#fff;border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(16,24,40,.05);}
.row.s .b{background:var(--ink);color:#fff;border-bottom-right-radius:6px;}
.b .tr{display:block;font-size:13px;margin-top:8px;padding-top:8px;
  border-top:1px dashed rgba(0,0,0,.12);color:#6b7280;}
.row.s .b .tr{border-top-color:rgba(255,255,255,.2);color:#c9ced6;}
.time{font-size:10.5px;color:var(--dim);flex:none;padding-bottom:2px;}
.sysmsg{background:var(--card);border-radius:14px;padding:14px 16px;font-size:13.5px;
  color:var(--muted);line-height:1.7;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.05);}

/* 입력 */
.ft{flex:none;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;}
.ft textarea{flex:1;min-height:42px;max-height:120px;border:1px solid var(--line2);border-radius:21px;
  padding:11px 16px;font-size:15px;font-family:inherit;resize:none;outline:none;background:var(--bg);line-height:1.4;}
.ft textarea:focus{border-color:var(--ink);background:#fff;}
.ft .snd{flex:none;border:0;background:var(--ink);color:#fff;border-radius:21px;padding:0 18px;
  height:42px;font-size:14.5px;font-weight:700;cursor:pointer;}
.ft .snd:disabled{opacity:.35;}

/* 언어 선택 */
.langbtn{flex:none;border:1px solid var(--line2);background:#fff;color:#5a6270;font-size:12px;
  font-weight:600;padding:7px 11px;border-radius:20px;cursor:pointer;}
.langsheet{display:none;background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;
  gap:6px;flex-wrap:wrap;}
.langsheet.open{display:flex;}
.langsheet .lang{border:1px solid var(--line2);background:#fff;color:#5a6270;font-size:12.5px;
  font-weight:600;padding:7px 12px;border-radius:20px;cursor:pointer;}
.langsheet .lang.on{background:var(--ink);color:#fff;border-color:var(--ink);}
/* 개인정보 안내 */
.privacy{margin:18px 2px 6px;font-size:11.5px;color:var(--dim);line-height:1.75;}
/* (사용 안 함) */

/* ===== PC / 태블릿: 가운데 정렬된 카드 레이아웃 ===== */
@media (min-width:760px){
  body{background:#e9ebee;padding:26px 0;}
  .hd,.langsheet,.body,.ft{width:100%;max-width:560px;margin-left:auto;margin-right:auto;}
  .hd{position:static;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
      box-shadow:0 1px 3px rgba(16,24,40,.06);}
  .langsheet{border-left:1px solid var(--line);border-right:1px solid var(--line);}
  .body{background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);
        padding:20px 20px 10px;}
  .ft{border:1px solid var(--line);border-top:1px solid var(--line);border-radius:0 0 18px 18px;
      padding:12px 14px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
  .b{max-width:72%;}
}
/* 큰 화면에서도 지나치게 커지지 않게 */
@media (min-width:1200px){
  .hd,.langsheet,.body,.ft{max-width:600px;}
}

const TRC={ko:'KO',en:'EN',ja:'JA',zh:'ZH',de:'DE',fr:'FR',es:'ES'};
function detect(){const l=(navigator.language||'en').toLowerCase();for(const k of ['ko','ja','zh','de','fr','es'])if(l.startsWith(k))return k;return 'en';}
let LANG=detect(), INFO=null, convId=null, token=null, lastTs='1970-01-01', seen=new Set(), pollTimer=null;

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tok(){const k='sb_stay_'+KEY;let t=null;try{t=localStorage.getItem(k);if(!t){t='g'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,t);}}catch(e){t='g'+Math.random().toString(36).slice(2)+Date.now().toString(36);}return t;}
function fmt(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function atBottom(){const b=$('#body');return b.scrollHeight-b.scrollTop-b.clientHeight<130;}
function down(){const b=$('#body');b.scrollTop=b.scrollHeight;}

const LANGNAME={ko:'한국어',en:'English',ja:'日本語',zh:'中文',de:'Deutsch',fr:'Français',es:'Español'};

async function translate(text,target){
  try{
    const r=await fetch(TR_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY},body:JSON.stringify({text,target})});
    const j=await r.json(); if(j&&j.ok&&j.text) return j.text;
  }catch(e){}
  return null;
}
const trCache={};
async function maybeTranslate(bubble,text,fromGuest){
  const t=(text||'').trim(); if(t.length<2) return;
  const isKo=/[가-힣]/.test(t);
  let target=null;
  if(fromGuest){ if(!isKo) target='KO'; }            // 손님 외국어 → 한국어(호스트 확인용은 콘솔에서)
  else { if(isKo && LANG!=='ko') target=TRC[LANG]; } // 호스트 한국어 → 손님 언어
  if(!target) return;
  const ck=target+'|'+t; let out=trCache[ck];
  if(!out){ out=await translate(t,target); if(out) trCache[ck]=out; }
  if(!out || out.trim()===t) return;
  const s=document.createElement('span'); s.className='tr'; s.textContent=out;
  bubble.appendChild(s); if(atBottom()) down();
}

function addMsg(m){
  if(seen.has(m.id)) return; seen.add(m.id);
  const stick=atBottom();
  const isG=m.sender==='guest';
  const row=document.createElement('div'); row.className='row '+(isG?'g':'s');
  const b=document.createElement('div'); b.className='b'; b.textContent=m.body||'';
  const tm=document.createElement('span'); tm.className='time'; tm.textContent=fmt(m.created_at);
  if(isG){ row.appendChild(tm); row.appendChild(b); } else { row.appendChild(b); row.appendChild(tm); }
  $('#chat').appendChild(row);
  maybeTranslate(b, m.body, isG);
  if(m.created_at>lastTs) lastTs=m.created_at;
  if(stick) down();
}

async function poll(){
  if(!convId) return;
  try{
    const {data}=await db.rpc('chat_guest_fetch',{p_conv:convId,p_token:token,p_since:lastTs});
    (data||[]).forEach(addMsg);
  }catch(e){}
}
async function send(){
  const el=$('#inp'); const v=el.value.trim(); if(!v||!convId) return;
  el.value=''; el.style.height='auto'; $('#sendBtn').disabled=true;
  try{ await db.rpc('chat_guest_send',{p_conv:convId,p_token:token,p_body:v,p_image:null}); await poll(); }
  catch(e){ el.value=v; }
  $('#sendBtn').disabled=false; el.focus();
}
$('#sendBtn').addEventListener('click',send);
$('#inp').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(110,this.scrollHeight)+'px'; });
$('#inp').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });

async function start(){
  try{
    const {data,error}=await db.rpc('chat_open_by_key',{p_key:KEY,p_token:token,p_code:null});
    if(error) throw error;
    if(!data){ $('#welcome').textContent='잘못된 접속입니다. 객실 QR로 다시 시도해 주세요.'; return false; }
    convId=data;
    await poll();
    pollTimer=setInterval(poll,5000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });
    return true;
  }catch(e){ $('#welcome').textContent='연결에 실패했어요. 잠시 후 새로고침 해주세요.'; return false; }
}
