<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>숙소 안내</title>
<style>
:root{
  --bg:#f2f3f5;--card:#fff;--line:#ececef;--line2:#dfe1e5;
  --text:#17181c;--muted:#7b828d;--dim:#a9afb8;--ink:#17181c;
  --ok:#0f9d58;--okbg:#eaf7ef;--okline:#c9ead6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-size:15px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',Roboto,sans-serif;}

.hd{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.hd .lg{width:36px;height:36px;flex:none;border-radius:11px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;overflow:hidden;}
.hd .lg img{width:100%;height:100%;object-fit:contain;background:#fff;}
.hd .t{min-width:0;flex:1;}
.hd .t b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;}
.hd .t span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.badge{flex:none;font-size:11px;font-weight:700;border-radius:20px;padding:4px 10px;
  background:var(--okbg);color:var(--ok);border:1px solid var(--okline);}
.langbtn{flex:none;border:1px solid var(--line2);background:#fff;color:#5a6270;font-size:12px;
  font-weight:600;padding:7px 11px;border-radius:20px;cursor:pointer;}
.langsheet{display:none;background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;
  gap:6px;flex-wrap:wrap;position:sticky;top:65px;z-index:19;}
.langsheet.open{display:flex;}
.langsheet .lang{border:1px solid var(--line2);background:#fff;color:#5a6270;font-size:12.5px;
  font-weight:600;padding:7px 12px;border-radius:20px;cursor:pointer;}
.langsheet .lang.on{background:var(--ink);color:#fff;border-color:var(--ink);}

.wrap{padding:20px 16px 40px;}

.pill{width:100%;border:0;background:var(--ink);color:#fff;border-radius:999px;
  padding:20px 24px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 10px rgba(16,24,40,.10);}
.pill .pt{flex:1;min-width:0;}
.pill .pt b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;}
.pill .pt span{display:block;font-size:13px;color:rgba(255,255,255,.66);margin-top:4px;}
.pill .ar{flex:none;font-size:20px;color:rgba(255,255,255,.5);}

.sec{font-size:12px;font-weight:700;color:var(--muted);margin:26px 0 9px 4px;}
.list{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05);}
.r{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line);
  cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit;}
.r:last-child{border-bottom:0;}
.r:active{background:#f7f8f9;}
.r .rt{flex:1;min-width:0;}
.r .rt b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;}
.r .rt span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.r .ar{flex:none;font-size:17px;color:var(--dim);}
.r.lock .rt b{color:var(--dim);}
.r.ask{background:var(--okbg);}
.r.ask .rt b{color:#0b7a45;}
.r.ask .rt span{color:#3f9a72;}

.sheetbg{position:fixed;inset:0;background:rgba(16,20,26,.42);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40;}
.sheetbg.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);z-index:41;
  max-height:86vh;display:flex;flex-direction:column;}
.sheet.on{transform:translateY(0);}
.sheet .sh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.sheet .sh b{flex:1;font-size:17px;font-weight:700;letter-spacing:-.02em;}
.sheet .x{border:0;background:#f1f2f4;color:#5a6270;width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;flex:none;}
.sheet .sb{padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:15px;line-height:1.8;color:#3f4650;white-space:pre-wrap;flex:1;}
.sheet .sf{padding:0 18px calc(18px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--line2);background:#fff;color:#3f4650;border-radius:11px;
  padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;flex:1;}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);}
.big{font-size:26px;font-weight:700;letter-spacing:.12em;color:#0b7a45;
  font-variant-numeric:tabular-nums;background:var(--okbg);border-radius:12px;
  padding:14px 16px;text-align:center;margin-bottom:12px;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.kv:last-child{border-bottom:0;}
.kv .k{font-size:13px;color:var(--muted);}
.kv .v{font-size:15px;font-weight:600;text-align:right;}

.chat{display:flex;flex-direction:column;gap:9px;}
.crow{display:flex;align-items:flex-end;gap:7px;}
.crow.g{justify-content:flex-start;} .crow.s{justify-content:flex-end;}
.b{max-width:78%;padding:11px 14px;border-radius:17px;font-size:15px;line-height:1.55;
  word-break:break-word;white-space:pre-wrap;}
.crow.g .b{background:#f1f2f4;border-bottom-left-radius:6px;}
.crow.s .b{background:var(--ink);color:#fff;border-bottom-right-radius:6px;}
.b .tr{display:block;font-size:13px;margin-top:8px;padding-top:8px;
  border-top:1px dashed rgba(0,0,0,.12);color:#6b7280;}
.crow.s .b .tr{border-top-color:rgba(255,255,255,.2);color:#c9ced6;}
.time{font-size:10.5px;color:var(--dim);flex:none;padding-bottom:2px;}
.sys{background:#f7f8f9;border-radius:14px;padding:14px 16px;font-size:13.5px;
  color:var(--muted);line-height:1.7;text-align:center;}
.ft{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:flex-end;}
.ft textarea{flex:1;min-height:42px;max-height:110px;border:1px solid var(--line2);border-radius:21px;
  padding:11px 16px;font-size:15px;font-family:inherit;resize:none;outline:none;background:var(--bg);line-height:1.4;}
.ft textarea:focus{border-color:var(--ink);background:#fff;}
.ft .snd{flex:none;border:0;background:var(--ink);color:#fff;border-radius:21px;padding:0 18px;
  height:42px;font-size:14.5px;font-weight:700;cursor:pointer;}
.ft .snd:disabled{opacity:.35;}
.priv{margin:22px 4px 0;font-size:11.5px;color:var(--dim);line-height:1.75;}

@media (min-width:760px){
  body{background:#e9ebee;padding:26px 0;}
  .hd,.langsheet,.wrap{width:100%;max-width:560px;margin-left:auto;margin-right:auto;}
  .hd{position:static;border:1px solid var(--line);border-radius:18px 18px 0 0;}
  .langsheet{position:static;border-left:1px solid var(--line);border-right:1px solid var(--line);}
  .wrap{background:var(--bg);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;}
  .sheet{left:50%;transform:translate(-50%,100%);width:100%;max-width:560px;border-radius:20px 20px 0 0;}
  .sheet.on{transform:translate(-50%,0);}
}
</style></head>

function detect(){const l=(navigator.language||'en').toLowerCase();for(const k of ['ko','ja','zh','de','fr','es'])if(l.startsWith(k))return k;return 'en';}

/* ---------- 시트 ---------- */
function openSheet(el){ $('#bg').classList.add('on'); el.classList.add('on'); }
function closeAll(){ $('#bg').classList.remove('on'); $('#sheet').classList.remove('on'); $('#csheet').classList.remove('on'); }
$('#bg').addEventListener('click',closeAll);
$('#shX').addEventListener('click',closeAll);
$('#csX').addEventListener('click',closeAll);

function showDetail(title, bodyHtml, footHtml){
  $('#shT').textContent=title;
  $('#shB').innerHTML=bodyHtml;
  $('#shF').innerHTML=footHtml||'';
  bindCopy($('#sheet'));
  openSheet($('#sheet'));
}
function bindCopy(root){
  root.querySelectorAll('[data-cp]').forEach(b=>b.addEventListener('click',()=>{
    navigator.clipboard.writeText(b.dataset.cp).then(()=>{
      const o=b.textContent; b.textContent=(T[LANG]||T.en).copied;
      setTimeout(()=>b.textContent=o,1400);
    });
  }));
}

/* ---------- 목록 렌더 ---------- */
function row(id,title,sub,cls){
  return `<button class="r ${cls||''}" data-row="${id}">
    <span class="rt"><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}</span>
    <span class="ar">›</span></button>`;
}
function render(){
  const t=T[LANG]||T.en, i=INFO||{};
  $('#langBtn').textContent=LANGNAME[LANG]||'Language';
  document.querySelectorAll('.langsheet .lang').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  $('#secInfo').textContent=t.info; $('#secHelp').textContent=t.help;
  $('#pillT').textContent=t.guide;
  $('#pillS').textContent=`${t.ci} ${i.checkin_time||'16:00'} · ${t.co} ${i.checkout_time||'11:00'}`;
  $('#csT').textContent=t.ask; $('#inp').placeholder=t.inp; $('#sendBtn').textContent=t.send;
  $('#welcome').textContent=t.wel;
  $('#priv').innerHTML=t.priv.map(x=>'· '+esc(x)).join('<br>');

  let h='';
  if(i.directions) h+=row('way',t.way,t.waySub);
  if(i.address)    h+=row('addr',t.addr,i.address);
  if(i.staying){
    if(i.wifi_id) h+=row('wifi',t.wifi,i.wifi_id);
    if(i.door||i.entrance) h+=row('door',t.door,'••••');
  }else{
    h+=row('lock',t.wifi+' · '+t.door,t.locked,'lock');
  }
  if(i.notes) h+=row('notes',t.notes,'');
  if(i.rules) h+=row('rules',t.rules,'');
  if(i.nearby) h+=row('near',t.near,'');
  $('#listInfo').innerHTML=h||`<div style="padding:18px;color:var(--muted);font-size:14px;">—</div>`;
  $('#listHelp').innerHTML=row('ask',t.ask,t.askSub,'ask');

  $('#hBiz').textContent=i.biz||'숙소';
  $('#hRoom').textContent=(i.room||'')+(i.stay?'  ·  '+i.stay:'');
  $('#hLogo').innerHTML = i.logo_url ? '<img src="'+esc(i.logo_url)+'" alt=""/>' : esc((i.biz||'S').charAt(0));
  if(i.staying){ $('#hBadge').textContent=t.stay; $('#hBadge').style.display='inline-block'; }

  document.querySelectorAll('[data-row]').forEach(b=>b.addEventListener('click',()=>openRow(b.dataset.row)));
}

function openRow(id){
  const t=T[LANG]||T.en, i=INFO||{};
  if(id==='ask'){ openChat(); return; }
  if(id==='way')   return showDetail(t.way, esc(i.directions||''), '');
  if(id==='addr')  return showDetail(t.addr, esc(i.address||''),
      `<button class="btn" data-cp="${esc(i.address||'')}">${t.copy}</button>`+
      (i.map_url?`<button class="btn dark" onclick="window.open('${esc(i.map_url)}','_blank')">${t.map}</button>`:''));
  if(id==='wifi')  return showDetail(t.wifi,
      `<div class="kv"><span class="k">${t.wid}</span><span class="v">${esc(i.wifi_id||'-')}</span></div>`+
      `<div class="kv"><span class="k">${t.wpw}</span><span class="v">${esc(i.wifi_pw||'-')}</span></div>`,
      i.wifi_pw?`<button class="btn dark" data-cp="${esc(i.wifi_pw)}">${t.copy}</button>`:'');
  if(id==='door'){
    let b='';
    if(i.entrance) b+=`<div style="font-size:13px;color:var(--muted);margin-bottom:6px;">${t.ent}</div><div class="big">${esc(i.entrance)}</div>`;
    if(i.door)     b+=`<div style="font-size:13px;color:var(--muted);margin-bottom:6px;">${t.dl}</div><div class="big">${esc(i.door)}</div>`;
    return showDetail(t.door, b, '');
  }
  if(id==='lock')  return showDetail(t.locked, esc(t.lockedSub), '');
  if(id==='notes') return showDetail(t.notes, esc(i.notes||''), '');
  if(id==='rules') return showDetail(t.rules, esc(i.rules||''), '');
  if(id==='near')  return showDetail(t.near, esc(i.nearby||''), '');
}

/* ---------- 채팅 ---------- */
function atBottom(){const b=$('#csB');return b.scrollHeight-b.scrollTop-b.clientHeight<130;}
function down(){const b=$('#csB');b.scrollTop=b.scrollHeight;}
async function translate(text,target){
  try{
    const r=await fetch(TR_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY},body:JSON.stringify({text,target})});
    const j=await r.json(); if(j&&j.ok&&j.text) return j.text;
  }catch(e){}
  return null;
}
const trCache={};
async function maybeTranslate(bubble,text,fromGuest){
  const s=(text||'').trim(); if(s.length<2) return;
  const isKo=/[가-힣]/.test(s);
  let target=null;
  if(fromGuest){ if(!isKo) target='KO'; }
  else { if(isKo && LANG!=='ko') target=TRC[LANG]; }
  if(!target) return;
  const ck=target+'|'+s; let out=trCache[ck];
  if(!out){ out=await translate(s,target); if(out) trCache[ck]=out; }
  if(!out || out.trim()===s) return;
  const el=document.createElement('span'); el.className='tr'; el.textContent=out;
  bubble.appendChild(el); if(atBottom()) down();
}
function addMsg(m){
  if(seen.has(m.id)) return; seen.add(m.id);
  const stick=atBottom(), isG=m.sender==='guest';
  const r=document.createElement('div'); r.className='crow '+(isG?'g':'s');
  const b=document.createElement('div'); b.className='b'; b.textContent=m.body||'';
  const tm=document.createElement('span'); tm.className='time'; tm.textContent=fmt(m.created_at);
  if(isG){ r.appendChild(tm); r.appendChild(b); } else { r.appendChild(b); r.appendChild(tm); }
  $('#chat').appendChild(r);
  maybeTranslate(b,m.body,isG);
  if(m.created_at>lastTs) lastTs=m.created_at;
  if(stick) down();
}
async function poll(){
  if(!convId) return;
  try{ const {data}=await db.rpc('chat_guest_fetch',{p_conv:convId,p_token:token,p_since:lastTs}); (data||[]).forEach(addMsg); }catch(e){}
}
async function send(){
  const el=$('#inp'), v=el.value.trim(); if(!v) return;
  if(!convId){ const ok=await startChat(); if(!ok) return; }
  el.value=''; el.style.height='auto'; $('#sendBtn').disabled=true;
  try{ await db.rpc('chat_guest_send',{p_conv:convId,p_token:token,p_body:v,p_image:null}); await poll(); }
  catch(e){ el.value=v; }
  $('#sendBtn').disabled=false; el.focus();
}
$('#sendBtn').addEventListener('click',send);
$('#inp').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(110,this.scrollHeight)+'px'; });
$('#inp').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });

async function startChat(){
  try{
    const {data,error}=await db.rpc('chat_open_by_key',{p_key:KEY,p_token:token,p_code:null});
    if(error||!data){ $('#welcome').textContent='연결에 실패했어요. 잠시 후 다시 시도해 주세요.'; return false; }
    convId=data; await poll();
    if(!pollTimer){ pollTimer=setInterval(poll,5000);
      document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); }); }
    return true;
  }catch(e){ $('#welcome').textContent='연결에 실패했어요. 잠시 후 다시 시도해 주세요.'; return false; }
}
async function openChat(){
  openSheet($('#csheet'));
  if(!chatReady){ chatReady=true; await startChat(); down(); }
  setTimeout(()=>$('#inp').focus(),260);
}
