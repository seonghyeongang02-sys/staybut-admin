<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>숙소 안내 · 문의</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#e6e8ec;--line2:#d6dae0;--text:#1c2026;--muted:#6b7280;--dim:#a3a9b3;--ink:#16161b;--ok:#16a34a;--okbg:#e9f7ef;--danger:#e0485c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',Roboto,sans-serif;display:flex;flex-direction:column;}
/* 헤더 */
.hd{background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;flex:none;}
.hd .lg{width:30px;height:30px;flex:none;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;overflow:hidden;}
.hd .lg img{width:100%;height:100%;object-fit:contain;background:#fff;}
.hd .t{min-width:0;}
.hd .t b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em;}
.hd .t span{display:block;font-size:11px;color:var(--muted);margin-top:1px;}
.hd .badge{margin-left:auto;flex:none;font-size:10.5px;font-weight:800;border-radius:20px;padding:3px 9px;background:var(--okbg);color:#0f7a52;}
/* 본문 */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;}
.sec{font-size:11.5px;font-weight:800;color:var(--muted);margin:2px 0 8px;letter-spacing:.02em;}
.info{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
.ic{background:#fff;border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(20,30,50,.04);}
.ic .k{font-size:11.5px;color:var(--muted);}
.ic .v{font-size:13.5px;margin-top:2px;}
.ic.code{background:var(--okbg);}
.ic.code .k{color:#0f7a52;}
.ic.code .v{font-size:19px;font-weight:800;letter-spacing:.12em;color:#0b5c3d;font-variant-numeric:tabular-nums;}
.ic .lock{font-size:11.5px;color:var(--dim);}
.cp{border:1px solid #b7e3ca;background:#fff;color:#0f7a52;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;flex:none;}
.notes{background:#fff;border-radius:12px;padding:12px 13px;font-size:12.5px;color:var(--muted);line-height:1.7;box-shadow:0 1px 2px rgba(20,30,50,.04);margin-bottom:16px;white-space:pre-wrap;}
/* 대화 */
.chat{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:flex-end;gap:6px;}
.row.g{justify-content:flex-start;} .row.s{justify-content:flex-end;}
.b{max-width:80%;padding:9px 12px;border-radius:15px;font-size:14px;line-height:1.55;word-break:break-word;white-space:pre-wrap;}
.row.g .b{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;}
.row.s .b{background:var(--ink);color:#fff;border-bottom-right-radius:5px;}
.b .tr{display:block;font-size:12.5px;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.14);color:#5b6470;}
.row.s .b .tr{border-top-color:rgba(255,255,255,.22);color:#cfd3da;}
.time{font-size:10px;color:var(--dim);flex:none;}
.daydiv{text-align:center;font-size:11px;color:var(--dim);margin:6px 0;}
.sysmsg{text-align:center;font-size:12px;color:var(--muted);background:#fff;border-radius:12px;padding:11px 13px;line-height:1.6;}
/* 입력 */
.ft{flex:none;background:#fff;border-top:1px solid var(--line);padding:9px 11px calc(9px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:flex-end;}
.ft textarea{flex:1;min-height:38px;max-height:110px;border:1px solid var(--line2);border-radius:19px;padding:9px 14px;font-size:15px;font-family:inherit;resize:none;outline:none;background:var(--bg);line-height:1.4;}
.ft textarea:focus{border-color:var(--ink);background:#fff;}
.ft .snd{flex:none;border:0;background:var(--ink);color:#fff;border-radius:19px;padding:0 16px;height:38px;font-size:14px;font-weight:800;cursor:pointer;}
.ft .snd:disabled{opacity:.4;}
/* 동의 */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;}
#gate .card{background:#fff;border-radius:18px;padding:24px 20px;width:340px;max-width:94%;box-shadow:0 3px 14px rgba(20,30,50,.08);}
#gate h1{font-size:17px;font-weight:800;margin:0 0 4px;text-align:center;}
#gate .s{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.65;margin:0 0 16px;}
#gate .langs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
#gate .lang{border:1px solid var(--line2);background:#fff;color:#555;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;}
#gate .lang.on{background:var(--ink);color:#fff;border-color:var(--ink);}
#gate .box{background:var(--bg);border-radius:11px;padding:12px 13px;font-size:11.5px;color:var(--muted);line-height:1.8;margin-bottom:14px;}
#gate input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;background:var(--bg);margin-bottom:8px;text-align:center;letter-spacing:.1em;}
#gate input:focus{outline:none;border-color:var(--ink);background:#fff;}
#gate .go{width:100%;border:0;background:var(--ink);color:#fff;border-radius:11px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;}
#gate .err{color:var(--danger);font-size:12px;min-height:17px;margin-top:7px;text-align:center;}
#gate .codewrap{display:none;}
</style></head>
<body>

<div class="hd">
  <div class="lg" id="hLogo">S</div>
  <div class="t"><b id="hBiz">숙소</b><span id="hRoom"></span></div>
  <span class="badge" id="hBadge" style="display:none;">숙박중</span>
</div>

<div class="body" id="body">
  <div class="sec" id="secInfo">숙소 안내</div>
  <div class="info" id="info"></div>
  <div class="notes" id="notes" style="display:none;"></div>
  <div class="sec">문의</div>
  <div class="chat" id="chat">
    <div class="sysmsg" id="welcome">궁금하신 점을 남겨주세요. 확인 후 답변드립니다.</div>
  </div>
</div>

<div class="ft">
  <textarea id="inp" rows="1" placeholder="메시지 입력…"></textarea>
  <button class="snd" id="sendBtn">전송</button>
</div>

<div id="gate"><div class="card">
  <div class="langs" id="langs">
    <button class="lang on" data-l="ko">한국어</button>
    <button class="lang" data-l="en">EN</button>
    <button class="lang" data-l="ja">日本語</button>
    <button class="lang" data-l="zh">中文</button>
    <button class="lang" data-l="de">DE</button>
    <button class="lang" data-l="fr">FR</button>
    <button class="lang" data-l="es">ES</button>
  </div>
  <h1 id="gTitle">숙소 안내 · 문의</h1>
  <div class="s" id="gSub">궁금하신 점을 실시간으로 도와드려요.</div>
  <div class="box" id="gBox"></div>
  <div class="codewrap" id="codeWrap">
    <input id="gCode" inputmode="numeric" maxlength="6" placeholder="접속코드" />
  </div>
  <button class="go" id="gBtn">동의하고 시작</button>
  <div class="err" id="gErr"></div>
</div></div>

const T={
 ko:{title:'숙소 안내 · 문의',sub:'궁금하신 점을 실시간으로 도와드려요.',box:['상담 내용은 응대 목적으로만 사용됩니다.','이름·연락처 등 개인정보는 저장하지 않습니다.','대화는 약 90일 후 자동 삭제됩니다.'],btn:'동의하고 시작',inp:'메시지 입력…',code:'접속코드',codeErr:'접속코드가 올바르지 않아요.',wel:'궁금하신 점을 남겨주세요. 확인 후 답변드립니다.',info:'숙소 안내',ask:'문의',send:'전송',

 es:{title:'Información y ayuda',sub:'Le ayudamos en tiempo real.',box:['El chat se utiliza únicamente para ayudarle.','No guardamos datos personales.','Los mensajes se eliminan tras unos 90 días.'],btn:'Aceptar e iniciar',inp:'Escribir un mensaje…',code:'Código de acceso',codeErr:'El código de acceso no es correcto.',wel:'Pregúntenos lo que necesite. Responderemos pronto.',info:'Información',ask:'Contacto',send:'Enviar',
   ci:'Entrada',co:'Salida',ent:'Portal',door:'Cerradura',wifi:'Wi-Fi',locked:'Visible tras la entrada',copy:'Copiar',copied:'Copiado',stay:'Alojado'}
};
const TRC={ko:'KO',en:'EN',ja:'JA',zh:'ZH',de:'DE',fr:'FR',es:'ES'};
function detect(){const l=(navigator.language||'en').toLowerCase();for(const k of ['ko','ja','zh','de','fr','es'])if(l.startsWith(k))return k;return 'en';}
let LANG=detect(), INFO=null, convId=null, token=null, lastTs='1970-01-01', seen=new Set(), pollTimer=null, needCode=false;

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tok(){const k='sb_stay_'+KEY;let t=null;try{t=localStorage.getItem(k);if(!t){t='g'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,t);}}catch(e){t='g'+Math.random().toString(36).slice(2)+Date.now().toString(36);}return t;}
function fmt(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function atBottom(){const b=$('#body');return b.scrollHeight-b.scrollTop-b.clientHeight<130;}
function down(){const b=$('#body');b.scrollTop=b.scrollHeight;}

function applyLang(){
  const t=T[LANG]||T.en;
  $('#gTitle').textContent=t.title; $('#gSub').textContent=t.sub;
  $('#gBox').innerHTML=t.box.map(x=>'· '+esc(x)).join('<br>');
  $('#gBtn').textContent=t.btn; $('#gCode').placeholder=t.code;
  $('#inp').placeholder=t.inp; $('#sendBtn').textContent=t.send;
  $('#secInfo').textContent=t.info; $('#welcome').textContent=t.wel;
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  if(INFO) renderInfo();
}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.l;applyLang();}));

function renderInfo(){
  const t=T[LANG]||T.en, i=INFO, out=[];
  const row=(k,v,cls,copy)=>`<div class="ic ${cls||''}"><div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>${copy?`<button class="cp" data-cp="${esc(copy)}">${t.copy}</button>`:''}</div>`;
  out.push(row(t.ci+' / '+t.co, (i.checkin_time||'16:00')+' / '+(i.checkout_time||'11:00')));
  if(i.staying){
    if(i.entrance) out.push(row(t.ent, i.entrance, 'code', i.entrance));
    if(i.door)     out.push(row(t.door, i.door, 'code', i.door));
    if(i.wifi_id)  out.push(row(t.wifi, i.wifi_id+(i.wifi_pw?' / '+i.wifi_pw:''), '', i.wifi_pw||i.wifi_id));
  } else {
    out.push(`<div class="ic"><div><div class="k">${t.ent} · ${t.door} · ${t.wifi}</div><div class="v" style="color:var(--dim);font-size:12.5px;">${t.locked}</div></div><span class="lock">🔒</span></div>`);
  }
  $('#info').innerHTML=out.join('');
  $('#info').querySelectorAll('.cp').forEach(b=>b.addEventListener('click',()=>{
    navigator.clipboard.writeText(b.dataset.cp).then(()=>{const o=b.textContent;b.textContent=(T[LANG]||T.en).copied;setTimeout(()=>b.textContent=o,1400);});
  }));
  if(i.notes){ $('#notes').textContent=i.notes; $('#notes').style.display='block'; }
  $('#hBiz').textContent=i.biz||'숙소';
  $('#hRoom').textContent=(i.room||'')+(i.stay?' · '+i.stay:'');
  if(i.logo_url){ $('#hLogo').innerHTML='<img src="'+esc(i.logo_url)+'" alt=""/>'; }
  else { $('#hLogo').textContent=(i.biz||'S').charAt(0); }
  if(i.staying){ $('#hBadge').textContent=(T[LANG]||T.en).stay; $('#hBadge').style.display='inline-block'; }
}

async function translate(text,target){
  try{
    const r=await fetch(TR_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY},body:JSON.stringify({text,target})});
    const j=await r.json(); if(j&&j.ok&&j.text) return j.text;
  }catch(e){}
  return null;
}
const trCache={};
async function maybeTranslate(bubble,text,fromGuest){
  const t=(text||'').trim(); if(t.length<2) return;
  const isKo=/[가-힣]/.test(t);
  let target=null;
  if(fromGuest){ if(!isKo) target='KO'; }            // 손님 외국어 → 한국어(호스트 확인용은 콘솔에서)
  else { if(isKo && LANG!=='ko') target=TRC[LANG]; } // 호스트 한국어 → 손님 언어
  if(!target) return;
  const ck=target+'|'+t; let out=trCache[ck];
  if(!out){ out=await translate(t,target); if(out) trCache[ck]=out; }
  if(!out || out.trim()===t) return;
  const s=document.createElement('span'); s.className='tr'; s.textContent=out;
  bubble.appendChild(s); if(atBottom()) down();
}

function addMsg(m){
  if(seen.has(m.id)) return; seen.add(m.id);
  const stick=atBottom();
  const isG=m.sender==='guest';
  const row=document.createElement('div'); row.className='row '+(isG?'g':'s');
  const b=document.createElement('div'); b.className='b'; b.textContent=m.body||'';
  const tm=document.createElement('span'); tm.className='time'; tm.textContent=fmt(m.created_at);
  if(isG){ row.appendChild(tm); row.appendChild(b); } else { row.appendChild(b); row.appendChild(tm); }
  $('#chat').appendChild(row);
  maybeTranslate(b, m.body, isG);
  if(m.created_at>lastTs) lastTs=m.created_at;
  if(stick) down();
}

async function poll(){
  if(!convId) return;
  try{
    const {data}=await db.rpc('chat_guest_fetch',{p_conv:convId,p_token:token,p_since:lastTs});
    (data||[]).forEach(addMsg);
  }catch(e){}
}
async function send(){
  const el=$('#inp'); const v=el.value.trim(); if(!v||!convId) return;
  el.value=''; el.style.height='auto'; $('#sendBtn').disabled=true;
  try{ await db.rpc('chat_guest_send',{p_conv:convId,p_token:token,p_body:v,p_image:null}); await poll(); }
  catch(e){ el.value=v; }
  $('#sendBtn').disabled=false; el.focus();
}
$('#sendBtn').addEventListener('click',send);
$('#inp').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(110,this.scrollHeight)+'px'; });
$('#inp').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });

async function start(code){
  const t=T[LANG]||T.en;
  try{
    const {data,error}=await db.rpc('chat_open_by_key',{p_key:KEY,p_token:token,p_code:code||null});
    if(error){
      if(String(error.message||'').indexOf('bad_code')>=0){
        needCode=true; $('#codeWrap').style.display='block'; $('#gErr').textContent=t.codeErr;
        try{ localStorage.removeItem('sb_stay_code_'+KEY); }catch(e){}
        return false;
      }
      throw error;
    }
    if(!data){ $('#gErr').textContent='잘못된 접속입니다. 객실 QR로 다시 시도해 주세요.'; return false; }
    convId=data;
    try{ localStorage.setItem('sb_stay_ok_'+KEY,'1'); if(code) localStorage.setItem('sb_stay_code_'+KEY,code); }catch(e){}
    $('#gate').style.display='none';
    await poll();
    pollTimer=setInterval(poll,5000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });
    return true;
  }catch(e){ $('#gErr').textContent='연결에 실패했어요. 잠시 후 다시 시도해 주세요.'; return false; }
}

(async function(){
  applyLang();
  if(!KEY){ $('#gErr').textContent='잘못된 주소입니다. 객실 QR로 접속해 주세요.'; return; }
  token=tok();
  try{
    const {data}=await db.rpc('room_info_by_key',{p_key:KEY});
    if(data){ INFO=data; renderInfo(); }
  }catch(e){}
  $('#gBtn').addEventListener('click',()=>{ const c=$('#gCode').value.trim(); $('#gErr').textContent=''; start(c||null); });
  $('#gCode').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#gBtn').click(); });
  // 이미 동의한 기기는 자동 입장
  let ok=false, savedCode='';
  try{ ok=localStorage.getItem('sb_stay_ok_'+KEY)==='1'; savedCode=localStorage.getItem('sb_stay_code_'+KEY)||''; }catch(e){}
