<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>가입 신청 관리 · StayBUT 운영</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--line:#e5e5e7;--line2:#d2d2d7;--text:#1d1d1f;--muted:#6e6e73;--dim:#a1a1a6;--ink:#16161b;--ok:#16a34a;--danger:#e0485c;--amber:#a9700a;}
*{box-sizing:border-box;}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',Roboto,sans-serif;}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;}
#login .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:330px;max-width:90%;}
#login h1{font-size:18px;margin:0 0 14px;text-align:center;}
#login input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:14px;margin-bottom:9px;font-family:inherit;background:var(--bg);}
#login button{width:100%;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;}
#login .err{color:var(--danger);font-size:12px;min-height:16px;margin-top:6px;text-align:center;}
#app{display:none;}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 70px;}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.top .who{font-size:12px;color:var(--muted);} .top .who button{margin-left:8px;border:1px solid var(--line2);background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;}
h1.ph{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em;}
.ps{font-size:13px;color:var(--muted);margin:0 0 18px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.req{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,30,50,.04);}
.req .rh{display:flex;justify-content:space-between;align-items:center;}
.req .biz{font-size:16px;font-weight:800;}
.badge{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;}
.b-pending{background:#fdf3e3;color:var(--amber);} .b-approved{background:#e9f7ef;color:#0f7a52;} .b-rejected{background:#f2f2f4;color:#8a8a8e;}
.req .meta{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:8px;}
.req .meta b{color:var(--text);}
.acts{display:flex;gap:8px;margin-top:12px;}
.acts .ap{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}
.acts .rj{border:1px solid var(--line2);background:#fff;color:var(--danger);border-radius:8px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
.result{margin-top:10px;background:#f5f7fb;border:1px solid #dbe4f0;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.7;}
.result b{color:#1f3a66;} .result .lnk{word-break:break-all;color:#2f6fed;font-size:11.5px;}
.result .copy{margin-left:8px;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;}
.empty{padding:30px;text-align:center;color:var(--dim);font-size:13px;}
</style></head>
<body>
<div id="login"><div class="card">
  <h1>가입 신청 관리 · 운영자</h1>
  <input id="email" type="email" placeholder="이메일" autocomplete="username"/>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"/>
  <button id="loginBtn">로그인</button>
  <div class="err" id="loginErr"></div>
</div></div>
<div id="app"><div class="wrap">
  <div class="top"><div></div><div class="who"><span id="whoami"></span><button id="logoutBtn">로그아웃</button></div></div>
  <h1 class="ph">가입 신청 관리</h1>
  <div class="ps">신청을 승인하면 <b>계정·테넌트·객실이 자동 생성</b>되고 비밀번호 설정 링크가 나와요. 그 링크를 업체에 전달하세요.</div>
  <div class="tabs"><button class="tab on" data-f="pending">대기중</button><button class="tab" data-f="approved">승인됨</button><button class="tab" data-f="rejected">거절</button></div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const db=supabase.createClient('https://ijvfwajtotbqfxpdlcal.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqdmZ3YWp0b3RicWZ4cGRsY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODE1NDYsImV4cCI6MjA5NDA1NzU0Nn0.39TLrxZyfYthQggvef_RIQQ0YtR2DCu79KmEfEZwGZM');
const $=s=>document.querySelector(s);
let FILTER='pending';
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){ $('#login').style.display='flex'; $('#app').style.display='none'; return; }
  const {data:ok}=await db.rpc('is_console_staff');
  if(!ok){ await db.auth.signOut(); $('#loginErr').textContent='운영자 권한이 없는 계정입니다.'; $('#login').style.display='flex'; $('#app').style.display='none'; return; }
  $('#login').style.display='none'; $('#app').style.display='block';
  $('#whoami').textContent=(session.user.email||'').split('@')[0]; load();
}
$('#loginBtn').addEventListener('click',async()=>{
  const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pw').value});
  if(error){ $('#loginErr').textContent='로그인 실패'; return; } start();
});
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click();});
$('#logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();location.reload();});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');FILTER=t.dataset.f;load();}));

async function load(){
  const box=$('#list');
  const {data:reqs,error}=await db.from('signup_requests').select('*').eq('status',FILTER).order('created_at',{ascending:false});
  if(error){ box.innerHTML='<div class="empty">불러오지 못했어요: '+esc(error.message)+'</div>'; return; }
  if(!reqs||!reqs.length){ box.innerHTML='<div class="empty">해당 신청이 없어요.</div>'; return; }
  box.innerHTML=reqs.map(r=>{
    const badge=FILTER==='pending'?'<span class="badge b-pending">대기중</span>':FILTER==='approved'?'<span class="badge b-approved">승인됨</span>':'<span class="badge b-rejected">거절</span>';
    let extra='';
    if(r.status==='approved'&&r.setup_link){ extra='<div class="result"><b>계정·숙소 생성 완료.</b> 아래 링크를 업체에 보내 비밀번호를 설정하게 하세요:<br><span class="lnk">'+esc(r.setup_link)+'</span><button class="copy" onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent)">복사</button></div>'; }
    let acts='';
    if(r.status==='pending'){ acts='<div class="acts"><button class="ap" onclick="approve(\''+r.id+'\',this)">승인 → 자동 세팅</button><button class="rj" onclick="reject(\''+r.id+'\')">거절</button></div>'; }
    return '<div class="req"><div class="rh"><span class="biz">'+esc(r.biz_name)+'</span>'+badge+'</div>'+
      '<div class="meta"><b>'+esc(r.contact_email)+'</b>'+(r.contact_phone?' · '+esc(r.contact_phone):'')+
      (r.rooms?'<br>숙소: '+esc(r.rooms).replace(/\n/g,', '):'')+
      (r.channels?'<br>채널: '+esc(r.channels):'')+
      (r.memo?'<br>메모: '+esc(r.memo):'')+
      '<br><span style="color:var(--dim);">신청: '+esc((r.created_at||'').slice(0,10))+'</span></div>'+extra+acts+'</div>';
  }).join('');
}
async function approve(id,btn){
  if(!confirm('이 신청을 승인하고 계정·숙소를 자동 생성할까요?')) return;
  btn.disabled=true; btn.textContent='생성 중…';
  const {data,error}=await db.functions.invoke('provision-signup',{body:{request_id:id}});
  if(error||!data||!data.ok){ alert('승인 실패: '+((data&&data.error)||(error&&error.message)||'')); btn.disabled=false; btn.textContent='승인 → 자동 세팅'; return; }
  alert('완료! 테넌트가 생성됐어요. 목록에서 비밀번호 설정 링크를 복사해 업체에 보내세요.');
  document.querySelector('.tab[data-f="approved"]').click();
}
async function reject(id){
  if(!confirm('이 신청을 거절할까요?')) return;
  const {error}=await db.from('signup_requests').update({status:'rejected',reviewed_at:new Date().toISOString()}).eq('id',id);
  if(error){ alert('실패: '+error.message); return; } load();
}
start();
</script></body></html>
