<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>STAY BUT 청소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#111;--sub:#6b6b6b;--dim:#a3a3a3;--line:#ececec;--soft:#f6f6f6;--ok:#111;--accent:#111;--warn:#c2410c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;letter-spacing:-.01em}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{padding:22px 20px 8px}
.brand{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--dim)}
.who{font-size:22px;font-weight:700;margin-top:6px}
.wk{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.wk b{font-size:15px;font-weight:600}
.wk button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;color:var(--ink)}
.days{display:flex;gap:6px;padding:12px 20px 4px;overflow-x:auto}
.day{flex:0 0 auto;min-width:56px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;text-align:center;background:#fff;font-size:12px;color:var(--sub)}
.day b{display:block;font-size:16px;color:var(--ink);font-weight:600;margin-top:2px}
.day.on{background:var(--ink);border-color:var(--ink);color:#fff}.day.on b{color:#fff}
.day.today:not(.on){border-color:#bdbdbd}
.lbl{padding:18px 20px 6px;font-size:13px;color:var(--sub)}
.room{margin:0 20px;padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.room .n{font-size:20px;font-weight:700}.room .s{font-size:13px;color:var(--sub);margin-top:3px}
.room .r{text-align:right;font-size:13px;color:var(--sub)}
.room .r .done{color:var(--ink);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px}
.back{border:none;background:none;padding:0;font-size:14px;color:var(--sub);cursor:pointer}
.sup{display:flex;margin:14px 20px 0;border:1px solid var(--line);border-radius:12px}
.sup div{flex:1;text-align:center;padding:14px 0}.sup div+div{border-left:1px solid var(--line)}
.sup b{display:block;font-size:22px;font-weight:700}.sup span{font-size:12px;color:var(--sub)}
.memo{margin:12px 20px 0;padding:11px 13px;border-radius:10px;background:#fff5ef;color:var(--warn);font-size:14px;font-weight:600}
h3{margin:26px 20px 4px;font-size:15px;font-weight:700;display:flex;justify-content:space-between}
h3 span{font-weight:500;color:var(--sub);font-size:13px}
.it{margin:0 20px;padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:15px;cursor:pointer;user-select:none}
.cb{width:22px;height:22px;border:1.5px solid #cfcfcf;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.it.on .cb{background:var(--ink);border-color:var(--ink)}
.it.on .cb:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it.on .tx{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 20px 0}
.ph{position:relative;aspect-ratio:1/1;border:1px dashed #cfcfcf;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--sub);cursor:pointer;overflow:hidden;background:#fff}
.ph svg{width:20px;height:20px;stroke:#9a9a9a}
.ph.has{border:1px solid var(--line);color:#fff}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:5px;font-size:11px}
.ph .ck{position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
.ph .ck:after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ph.busy{opacity:.5}
.ph.okonly{background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.add{margin:8px 20px 0;width:calc(100% - 40px);padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--ink);font-family:inherit}
.hint{margin:8px 20px 0;font-size:12px;color:var(--dim)}
.cta{display:block;margin:26px 20px 10px;width:calc(100% - 40px);padding:16px;border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;font-family:inherit}
.sum{margin:14px 20px 0;display:flex;gap:8px}
.sum div{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px}
.sum span{font-size:12px;color:var(--sub)}.sum b{display:block;font-size:19px;font-weight:700;margin-top:4px}
.pay{margin:0 20px;padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px}
.pay .d{color:var(--sub);font-size:12px;margin-top:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:440px;margin:0 auto;display:flex}
nav button{flex:1;padding:15px 0;border:none;background:none;font-size:14px;color:var(--dim);font-family:inherit}
nav button.on{color:var(--ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.err{padding:80px 28px;text-align:center;color:var(--sub);line-height:1.7}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav id="nav" style="display:none"><div class="in"><button data-t="clean" class="on">청소</button><button data-t="pay">정산</button></div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
<script>
/* ── 설정 ─────────────────────────────────────────────── */
const SUPABASE_URL = 'https://ijvfwajtotbqfxpdlcal.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqdmZ3YWp0b3RicWZ4cGRsY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODE1NDYsImV4cCI6MjA5NDA1NzU0Nn0.39TLrxZyfYthQggvef_RIQQ0YtR2DCu79KmEfEZwGZM';   // 공개(anon) 키 — 브라우저에 노출돼도 되는 키
const PHOTO_FN = SUPABASE_URL + '/functions/v1/cleaner-photo';

/* 링크는 https://admin.staybut.kr/cleaner.html#t=토큰 형태.
   # 뒤 값은 서버 로그·다른 사이트로 넘어가지 않습니다. */
const TOKEN = (location.hash.match(/t=([0-9a-f]{32,})/) || [])[1] || '';
const DEMO = location.hash.includes('demo');

/* ── 문구 (미기 실장님은 영어) ─────────────────────────── */
const KO = {clean:'청소',pay:'정산',week:(m,w)=>`${m}월 ${w}주차`,today:'오늘',none:'이 주에는 배정된 청소가 없어요',
  rooms:n=>`청소 ${n}건`,next:'다음 손님',vacant:'기본세팅 (공실)',ppl:(g,n)=>`${g}명 · ${n}박`,done:'제출함',
  towel:'수건',water:'생수',bedding:'차렵이불',list:'체크리스트',photos:'사진',add:'+ 사진 추가 촬영',
  hint:'칸을 누르면 바로 카메라가 켜져요. 사진은 카톡으로 보내셔도 괜찮아요.',finish:'제출하기',
  reopen:'제출했어요 · 고칠 게 있으면 항목을 다시 눌러주세요',weekPay:'정산 금액',payAmt:'이번 주 정산 금액',
  cnt:n=>`${n}건`,saved:'제출했어요. 수고하셨습니다',uploaded:'사진을 올렸어요',fail:'저장하지 못했어요. 다시 눌러주세요',
  bad:'링크가 올바르지 않거나 만료되었어요.<br>관리자에게 새 링크를 요청해 주세요.',memo:'특이사항',
  items:{towel:n=>`수건 ${n}장 세팅`,water:n=>`생수 ${n}병 세팅`,bedding:n=>`차렵이불 ${n}채 추가`,bed:'침구 세팅 · 돌돌이',bath:'욕실 물기 · 배수구',laundry:'건조기 작동 (필터 청소)',trash:'외부 쓰레기장 정리'},
  slots:{before:'청소 전',towel:'수건',water:'생수',tissue:'화장지',fridge:'냉장고',bed:'침대',bath:'욕실',laundry:'세탁실',trash:'쓰레기장',extra:'추가'},
  dow:['일','월','화','수','목','금','토']};
const EN = {...KO,clean:'Cleaning',pay:'Payout',week:(m,w)=>`${['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]} week ${w}`,today:'Today',
  none:'No cleaning assigned this week',rooms:n=>`${n} room(s)`,next:'Next guests',vacant:'Default (vacant)',ppl:(g,n)=>`${g} ppl · ${n} night(s)`,done:'Done',
  towel:'Towels',water:'Water',bedding:'Duvet',list:'Checklist',photos:'Photos',add:'+ Take extra photo',
  hint:'Tap a box to open the camera. You can still send photos on KakaoTalk.',finish:'Submit',
  reopen:'Submitted · tap an item to edit',weekPay:'Payout',payAmt:'This week',cnt:n=>`${n}`,saved:'Saved',uploaded:'Photo uploaded',
  fail:'Could not save. Please try again',bad:'This link is invalid or expired.<br>Please ask for a new link.',memo:'Note',
  items:{towel:n=>`Towels × ${n}`,water:n=>`Water × ${n}`,bedding:n=>`Extra duvet × ${n}`,bed:'Bedding & lint roller',bath:'Bathroom dry · drain',laundry:'Dryer running (filter cleaned)',trash:'Outdoor trash area'},
  slots:{before:'Before',towel:'Towels',water:'Water',tissue:'Tissue',fridge:'Fridge',bed:'Bed',bath:'Bath',laundry:'Laundry',trash:'Trash',extra:'Extra'},dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
let L = KO;

/* ── 상태 ─────────────────────────────────────────────── */
const S = {tab:'clean', week:null, data:null, day:null, task:null, thumbs:{}, busy:{}};
const SLOTS = ['before','towel','water','tissue','fridge','bed','bath','laundry','trash'];

/* ── 날짜 도우미 ──────────────────────────────────────── */
const D = s => new Date(s+'T00:00:00');
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (s,n) => { const d=D(s); d.setDate(d.getDate()+n); return ymd(d); };
const md = s => { const d=D(s); return `${d.getMonth()+1}/${d.getDate()}`; };
function weekLabel(ws){ const thu=D(addDays(ws,3)); return L.week(thu.getMonth()+1, Math.ceil(thu.getDate()/7)); } // 어드민과 같은 기준 (그 주 목요일)

/* ── 비품 계산 (어드민 청소 카드와 같은 규칙) ─────────── */
const BASE = r => r==='301'?4 : r==='201'?3 : 2;
function supplies(t){
  if (t.next_guests && t.next_in === t.date){
    const g=t.next_guests, n=t.next_nights||1;
    return {basis:'next', guests:g, nights:n, towels:Math.min(Math.max(6,g*n*2),15), water:Math.max(2,g), bedding:Math.max(0,g-BASE(t.room))};
  }
  const fx = t.room==='301'?{g:4,t:8,w:4} : t.room==='201'?{g:3,t:6,w:3} : {g:2,t:6,w:2};
  return {basis:'default', guests:fx.g, nights:2, towels:fx.t, water:fx.w, bedding:0};
}
function items(t){
  const s=supplies(t), I=L.items, a=[['towel',I.towel(s.towels)],['water',I.water(s.water)]];
  if (s.bedding>0) a.push(['bedding',I.bedding(s.bedding)]);
  return a.concat([['bed',I.bed],['bath',I.bath],['laundry',I.laundry],['trash',I.trash]]);
}
const progress = t => { const it=items(t); return [it.filter(([k])=>t.checklist[k]).length, it.length]; };

/* ── 서버 통신 ────────────────────────────────────────── */
async function rpc(fn, body){
  if (DEMO) return demoRpc(fn, body);
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method:'POST',
    headers:{'content-type':'application/json', apikey:SUPABASE_KEY, authorization:'Bearer '+SUPABASE_KEY}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function load(week){
  S.data = await rpc('cleaner_week', {p_token:TOKEN, p_week_start:week});
  S.week = S.data.week_start;
  if ((S.data.staff_name||'').includes('미기')) L = EN;
  const days = [...new Set(S.data.tasks.map(t=>t.date))];
  S.day = days.includes(S.data.today) ? S.data.today : (days[0]||null);
  if (S.task) S.task = S.data.tasks.find(t=>t.id===S.task.id) || null;
}

/* ── 화면 ─────────────────────────────────────────────── */
const $app = document.getElementById('app');
const RN = r => (L===EN ? String(r) : r+'호');
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

function render(){
  document.querySelectorAll('nav button').forEach(b=>{ b.classList.toggle('on', b.dataset.t===S.tab); b.textContent=L[b.dataset.t]; });
  if (S.tab==='pay') return renderPay();
  if (S.task) return renderTask();
  const tasks = S.data.tasks, days=[...new Set(tasks.map(t=>t.date))];
  const list = tasks.filter(t=>t.date===S.day);
  $app.innerHTML = `
    <header><div class="brand">STAY BUT</div><div class="who">${esc(S.data.staff_name)}</div>
      <div class="wk"><button onclick="go(-7)" aria-label="prev">‹</button><b>${weekLabel(S.week)}</b><button onclick="go(7)" aria-label="next">›</button></div></header>
    ${days.length ? `<div class="days">${days.map(d=>{const x=D(d);return `<div class="day ${d===S.day?'on':''} ${d===S.data.today?'today':''}" onclick="S.day='${d}';render()">${d===S.data.today?L.today:L.dow[x.getDay()]}<b>${x.getDate()}</b></div>`}).join('')}</div>
      <div class="lbl">${md(S.day)} · ${L.rooms(list.length)}</div>
      ${list.map(t=>{const [c,n]=progress(t), s=supplies(t);return `<div class="room" onclick="openTask('${t.id}')">
        <div><div class="n">${esc(RN(t.room))}</div><div class="s">${s.basis==='next'?L.next+' '+L.ppl(s.guests,s.nights):L.vacant}</div></div>
        <div class="r">${t.done_at?`<span class="done">${L.done}</span>`:`${c} / ${n}`}</div></div>`}).join('')}`
    : `<div class="empty">${L.none}</div>`}`;
}

function renderTask(){
  const t=S.task, s=supplies(t), it=items(t), [c,n]=progress(t);
  const has = slot => (t.photos||[]).some(p=>p.slot===slot);
  const extras = (t.photos||[]).filter(p=>p.slot==='extra').length + (S.thumbs[t.id+':extra']||[]).length;
  $app.innerHTML = `
    <header><button class="back" onclick="S.task=null;render()">‹ ${md(t.date)}</button>
      <div class="who">${esc(RN(t.room))}</div>
      <div style="font-size:13px;color:var(--sub);margin-top:4px">${s.basis==='next'?L.next+' '+L.ppl(s.guests,s.nights):L.vacant}</div></header>
    <div class="sup"><div><b>${s.towels}</b><span>${L.towel}</span></div><div><b>${s.water}</b><span>${L.water}</span></div>${s.bedding?`<div><b>${s.bedding}</b><span>${L.bedding}</span></div>`:''}</div>
    ${t.memo?`<div class="memo">${L.memo} · ${esc(t.memo)}</div>`:''}
    <h3>${L.list}<span>${c} / ${n}</span></h3>
    ${it.map(([k,label])=>`<div class="it ${t.checklist[k]?'on':''}" onclick="toggle('${k}')"><div class="cb"></div><div class="tx">${esc(label)}</div></div>`).join('')}
    <h3>${L.photos}<span>${SLOTS.filter(has).length} / ${SLOTS.length}${extras?` · +${extras}`:''}</span></h3>
    <div class="grid">${SLOTS.map(sl=>{
      const th=S.thumbs[t.id+':'+sl], busy=S.busy[t.id+':'+sl];
      if (th) return `<div class="ph has ${busy?'busy':''}" onclick="shoot('${sl}')"><img src="${th}"><span class="tag">${L.slots[sl]}</span>${busy?'':'<span class="ck"></span>'}</div>`;
      if (has(sl)) return `<div class="ph okonly" onclick="shoot('${sl}')"><span class="ck"></span>${L.slots[sl]}</div>`;
      return `<div class="ph" onclick="shoot('${sl}')">${CAM}${L.slots[sl]}</div>`;
    }).join('')}</div>
    <button class="add" onclick="shoot('extra')">${L.add}</button>
    <div class="hint">${L.hint}</div>
    ${t.done_at ? `<div class="hint" style="text-align:center;margin-top:24px">${L.reopen}</div>`
      : `<button class="cta" onclick="finish()">${L.finish}</button>`}`;
}

function renderPay(){
  const tasks=S.data.tasks, sum=tasks.reduce((x,t)=>x+(t.fee||0),0), won=v=>'₩'+v.toLocaleString();
  $app.innerHTML = `
    <header><div class="brand">STAY BUT</div><div class="who">${L.weekPay}</div>
      <div class="wk"><button onclick="go(-7)">‹</button><b>${weekLabel(S.week)}</b><button onclick="go(7)">›</button></div></header>
    <div class="sum"><div><span>${L.payAmt} · ${L.cnt(tasks.length)}</span><b>${won(sum)}</b></div></div>
    ${tasks.length?tasks.map(t=>`<div class="pay"><div>${esc(RN(t.room))}<div class="d">${md(t.date)} (${L.dow[D(t.date).getDay()]})</div></div>
      <div>${won(t.fee||0)}</div></div>`).join('')
      :`<div class="empty">${L.none}</div>`}`;
}

/* ── 동작 ─────────────────────────────────────────────── */
async function go(n){ S.task=null; await load(addDays(S.week,n)); render(); }
function openTask(id){ S.task=S.data.tasks.find(t=>t.id===id); render(); window.scrollTo(0,0); }
let saveT;
function toggle(k){
  const t=S.task; t.checklist={...t.checklist,[k]:!t.checklist[k]};
  if (!t.checklist[k]) delete t.checklist[k];
  const wasDone=!!t.done_at; if (wasDone) t.done_at=null;
  render(); clearTimeout(saveT);
  saveT=setTimeout(async()=>{ try{ await rpc('cleaner_save_check',{p_token:TOKEN,p_task_id:t.id,p_checklist:t.checklist,p_done:false}); }catch(e){ toast(L.fail); } }, wasDone?0:500);
}
async function finish(){
  const t=S.task;
  try{ await rpc('cleaner_save_check',{p_token:TOKEN,p_task_id:t.id,p_checklist:t.checklist,p_done:true}); t.done_at=new Date().toISOString(); toast(L.saved); S.task=null; render(); }
  catch(e){ toast(L.fail); }
}
let shootSlot=null;
function shoot(slot){ shootSlot=slot; const c=document.getElementById('cam'); c.value=''; c.click(); }
document.getElementById('cam').addEventListener('change', async e=>{
  const f=e.target.files[0], t=S.task, slot=shootSlot; if(!f||!t) return;
  const blob=await shrink(f), url=URL.createObjectURL(blob), key=t.id+':'+slot;
  if (slot==='extra'){ (S.thumbs[key]=S.thumbs[key]||[]).push(url); } else { S.thumbs[key]=url; }
  S.busy[key]=true; render();
  try{
    if (!DEMO){
      const fd=new FormData(); fd.append('token',TOKEN); fd.append('task_id',t.id); fd.append('slot',slot); fd.append('file',blob,'photo.jpg');
      const r=await fetch(PHOTO_FN,{method:'POST',headers:{apikey:SUPABASE_KEY,authorization:'Bearer '+SUPABASE_KEY},body:fd});
      if(!r.ok) throw new Error(await r.text());
    }
    (t.photos=t.photos||[]).push({slot}); toast(L.uploaded);
  }catch(err){ if(slot!=='extra') delete S.thumbs[key]; else S.thumbs[key].pop(); toast(L.fail); }
  S.busy[key]=false; render();
});
/* 올리기 전에 긴 변 1600px JPEG로 줄입니다 (데이터·저장공간 절약) */
function shrink(file){ return new Promise(res=>{ const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{ let w=img.width,h=img.height,m=1600; if(Math.max(w,h)>m){ const k=m/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(b=>{ URL.revokeObjectURL(u); res(b||file); },'image/jpeg',0.82); };
  img.onerror=()=>res(file); img.src=u; }); }
