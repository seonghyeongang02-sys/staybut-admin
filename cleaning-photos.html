<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>STAY BUT · 청소 사진·링크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){ var v; try{ v=localStorage.getItem('staybut.theme'); }catch(e){}
  if(v==='system'){ v=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
  if(v!=='dark') v='light'; document.documentElement.setAttribute('data-theme',v); })();
</script>
<style>
  :root{ --bg:#fff; --soft:#fafaf9; --chat:#f5f4f2; --line:#e8e6e1; --line2:#d6d3cd; --text:#1a1815; --soft-text:#57534c; --muted:#78736b; --ink:#1f1f23; --ink2:#161619; --booking:#1B4480; --danger:#b85c3f; --ok:#3a7030;
    /* [2026-09-18] 사이드바 — 어드민과 같은 값 */
    --sidebar:#f7f6f3; --sidebar-line:#e8e6e1; --sidebar-fg:#1a1815; --sidebar-fg-dim:#3f3c36;
    --sidebar-fg-faint:#a8a39a; --sidebar-hover:#eeece8; --sidebar-active-bg:#e2e0da; --sidebar-active-fg:#1a1815;
  }
  /* [2026-09-18] 다크 — 어드민과 같은 값입니다.
     --ink 는 상단바 색이라 다크에서는 본문보다 한 단 어둡게 둡니다. */
  html[data-theme="dark"]{
    --bg:#1c1c22; --soft:#16161b; --chat:#1a1a20; --line:#2a2a30; --line2:#3a3a42;
    --text:#fafaf9; --soft-text:#c9c9d0; --muted:#8a8a92; --ink:#0f0f13; --ink2:#0a0a0d;
    --booking:#8fbde8; --danger:#e08a6a; --ok:#7fc06c;
    --sidebar:#0f0f13; --sidebar-line:#26262c; --sidebar-fg:#fafaf9; --sidebar-fg-dim:#c9c9d0;
    --sidebar-fg-faint:#7a7a82; --sidebar-hover:#22222a; --sidebar-active-bg:#2a2a30; --sidebar-active-fg:#fafaf9;
    color-scheme:dark;
  }
  .sidebar .nav-item[data-view="audit"], .sidebar .nav-item[data-view="import"] { display:none !important; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; letter-spacing:-.01em; }
  .wmk{ font-family:'Archivo',-apple-system,sans-serif; font-weight:700; letter-spacing:-.012em; white-space:nowrap; display:inline-flex; align-items:baseline; line-height:1; }
  #app{ display:flex; min-height:100vh; }
  .sidebar .wmk{ color:var(--sidebar-fg); font-size:19px; font-weight:800; }
  .sidebar .wmk-sub{ color:var(--sidebar-fg-faint); }
  .sidebar .sidebar-brand{ color:var(--sidebar-fg); border-bottom-color:var(--sidebar-line); }
  .wrap{ flex:1; min-width:0; height:100vh; overflow:auto; }
/* ══ [2026-08-24] 사이드바 — index.html 과 완전 동일 ══════════════════
   index.html 은 --radius/--transition 등 자체 변수를 씁니다.
   console.html 에는 그 변수가 없으므로 같은 결과가 나오는 실제 값으로 적었습니다. */
  /* [2026-09-18] 어드민과 같은 값으로 맞춥니다.
     사이드바 색·글씨 크기·여백이 어드민과 달라서, 상담을 누르면
     탭이 아래로 쏠려 보이고 화면이 바뀐 느낌이 났습니다. */
  .sidebar {
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-line);
    padding: 18px 11px;
    display: flex;
    flex-direction: column;
    width: 212px;
    flex: none;
    height: 100vh;
    overflow: auto;
  }
  .sidebar::-webkit-scrollbar { width: 0; }

  .sidebar-brand {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; color: #fff;
    padding: 0 6px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 14px;
  }
  .sidebar-brand-left { display: flex; align-items: baseline; min-width: 0; }
  .wmk { font-size: 19px; font-weight: 800; letter-spacing: .01em; color: #fff; white-space: nowrap; }
  .wmk .sp { display: inline-block; width: .26em; }
  .wmk .cjk { font-family: 'Pretendard','Apple SD Gothic Neo',sans-serif; font-weight: 500; margin-left: -.055em; }
  .wmk-sub { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.45); letter-spacing: 0; margin-left: 7px; }

  /* [2026-09-18] 어드민과 같은 크기 — 글자 15px · 위아래 12px */
  .sidebar .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 12px 13px;
    border-radius: 10px;
    color: var(--sidebar-fg-dim);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
    margin-bottom: 3px;
    user-select: none;
    letter-spacing: -0.005em;
    text-decoration: none;
  }
  .sidebar .nav-item span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-fg); }
  /* 선택 표시도 어드민과 같이 — 노란 칠(#FAEEC4) 대신 한 톤 진한 배경 */
  .sidebar .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-fg); font-weight: 700; }

  .nav-ico { flex: none; width: 20px; height: 20px; opacity: .92; }
  .nl-short { display: none; }   /* PC 는 긴 라벨 · 폰에서만 짧은 라벨 [2026-09-03] */
  .nav-item.active .nav-ico { opacity: 1; }

  .nav-badge {
    margin-left: auto; min-width: 20px; text-align: center;
    font-size: 9.5px; font-weight: 800;
    background: #b85c3f; color: #fff;
    border-radius: 9px; padding: 1px 6px;
  }
  .nav-item.active .nav-badge { background: var(--danger); color: #fff; }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--sidebar-line);
  }
  .user-info {
    padding: 10px 12px; font-size: 12px;
    color: var(--sidebar-fg-dim);
    margin-bottom: 6px; line-height: 1.5;
  }
  .sb-ico {
    background: transparent; border: 0; color: rgba(255,255,255,.55);
    cursor: pointer; padding: 4px; border-radius: 7px;
    display: grid; place-items: center;
  }
  .sb-ico:hover { background: rgba(255,255,255,.10); color: #fff; }
  #logoutBtn {
    margin-top: 6px; border: 1px solid rgba(255,255,255,.18);
    background: transparent; color: rgba(255,255,255,.78);
    font-size: 12px; letter-spacing: .04em;
  }
  #logoutBtn:hover { background: rgba(255,255,255,.08); color: #fff; }

/* ── 폰: 사이드바를 하단 고정 탭바로 (index.html 6,516행과 동일) [2026-08-24] ── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed; bottom: 0; left: 0; right: 0; top: auto;
    width: auto !important; height: auto !important;
    border-right: none;
    border-top: 1px solid #e8e6e1;   /* [2026-08-28] 어드민과 같은 선 색 */
    z-index: 50;
  }
  /* 채팅 영역이 탭바에 가리지 않게 */
  .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom)) !important; }
}

/* ── 폰 하단 탭바 : index.html 과 동일 규칙 [2026-08-24] ── */
      /* ══════════════════════════════════════════════════════════════════
       📱 하단 탭바 — 최종 규칙 (스타일시트 맨 끝. 앞의 규칙들을 덮어씁니다)
       · 앞쪽 1,488줄과 6,900줄대에 흩어진 규칙이 서로 덮어써서 안 먹던 문제를 정리
       · 하단 탭바는 768px 부터 시작하므로 브레이크포인트를 768px 로 맞춤
       ══════════════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {

      /* 탭바에 넣지 않는 것들 — 검색은 모바일에서 쓰지 않습니다 */
      .sidebar .sidebar-brand,
      .sidebar .nav-section-label,
      .sidebar .sidebar-search,
      .sidebar .user-info,
      .sidebar #user-info,
      .sidebar .nav-badge,
      .sidebar #quick-search-results { display: none !important; }

      .sidebar {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        overflow: visible !important;         /* 클립되면 탭이 안 눌립니다 */
        align-items: stretch !important;
        justify-content: flex-start !important;
        gap: 5px !important;
        padding: 7px 7px calc(7px + env(safe-area-inset-bottom)) !important;
        /* [2026-09-18] 폰 탭바는 본문과 구분돼야 하므로 한 톤 눌린 면을 씁니다.
           PC 사이드바 색(--sidebar) 을 그대로 쓰면 본문과 붙어 보입니다. */
        background: var(--soft) !important;
        border-top: 1px solid var(--line) !important;
        border-right: 0 !important;
      }

      /* 로그아웃을 탭바 직속 자녀로 끌어올림 (원래는 .sidebar-footer 안에 중첩) */
      .sidebar .sidebar-footer {
        display: contents !important;
        padding: 0 !important; margin: 0 !important;
        background: transparent !important; border: 0 !important; box-shadow: none !important;
      }

      /* 탭 5개 — 균등 분할 */
      .sidebar .nav-item[data-view] {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 4px !important;
        text-align: center !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        letter-spacing: -0.02em !important;
        line-height: 1.15 !important;
        padding: 9px 2px !important;
        margin: 0 !important;
        /* [2026-08-28] 어드민과 같은 색을 직접 적어뒀었습니다. */
        /* [2026-09-18] 이제 이 파일에도 테마 토큰이 있으니 토큰으로 바꿉니다.
           고정색이라 다크로 바꿔도 흰 탭이 그대로 남아 있었습니다. */
        border: 1px solid var(--line) !important;
        border-radius: 11px !important;
        background: var(--bg) !important;
        color: var(--text) !important;
      }
      /* [2026-09-03] 아이콘 위 · 글자 아래 — 어드민(index.html)과 같은 모양 */
      .sidebar .nav-item[data-view] .nav-ico {
        display: block !important;
        width: 21px !important;
        height: 21px !important;
        opacity: 1 !important;
      }
      /* 긴 라벨은 아이콘과 함께 두면 잘립니다 → 짧은 라벨로 바꿉니다 */
      .sidebar .nav-item[data-view] .nl-full  { display: none !important; }
      .sidebar .nav-item[data-view] .nl-short { display: inline !important; }

      /* 선택된 탭 — 어드민과 같이 글자색/배경을 뒤집습니다 (다크에서도 보이게) */
      .sidebar .nav-item[data-view].active {
        background: var(--text) !important;
        color: var(--bg) !important;
        border-color: var(--text) !important;
      }

      /* 로그아웃 — 아이콘만. 탭 자리를 뺏지 않게 고정 폭 */
      .sidebar #logoutBtn {
        flex: 0 0 36px !important;
        width: 36px !important; min-width: 36px !important;
        padding: 0 !important;
        margin: 0 !important;
        font-size: 0 !important;              /* '로그아웃' 글자 숨김 */
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border: 1px solid var(--line) !important;
        border-radius: 11px !important;
        background: var(--bg) !important;
        color: var(--muted) !important;
      }
      .sidebar #logoutBtn::before {
        content: '\21AA';                     /* ↪ */
        font-size: 17px; line-height: 1;
      }

      /* 탭바에 가려지지 않게 본문 아래 여백 */
      .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom)) !important; }

      /* ── [2026-08-27] 폰 탭은 운영·예약·매출·청소·상담 5개만 ──────────────
         어드민(index.html)과 똑같이 맞춥니다. 오갈 때 탭 줄이 달라지면
         다른 화면처럼 느껴져서 흐름이 끊깁니다.
         이 규칙은 반드시 맨 뒤 — 위쪽에 nav-item[data-view] 전체를
         display flex 로 켜는 규칙이 있어 특정도가 같으면 뒤엣것이 이깁니다. */
      .sidebar .nav-item[data-view="supplies"],
      .sidebar .nav-item[data-view="audit"],
      .sidebar .nav-item[data-view="import"],
      .sidebar .nav-item[data-view="payout"] { display: none !important; }

      /* [2026-08-28] 하단 탭에서 로그아웃을 뺍니다 — 오른쪽 위로 옮겼습니다.
         탭 5개가 폭을 온전히 나눠 쓰게 됩니다. 어드민과 같습니다. */
      .sidebar #logoutBtn,
      .sidebar .sidebar-footer { display: none !important; }
    }

    /* [2026-08-28] 가로 모드 — 어드민과 같은 값 */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      .sidebar { padding: 4px !important;
                 padding-bottom: calc(4px + env(safe-area-inset-bottom)) !important; }
      .nav-item { font-size: 10px !important; padding: 6px 4px !important; }
    }

    /* 아주 좁은 폰 (아이폰 SE 등 ~375px) — 탭 5개가 다 들어가도록 */
    @media (max-width: 380px) {
      .sidebar { gap: 4px !important; padding-left: 5px !important; padding-right: 5px !important; }
      .sidebar .nav-item[data-view] { font-size: 10px !important; padding: 8px 1px !important; }
}


  .sidebar #logoutBtn{ color:var(--sidebar-fg-dim); border:1px solid var(--sidebar-line); background:transparent; font-family:inherit; }
  .sidebar #logoutBtn:hover{ background:var(--sidebar-hover); color:var(--sidebar-fg); }
  /* ── 본문 (PC 기준 크게, 폰에서 줄임) ── */
  .page{ max-width:1080px; margin:0 auto; padding:34px 40px 60px; }
  .ttl{ font-size:26px; font-weight:800; margin:0 0 18px; }
  .tabs{ display:flex; gap:22px; border-bottom:1px solid var(--line); margin-bottom:20px; }
  .tabs button{ border:none; background:none; padding:12px 0; font-size:16px; color:var(--muted); font-family:inherit; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button.on{ color:var(--text); font-weight:700; border-color:var(--text); }
  .bar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; font-size:15px; }
  .bar input{ border:1px solid var(--line2); border-radius:9px; padding:9px 11px; font-family:inherit; font-size:15px; background:var(--bg); color:var(--text); }
  .btn{ border:1px solid var(--text); background:var(--text); color:var(--bg); border-radius:9px; padding:9px 16px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  .btn.ghost{ background:var(--bg); color:var(--text); border-color:var(--line2); }
  .note{ font-size:14px; color:var(--soft-text); line-height:1.65; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .sub{ font-size:14px; color:var(--muted); margin-top:6px; }
  .day{ margin-top:34px; }
  .day h2{ font-size:19px; margin:0 0 6px; display:flex; gap:12px; align-items:baseline; }
  .day h2 span{ font-size:14px; color:var(--muted); font-weight:500; }
  .task{ border-top:1px solid var(--line); padding:18px 0; }
  .th{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .th b{ font-size:20px; } .th .who{ font-size:15px; color:var(--soft-text); margin-left:10px; }
  .st{ font-size:14px; color:var(--muted); } .st.ok{ color:var(--text); font-weight:700; } .st.no{ color:var(--danger); }
  .miss{ font-size:14px; color:var(--danger); margin-top:8px; }
  .req{ font-size:14px; margin-top:6px; color:var(--text); font-weight:600; }
  .memo{ font-size:14px; color:var(--soft-text); margin-top:6px; }
  .ph{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:14px; }
  .ph figure{ margin:0; position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:var(--soft); cursor:zoom-in; }
  .ph img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ph figcaption{ position:absolute; left:7px; bottom:7px; background:rgba(0,0,0,.62); color:#fff; font-size:12px; padding:3px 7px; border-radius:6px; }
  .none{ font-size:14px; color:var(--muted); margin-top:8px; }
  .empty{ padding:60px 0; text-align:center; color:var(--muted); font-size:15px; }
  .row{ display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-top:1px solid var(--line); gap:12px; flex-wrap:wrap; font-size:16px; }
  .row .meta{ font-size:14px; color:var(--muted); margin-top:3px; }
  .link{ margin-top:8px; display:flex; gap:6px; width:100%; }
  .link input{ flex:1; border:1px solid var(--line2); border-radius:9px; padding:9px 11px; font-size:14px; font-family:ui-monospace,monospace; background:var(--bg); color:var(--text); }
  #login{ position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:100; }
  #login .box{ width:320px; display:flex; flex-direction:column; gap:10px; }
  #login input{ border:1px solid var(--line2); border-radius:9px; padding:12px; font-size:15px; font-family:inherit; background:var(--bg); color:var(--text); }
  #lb{ position:fixed; inset:0; background:rgba(0,0,0,.86); display:none; align-items:center; justify-content:center; z-index:200; cursor:zoom-out; }
  #lb img{ max-width:94vw; max-height:92vh; }
  @media (max-width:768px){
    .wrap{ height:auto; }
    .page{ padding:22px 18px 110px; }
    .ttl{ font-size:22px; }
    .ph{ grid-template-columns:repeat(3,1fr); gap:6px; }
    .th b{ font-size:18px; }
  }
</style>
</head>
<body>
<div id="login"><div class="box"><span class="wmk" style="font-size:20px">STAY BUT</span><div style="font-size:15px;color:var(--muted)">직원 로그인</div>
  <input id="em" type="email" placeholder="이메일" autocomplete="username"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="btn" onclick="login()">로그인</button><div class="none" id="lerr"></div></div></div>
<div id="app">
  <aside class="sidebar" id="sbar">
        <div class="sidebar-brand">
          <div class="sidebar-brand-left">
            <span class="wmk">STAY<span class="sp"></span>BUT<span class="cjk">友</span></span>
            <span class="wmk-sub">admin</span>
          </div>
        </div>

        <nav id="gnbNav" style="display:contents;">

  <div class="wrap"><div class="page" id="content"></div></div>
</div>
<div id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>
<script>
const SUPABASE_URL='https://ijvfwajtotbqfxpdlcal.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqdmZ3YWp0b3RicWZ4cGRsY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODE1NDYsImV4cCI6MjA5NDA1NzU0Nn0.39TLrxZyfYthQggvef_RIQQ0YtR2DCu79KmEfEZwGZM';
const CLEANER_URL='https://admin.staybut.kr/cleaner.html#t=';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);   // 어드민과 같은 주소라 어드민 로그인 상태를 그대로 씁니다

const SLOT={before:'청소 전',towel:'수건',water:'생수',tissue:'화장지',fridge:'냉장고',bed:'침대',bath:'욕실',laundry:'세탁실',trash:'쓰레기장',extra:'추가',supply:'비품'};
const ITEM={towel:'수건',water:'생수',bedding:'차렵이불',bed:'침구',bath:'욕실',laundry:'건조기',trash:'쓰레기장'};
const BASE_ITEMS=['towel','water','bed','bath','laundry','trash'];
const DOW=['일','월','화','수','목','금','토'];
const $=s=>document.querySelector(s), app=$('#content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const S={tab:'photos',from:addD(ymd(new Date()),-6),to:ymd(new Date()),staff:''};

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session) return showLogin();
  render();
}
function showLogin(msg){ $('#login').style.display='flex'; $('#lerr').textContent=msg||'어드민과 같은 계정으로 로그인해 주세요.'; }
async function login(){
  const {error}=await db.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
  if(error) return showLogin('로그인에 실패했어요.'); $('#login').style.display='none'; render();
}
function shell(inner){
  app.innerHTML=`<div class="ttl">청소 사진 · 실장님 링크</div>
    <div class="tabs"><button class="${S.tab==='photos'?'on':''}" onclick="S.tab='photos';render()">사진 확인</button><button class="${S.tab==='links'?'on':''}" onclick="S.tab='links';render()">실장님 링크</button></div>${inner}`;
}
function render(){ S.tab==='photos'?renderPhotos():renderLinks(); }

/* ── 사진 확인 ─────────────────────────────────────────── */
async function renderPhotos(){
  shell(`<div class="bar"><input type="date" id="f" value="${S.from}"> ~ <input type="date" id="t" value="${S.to}">
    <button class="btn" onclick="S.from=$('#f').value;S.to=$('#t').value;renderPhotos()">조회</button>
    <button class="btn ghost" onclick="S.from=addD(ymd(new Date()),-6);S.to=ymd(new Date());renderPhotos()">최근 7일</button></div>
    <div class="none">사진은 30일이 지나면 자동으로 지워집니다.</div><div id="list"><div class="empty">불러오는 중…</div></div>`);
  const {data,error}=await db.from('cleaning_tasks')
    .select('id,scheduled_date,status,memo,checklist,checklist_done_at,check_photos,rooms(room_number),staff:staff!cleaning_tasks_assigned_to_fkey(name),cleaning_issues(description,category,created_at)')
    .gte('scheduled_date',S.from).lte('scheduled_date',S.to).order('scheduled_date',{ascending:false});
  if(error){ $('#list').innerHTML=`<div class="empty">불러오지 못했어요. (${esc(error.message)})</div>`; return; }
  const tasks=(data||[]).filter(t=>t.status!=='not_needed');
  const paths=tasks.flatMap(t=>(t.check_photos||[]).map(p=>p.path)).filter(Boolean);
  const urls={};
  for(let i=0;i<paths.length;i+=100){
    const {data:s}=await db.storage.from('cleaning-checks').createSignedUrls(paths.slice(i,i+100),3600);
    (s||[]).forEach(x=>{ if(x.signedUrl) urls[x.path]=x.signedUrl; });
  }
  if(!tasks.length){ $('#list').innerHTML='<div class="empty">이 기간에 청소 기록이 없어요.</div>'; return; }
  const byDay={}; tasks.forEach(t=>(byDay[t.scheduled_date]=byDay[t.scheduled_date]||[]).push(t));
  $('#list').innerHTML=Object.keys(byDay).sort().reverse().map(d=>{
    const list=byDay[d].sort((a,b)=>(a.rooms?.room_number||'').localeCompare(b.rooms?.room_number||''));
    const x=new Date(d+'T00:00:00'), sub=list.filter(t=>t.checklist_done_at).length;
    return `<div class="day"><h2>${x.getMonth()+1}/${x.getDate()} (${DOW[x.getDay()]})<span>업로드 ${sub} / ${list.length}</span></h2>
      ${list.map(t=>{
        const ck=t.checklist||{}, n=Object.values(ck).filter(Boolean).length;
        const miss=BASE_ITEMS.filter(k=>!ck[k]).map(k=>ITEM[k]);
        const ph=(t.check_photos||[]).filter(p=>urls[p.path]);
        return `<div class="task"><div class="th"><div><b>${esc(t.rooms?.room_number||'?')}호</b><span class="who">${esc(t.staff?.name||'미배정')}</span></div>
          <div class="st ${t.checklist_done_at?'ok':(n?'':'no')}">${t.checklist_done_at?'업로드됨':(n?'작성 중':'미업로드')} · 체크 ${n}개 · 사진 ${ph.length}장</div></div>
          ${t.checklist_done_at&&miss.length?`<div class="miss">체크 안 된 항목: ${miss.join(', ')}</div>`:''}
          ${t.memo?`<div class="memo">메모 · ${esc(t.memo)}</div>`:''}
          ${(t.cleaning_issues||[]).filter(x=>x.category==='missing_item').map(x=>`<div class="req">${esc(String(x.description||'').replace('[비품 신청] ','비품 신청 · '))}</div>`).join('')}
          ${ph.length?`<div class="ph">${ph.map(p=>`<figure onclick="zoom('${urls[p.path]}')"><img loading="lazy" src="${urls[p.path]}" alt=""><figcaption>${SLOT[p.slot]||esc(p.slot)}</figcaption></figure>`).join('')}</div>`:'<div class="none">올라온 사진 없음</div>'}
        </div>`;}).join('')}</div>`;
  }).join('');
}
function zoom(u){ $('#lbimg').src=u; $('#lb').style.display='flex'; }

/* ── 실장님 링크 ───────────────────────────────────────── */
async function renderLinks(){
  shell(`<div class="note">링크는 발급할 때 한 번만 보여요. 복사해서 그 실장님 카톡으로만 보내주세요.<br>다시 발급하면 예전 링크는 바로 막힙니다. 휴대폰 분실·그만두신 경우엔 "링크 끊기"를 눌러주세요.</div><div id="ls"><div class="empty">불러오는 중…</div></div>`);
  const [{data:st},{data:lk}]=await Promise.all([
    db.from('staff').select('id,name,is_active,role').eq('role','cleaner').eq('is_active',true).order('name'),
    db.from('cleaner_links').select('staff_id,created_at,last_used_at,revoked_at').is('revoked_at',null)]);
  const L={}; (lk||[]).forEach(l=>L[l.staff_id]=l);
  const fmt=v=>v?new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
  $('#ls').innerHTML=(st||[]).map(s=>{const l=L[s.id];return `<div class="row" id="r-${s.id}"><div><b>${esc(s.name)}</b>
    <div class="meta">${l?`링크 있음 · 발급 ${fmt(l.created_at)} · 마지막 접속 ${fmt(l.last_used_at)}`:'링크 없음'}</div></div>
    <div style="display:flex;gap:6px"><button class="btn" onclick="issue('${s.id}')">${l?'다시 발급':'링크 발급'}</button>${l?`<button class="btn ghost" onclick="revoke('${s.id}')">링크 끊기</button>`:''}</div></div>`}).join('')||'<div class="empty">활성 실장님이 없어요.</div>';
}
async function issue(id){
  if(!confirm('새 링크를 발급할까요? 예전 링크는 바로 막힙니다.')) return;
  const {data,error}=await db.rpc('admin_issue_cleaner_link',{p_staff_id:id});
  if(error) return alert('발급 실패: '+error.message);
  await renderLinks();
  const r=document.getElementById('r-'+id), url=CLEANER_URL+data;
  r.insertAdjacentHTML('beforeend',`<div class="link"><input readonly value="${url}" onclick="this.select()"><button class="btn" onclick="navigator.clipboard.writeText('${url}');this.textContent='복사됨'">복사</button></div>`);
}
async function revoke(id){
  if(!confirm('이 실장님 링크를 끊을까요?')) return;
  const {error}=await db.rpc('admin_revoke_cleaner_link',{p_staff_id:id});
  if(error) return alert('실패: '+error.message); renderLinks();
}
start();
const lo=document.getElementById('logoutBtn'); if(lo) lo.onclick=async()=>{ await db.auth.signOut(); location.href='/'; };
</script>
</body>
